<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 368" role="img">
  <title>Targeting specificity funnel</title>
  <desc>A crowd of 24 cells narrows through three filters — retrograde route (12 left), Cre-dependent switch (5 left), and a subtype Cre line — leaving 2 target cells.</desc>
  <style>
    svg{--text:#22221f;--muted:#5f5e5a;--line:#dcdad1;--line-strong:#b4b2a9;--surface:#ffffff;--surface-2:#efede6;--ok:#0f6e56;--track:#5B8DEF;}
    @media (prefers-color-scheme:dark){svg{--text:#f1efe8;--muted:#b4b2a9;--line:#3a3a37;--line-strong:#5f5e5a;--surface:#22221f;--surface-2:#2c2c2a;--ok:#5dcaa5;--track:#7ea6f5;}}
    text{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,sans-serif;fill:var(--text);}
    .flt{font-size:14px;font-weight:600;}
    .cnt{font-size:15px;font-weight:700;fill:var(--muted);}
    .funnel{fill:color-mix(in srgb, var(--line-strong) 10%, var(--surface));stroke:var(--line-strong);stroke-width:2;stroke-linejoin:round;}
    .dot{fill:color-mix(in srgb, var(--line-strong) 30%, var(--surface));stroke:var(--line-strong);stroke-width:1.5;}
    .win{fill:var(--track);stroke:color-mix(in srgb, var(--track) 70%, var(--text));stroke-width:1.5;}
    .band{fill:color-mix(in srgb, var(--muted) 20%, var(--surface));stroke:var(--muted);stroke-width:2;stroke-linejoin:round;}
    .bandOn{fill:var(--track);opacity:0;}
    .lead{stroke:var(--muted);stroke-width:1.5;}
    /* beats: 24 cells · filter 1 → 12 · filter 2 → 5 · filter 3 → 2 targets, then hold */
    .s2{opacity:0;animation:s2 9s ease-in-out infinite;}
    .s3{opacity:0;animation:s3 9s ease-in-out infinite;}
    .s4{opacity:0;animation:s4 9s ease-in-out infinite;}
    .f1{animation:f1 9s ease-in-out infinite;}
    .f2{animation:f2 9s ease-in-out infinite;}
    .f3{animation:f3 9s ease-in-out infinite;}
    @keyframes s2{0%,18%{opacity:0}30%,100%{opacity:1}}
    @keyframes s3{0%,38%{opacity:0}50%,100%{opacity:1}}
    @keyframes s4{0%,58%{opacity:0}70%,100%{opacity:1}}
    @keyframes f1{0%,14%{opacity:0}20%{opacity:.45}30%,100%{opacity:0}}
    @keyframes f2{0%,34%{opacity:0}40%{opacity:.45}50%,100%{opacity:0}}
    @keyframes f3{0%,54%{opacity:0}60%{opacity:.45}70%,100%{opacity:0}}
    @media (prefers-reduced-motion:reduce){
      .s2,.s3,.s4{animation:none;opacity:1}
      .f1,.f2,.f3{animation:none;opacity:0}
    }
  </style>

  <!-- ===== funnel body ===== -->
  <path class="funnel" d="M12 24 L348 24 L208 318 L208 338 L152 338 L152 318 Z"/>

  <!-- ===== stage 1: 24 cells ===== -->
  <g class="dot">
    <circle cx="48" cy="50" r="7"/><circle cx="72" cy="50" r="7"/><circle cx="96" cy="50" r="7"/><circle cx="120" cy="50" r="7"/>
    <circle cx="144" cy="50" r="7"/><circle cx="168" cy="50" r="7"/><circle cx="192" cy="50" r="7"/><circle cx="216" cy="50" r="7"/>
    <circle cx="240" cy="50" r="7"/><circle cx="264" cy="50" r="7"/><circle cx="288" cy="50" r="7"/><circle cx="312" cy="50" r="7"/>
    <circle cx="48" cy="72" r="7"/><circle cx="72" cy="72" r="7"/><circle cx="96" cy="72" r="7"/><circle cx="120" cy="72" r="7"/>
    <circle cx="144" cy="72" r="7"/><circle cx="168" cy="72" r="7"/><circle cx="192" cy="72" r="7"/><circle cx="216" cy="72" r="7"/>
    <circle cx="240" cy="72" r="7"/><circle cx="264" cy="72" r="7"/><circle cx="288" cy="72" r="7"/><circle cx="312" cy="72" r="7"/>
  </g>
  <text class="cnt" x="346" y="18" text-anchor="end">24</text>

  <!-- ===== filter 1 ===== -->
  <path class="band" d="M68 100 L292 100 L288 144 L72 144 Z"/>
  <path class="band bandOn f1" d="M68 100 L292 100 L288 144 L72 144 Z"/>
  <text class="flt" x="180" y="120" text-anchor="middle">retrograde ·</text>
  <text class="flt" x="180" y="138" text-anchor="middle">pancreas-projecting</text>

  <!-- ===== stage 2: 12 left ===== -->
  <g class="s2">
    <g class="dot">
      <circle cx="115" cy="166" r="7"/><circle cx="141" cy="166" r="7"/><circle cx="167" cy="166" r="7"/>
      <circle cx="193" cy="166" r="7"/><circle cx="219" cy="166" r="7"/><circle cx="245" cy="166" r="7"/>
      <circle cx="115" cy="188" r="7"/><circle cx="141" cy="188" r="7"/><circle cx="167" cy="188" r="7"/>
      <circle cx="193" cy="188" r="7"/><circle cx="219" cy="188" r="7"/><circle cx="245" cy="188" r="7"/>
    </g>
    <line class="lead" x1="268" y1="178" x2="288" y2="178"/>
    <text class="cnt" x="294" y="183" text-anchor="start">12</text>
  </g>

  <!-- ===== filter 2 ===== -->
  <path class="band" d="M114 210 L246 210 L240 242 L120 242 Z"/>
  <path class="band bandOn f2" d="M114 210 L246 210 L240 242 L120 242 Z"/>
  <text class="flt" x="180" y="231" text-anchor="middle">DIO · Cre+ only</text>

  <!-- ===== stage 3: 5 left ===== -->
  <g class="s3">
    <g class="dot">
      <circle cx="156" cy="264" r="7"/><circle cx="180" cy="264" r="7"/><circle cx="204" cy="264" r="7"/>
      <circle cx="168" cy="286" r="7"/><circle cx="192" cy="286" r="7"/>
    </g>
    <line class="lead" x1="228" y1="275" x2="244" y2="275"/>
    <text class="cnt" x="250" y="280" text-anchor="start">5</text>
  </g>

  <!-- ===== filter 3 ===== -->
  <path class="band" d="M142 294 L218 294 L206 322 L154 322 Z"/>
  <path class="band bandOn f3" d="M142 294 L218 294 L206 322 L154 322 Z"/>
  <line class="lead" x1="214" y1="308" x2="230" y2="308"/>
  <text class="flt" x="236" y="313" text-anchor="start">subtype Cre line</text>

  <!-- ===== result: 2 targets ===== -->
  <g class="s4">
    <circle class="win" cx="166" cy="352" r="9"/>
    <circle class="win" cx="192" cy="352" r="9"/>
    <text class="cnt" x="212" y="358" text-anchor="start" style="fill:var(--ok)">✓ 2 targets</text>
  </g>
</svg>
