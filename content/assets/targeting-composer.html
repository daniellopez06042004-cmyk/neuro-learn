<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root{--text:#22221f;--muted:#5f5e5a;--line:#dcdad1;--line-strong:#b4b2a9;--surface-2:#efede6;--ok:#0f6e56;--bad:#993c1d;--track:#5B8DEF;--off:#d8d6cd;}
  @media (prefers-color-scheme:dark){:root{--text:#f1efe8;--muted:#b4b2a9;--line:#3a3a37;--line-strong:#5f5e5a;--surface-2:#2c2c2a;--ok:#5dcaa5;--bad:#f0997b;--track:#7ea6f5;--off:#3a3a37;}}
  html,body{background:transparent;margin:0}
  body{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,sans-serif;color:var(--text);font-size:15px}
  .q{font-size:13px;font-weight:700;color:var(--muted);margin:10px 0 5px}
  .opts{display:flex;gap:8px}
  .opts button{flex:1;min-height:44px;border:1.5px solid var(--line-strong);border-radius:12px;background:transparent;color:var(--text);font:inherit;font-weight:600;cursor:pointer;font-size:13px}
  .opts button.sel{border-color:var(--track);background:color-mix(in srgb,var(--track) 16%,transparent)}
  .cells{margin-top:12px;display:flex;flex-direction:column;gap:6px}
  .cell{display:flex;align-items:center;gap:10px;font-size:13px}
  .dot{width:16px;height:16px;border-radius:50%;background:var(--off);flex:none}
  .dot.on{background:var(--track)}
  .readout{margin-top:12px;padding:12px 14px;border-radius:12px;background:var(--surface-2);border:1px solid var(--line)}
  .v{font-weight:700} .v.good{color:var(--ok)} .v.bad{color:var(--bad)} .v.off{color:var(--muted)}
</style></head>
<body>
  <div class="q">1 · Route</div>
  <div class="opts" id="route"><button data-v="retro" class="sel">Retrograde</button><button data-v="local">Local DRG</button></div>
  <div class="q">2 · Switch</div>
  <div class="opts" id="switch"><button data-v="none" class="sel">Non-conditional</button><button data-v="dio">DIO (Cre)</button></div>
  <div class="q">3 · Mouse</div>
  <div class="opts" id="mouse"><button data-v="wt" class="sel">Wild-type</button><button data-v="cre">Subtype Cre</button></div>

  <div class="cells" id="cells">
    <div class="cell" data-id="proj_sub"><span class="dot"></span><span>Pancreas-projecting sensory <b>(target)</b></span></div>
    <div class="cell" data-id="proj_other"><span class="dot"></span><span>Pancreas-projecting, other type</span></div>
    <div class="cell" data-id="nonproj_sub"><span class="dot"></span><span>Sensory, not projecting to pancreas</span></div>
    <div class="cell" data-id="local_other"><span class="dot"></span><span>Non-sensory cell near DRG</span></div>
  </div>
  <div class="readout"><span class="v" id="v"></span></div>
<script>
(function(){
  var route='retro',sw='none',mouse='wt';
  function wire(id,set){document.querySelectorAll('#'+id+' button').forEach(function(b){b.onclick=function(){document.querySelectorAll('#'+id+' button').forEach(function(x){x.classList.remove('sel')});b.classList.add('sel');set(b.dataset.v);render();};});}
  wire('route',function(v){route=v});wire('switch',function(v){sw=v});wire('mouse',function(v){mouse=v});
  var rows={};document.querySelectorAll('.cell').forEach(function(r){rows[r.dataset.id]=r;});
  var v=document.getElementById('v');
  function labeled(id){
    var reached = route==='retro' ? (id==='proj_sub'||id==='proj_other') : (id==='proj_sub'||id==='nonproj_sub'||id==='local_other');
    if(!reached) return false;
    if(sw==='none') return true;
    var isSub=(id==='proj_sub'||id==='nonproj_sub');
    return mouse==='cre' && isSub;
  }
  function render(){
    var tgt=false,off=false,any=false;
    Object.keys(rows).forEach(function(id){var on=labeled(id);rows[id].querySelector('.dot').classList.toggle('on',on);if(on){any=true;if(id==='proj_sub')tgt=true;else off=true;}});
    if(tgt&&!off){v.textContent='✓ clean — only your target';v.className='v good';}
    else if(tgt&&off){v.textContent='⚠ hits target + off-target cells';v.className='v bad';}
    else if(any){v.textContent='✕ misses your target';v.className='v bad';}
    else{v.textContent='nothing expresses (DIO needs Cre)';v.className='v off';}
  }
  render();
})();
</script>
</body></html>
