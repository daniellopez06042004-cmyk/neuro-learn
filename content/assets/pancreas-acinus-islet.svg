<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 330" role="img" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>Exocrine acinus and endocrine islet</title>
  <desc>Left: an exocrine acinus, a ring of acinar cells full of enzyme granules draining into a duct toward the duodenum. Right: a mouse-style endocrine islet with beta cells in the core and alpha and delta cells at the rim, beside a capillary that carries hormones into the blood.</desc>
  <style>
    svg{--text:#22221f;--muted:#5f5e5a;--line:#dcdad1;--line-strong:#b4b2a9;--surface:#ffffff;--surface-2:#efede6;--warn:#ba7517;--bad:#993c1d;--track:#7F77DD;}
    @media (prefers-color-scheme:dark){svg{--text:#f1efe8;--muted:#b4b2a9;--line:#3a3a37;--line-strong:#5f5e5a;--surface:#22221f;--surface-2:#2c2c2a;--warn:#ef9f27;--bad:#f0997b;--track:#9a93e8;}}
    text{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,sans-serif;fill:var(--text);}
    .lbl{font-size:15px;font-weight:600;} .small{font-size:14px;font-weight:400;fill:var(--muted);}
    .lead{stroke:var(--line-strong);stroke-width:1;}
    .acin{fill:var(--surface-2);stroke:var(--line-strong);stroke-width:1.5;}
    .gran{fill:var(--warn);} .nucA{fill:var(--line-strong);}
    .duct{fill:none;stroke:var(--line-strong);stroke-width:7;stroke-linecap:round;}
    .ductIn{fill:none;stroke:var(--surface);stroke-width:3;stroke-linecap:round;}
    .isl{fill:none;stroke:var(--line-strong);stroke-width:1.5;stroke-dasharray:4 4;}
    .beta{fill:var(--track);stroke:var(--surface);stroke-width:1.2;}
    .alpha{fill:var(--warn);stroke:var(--surface);stroke-width:1.2;}
    .delta{fill:var(--muted);stroke:var(--surface);stroke-width:1.2;}
    .cap{fill:none;stroke:var(--bad);stroke-width:4;stroke-linecap:round;opacity:.75;}
  </style>
  <text class="lbl" x="92" y="34" text-anchor="middle">exocrine</text>
  <text class="small" x="92" y="54" text-anchor="middle">acinus → duct</text>
  <path class="acin" d="M71.5 173.6 A50 50 0 0 1 46.4 148.5 L80.1 133.3 A13 13 0 0 0 86.7 139.9 Z"/><path class="acin" d="M45.3 145.7 A50 50 0 0 1 45.3 110.3 L79.8 123.4 A13 13 0 0 0 79.8 132.6 Z"/><path class="acin" d="M46.4 107.5 A50 50 0 0 1 71.5 82.4 L86.7 116.1 A13 13 0 0 0 80.1 122.7 Z"/><path class="acin" d="M74.3 81.3 A50 50 0 0 1 109.7 81.3 L96.6 115.8 A13 13 0 0 0 87.4 115.8 Z"/><path class="acin" d="M112.5 82.4 A50 50 0 0 1 137.6 107.5 L103.9 122.7 A13 13 0 0 0 97.3 116.1 Z"/><path class="acin" d="M138.7 110.3 A50 50 0 0 1 138.7 145.7 L104.2 132.6 A13 13 0 0 0 104.2 123.4 Z"/><path class="acin" d="M137.6 148.5 A50 50 0 0 1 112.5 173.6 L97.3 139.9 A13 13 0 0 0 103.9 133.3 Z"/><circle class="gran" cx="78.4" cy="145.3" r="2.6"/><circle class="gran" cx="70.4" cy="144.2" r="2.6"/><circle class="gran" cx="74.5" cy="139.6" r="2.6"/><circle class="nucA" cx="64.1" cy="155.9" r="4"/><circle class="gran" cx="70.2" cy="130.6" r="2.6"/><circle class="gran" cx="65.3" cy="124.2" r="2.6"/><circle class="gran" cx="71.4" cy="123.8" r="2.6"/><circle class="nucA" cx="52.5" cy="128.0" r="4"/><circle class="gran" cx="74.7" cy="114.4" r="2.6"/><circle class="gran" cx="75.8" cy="106.4" r="2.6"/><circle class="gran" cx="80.4" cy="110.5" r="2.6"/><circle class="nucA" cx="64.1" cy="100.1" r="4"/><circle class="gran" cx="89.4" cy="106.2" r="2.6"/><circle class="gran" cx="95.8" cy="101.3" r="2.6"/><circle class="gran" cx="96.2" cy="107.4" r="2.6"/><circle class="nucA" cx="92.0" cy="88.5" r="4"/><circle class="gran" cx="105.6" cy="110.7" r="2.6"/><circle class="gran" cx="113.6" cy="111.8" r="2.6"/><circle class="gran" cx="109.5" cy="116.4" r="2.6"/><circle class="nucA" cx="119.9" cy="100.1" r="4"/><circle class="gran" cx="113.8" cy="125.4" r="2.6"/><circle class="gran" cx="118.7" cy="131.8" r="2.6"/><circle class="gran" cx="112.6" cy="132.2" r="2.6"/><circle class="nucA" cx="131.5" cy="128.0" r="4"/><circle class="gran" cx="109.3" cy="141.6" r="2.6"/><circle class="gran" cx="108.2" cy="149.6" r="2.6"/><circle class="gran" cx="103.6" cy="145.5" r="2.6"/><circle class="nucA" cx="119.9" cy="155.9" r="4"/>
  <circle cx="92" cy="128" r="10" fill="var(--surface)" stroke="var(--line-strong)" stroke-width="1"/>
  <path class="duct" d="M92 128 L92 236 Q92 250 106 250 L150 250"/>
  <path class="ductIn" d="M92 128 L92 236 Q92 250 106 250 L150 250"/>
  <text class="small" x="84" y="214" text-anchor="end">duct</text>
  <text class="small" x="92" y="276" text-anchor="middle">enzymes → duodenum</text>

  <line x1="180" y1="40" x2="180" y2="290" stroke="var(--line)" stroke-width="1" stroke-dasharray="3 5"/>

  <text class="lbl" x="264" y="34" text-anchor="middle">endocrine</text>
  <text class="small" x="264" y="54" text-anchor="middle">islet → blood</text>
  <circle class="isl" cx="264" cy="124" r="54"/>
  <path class="cap" d="M206 196 Q264 172 330 200"/>
  <circle class="beta" cx="264.0" cy="124.0" r="7.5"/><circle class="beta" cx="277.4" cy="128.1" r="7.5"/><circle class="beta" cx="267.1" cy="137.7" r="7.5"/><circle class="beta" cx="253.7" cy="133.5" r="7.5"/><circle class="beta" cx="250.6" cy="119.9" r="7.5"/><circle class="beta" cx="260.9" cy="110.3" r="7.5"/><circle class="beta" cx="274.3" cy="114.5" r="7.5"/><circle class="beta" cx="287.1" cy="139.8" r="7.5"/><circle class="beta" cx="274.9" cy="149.8" r="7.5"/><circle class="beta" cx="259.2" cy="151.6" r="7.5"/><circle class="beta" cx="245.1" cy="144.6" r="7.5"/><circle class="beta" cx="236.9" cy="131.1" r="7.5"/><circle class="beta" cx="237.4" cy="115.3" r="7.5"/><circle class="beta" cx="246.3" cy="102.3" r="7.5"/><circle class="delta" cx="260.8" cy="96.2" r="7.5"/><circle class="beta" cx="276.4" cy="98.9" r="7.5"/><circle class="beta" cx="288.0" cy="109.5" r="7.5"/><circle class="beta" cx="292.0" cy="124.8" r="7.5"/><circle class="alpha" cx="290.7" cy="157.7" r="7"/><circle class="alpha" cx="275.8" cy="165.3" r="7"/><circle class="alpha" cx="259.1" cy="166.7" r="7"/><circle class="delta" cx="243.1" cy="161.6" r="7"/><circle class="alpha" cx="230.3" cy="150.7" r="7"/><circle class="alpha" cx="222.7" cy="135.8" r="7"/><circle class="alpha" cx="221.3" cy="119.1" r="7"/><circle class="alpha" cx="226.4" cy="103.1" r="7"/><circle class="alpha" cx="237.3" cy="90.3" r="7"/><circle class="alpha" cx="252.2" cy="82.7" r="7"/><circle class="alpha" cx="268.9" cy="81.3" r="7"/><circle class="delta" cx="284.9" cy="86.4" r="7"/><circle class="alpha" cx="297.7" cy="97.3" r="7"/><circle class="alpha" cx="305.3" cy="112.2" r="7"/><circle class="alpha" cx="306.7" cy="128.9" r="7"/><circle class="alpha" cx="301.6" cy="144.9" r="7"/>
  <text class="small" x="264" y="226" text-anchor="middle">capillary → blood</text>

  <g transform="translate(196,248)">
    <circle class="beta" cx="8" cy="0" r="7"/><text class="small" x="22" y="5">β · insulin</text>
    <circle class="alpha" cx="8" cy="22" r="7"/><text class="small" x="22" y="27">α · glucagon</text>
    <circle class="delta" cx="8" cy="44" r="7"/><text class="small" x="22" y="49">δ · somatostatin</text>
  </g>
</svg>
