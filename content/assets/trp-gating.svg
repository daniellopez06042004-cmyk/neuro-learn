<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 300" role="img" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>A TRP channel opens to several triggers</title>
  <desc>A TRP channel sits in the membrane. Heat and capsaicin act on it; the pore opens and cations (sodium and calcium) flow from outside into the cell, depolarizing it.</desc>
  <style>
    svg{--text:#22221f;--muted:#5f5e5a;--line:#dcdad1;--line-strong:#b4b2a9;--surface:#ffffff;--surface-2:#efede6;--warn:#ba7517;--track:#1D9E75;}
    @media (prefers-color-scheme:dark){svg{--text:#f1efe8;--muted:#b4b2a9;--line:#3a3a37;--line-strong:#5f5e5a;--surface:#22221f;--surface-2:#2c2c2a;--warn:#ef9f27;--track:#32c48f;}}
    text{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,sans-serif;fill:var(--text);}
    .lbl{font-size:14px;font-weight:600;} .small{font-size:12px;font-weight:400;fill:var(--muted);}
    .memb{fill:none;stroke:var(--line-strong);stroke-width:2;}
    .pore{fill:var(--surface-2);stroke:var(--track);stroke-width:2.5;}
    .trig{opacity:0;animation:trig 6s ease-in-out infinite;}
    .gL{animation:gL 6s ease-in-out infinite;} .gR{animation:gR 6s ease-in-out infinite;}
    .ion{fill:var(--track);stroke:var(--surface);stroke-width:1;opacity:0;}
    .i1{animation:flow 6s ease-in-out infinite;} .i2{animation:flow 6s ease-in-out infinite;animation-delay:.5s;} .i3{animation:flow 6s ease-in-out infinite;animation-delay:1s;}
    @keyframes trig{0%{opacity:0;transform:translateY(-14px)}14%,46%{opacity:1;transform:translateY(0)}58%,100%{opacity:0}}
    @keyframes gL{0%,24%{transform:translateX(0)}40%,100%{transform:translateX(-12px)}}
    @keyframes gR{0%,24%{transform:translateX(0)}40%,100%{transform:translateX(12px)}}
    @keyframes flow{0%,40%{opacity:0;offset-distance:0%}48%{opacity:1}92%{offset-distance:100%;opacity:1}100%{opacity:0}}
    .i1,.i2,.i3{offset-path:path("M180 120 L180 220");offset-rotate:0deg;}
    @media (prefers-reduced-motion:reduce){
      .trig{animation:none;opacity:1;transform:none}
      .gL{animation:none;transform:translateX(-12px)}
      .gR{animation:none;transform:translateX(12px)}
      .i1,.i2,.i3{animation:none;opacity:1;offset-distance:60%}
    }
  </style>

  <!-- outside / inside labels -->
  <text class="small" x="330" y="96" text-anchor="end">outside</text>
  <text class="small" x="330" y="250" text-anchor="end">inside (cytoplasm)</text>

  <!-- membrane bilayer -->
  <line class="memb" x1="20" y1="150" x2="340" y2="150"/>
  <line class="memb" x1="20" y1="166" x2="340" y2="166"/>

  <!-- triggers above the channel -->
  <g class="trig">
    <path d="M150 64 q6 -8 12 0 q6 8 12 0" fill="none" stroke="var(--warn)" stroke-width="2.5"/>
    <text class="lbl" x="150" y="54" text-anchor="end" style="fill:var(--warn)">heat</text>
    <polygon points="196,58 206,64 206,74 196,80 186,74 186,64" fill="var(--warn)"/>
    <text class="lbl" x="212" y="72" style="fill:var(--warn)">capsaicin</text>
  </g>

  <!-- channel: two pore walls that separate when open -->
  <g class="gL"><rect class="pore" x="158" y="134" width="14" height="48" rx="5"/></g>
  <g class="gR"><rect class="pore" x="188" y="134" width="14" height="48" rx="5"/></g>
  <text class="lbl" x="180" y="126" text-anchor="middle" style="fill:var(--track)">TRP channel</text>

  <!-- cations flowing in through the pore -->
  <g class="ion i1"><circle r="6"/></g>
  <g class="ion i2"><circle r="6"/></g>
  <g class="ion i3"><circle r="6"/></g>
  <text class="lbl" x="206" y="206" style="fill:var(--track)">Na⁺ Ca²⁺ in</text>

  <text class="small" x="180" y="286" text-anchor="middle">cations enter → the cell depolarizes</text>
</svg>
