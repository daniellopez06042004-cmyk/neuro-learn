  <!-- the antigen fits only the third receptor -->
  <g transform="translate(180 0)"><g class="agm"><path class="ag" d="M-11 42 H11 V55 H5 V56 A5 5 0 0 1 -5 56 V55 H-11 Z"/><text x="18" y="53" style="fill:var(--warn)">antigen</text></g></g>
  <g class="sel"><path d="M180 130 V152 M172 144 L180 154 L188 144" style="fill:none;stroke:var(--track);stroke-width:3;stroke-linecap:round;stroke-linejoin:round"/><text x="194" y="147" style="fill:var(--track)">match → selected</text></g>
  <!-- the selected cell multiplies into identical effector clones, plus a memory cell -->
