<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 300" role="img" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>Force opens a Piezo mechanically activated channel</title>
  <desc>A Piezo channel sits in the membrane. A push creates tension in the membrane, which bends the channel open; cations then flow from outside into the cell.</desc>
  <style>
    svg{--text:#22221f;--muted:#5f5e5a;--line:#dcdad1;--line-strong:#b4b2a9;--surface:#ffffff;--surface-2:#efede6;--warn:#ba7517;--track:#1D9E75;}
    @media (prefers-color-scheme:dark){svg{--text:#f1efe8;--muted:#b4b2a9;--line:#3a3a37;--line-strong:#5f5e5a;--surface:#22221f;--surface-2:#2c2c2a;--warn:#ef9f27;--track:#32c48f;}}
    text{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,sans-serif;fill:var(--text);}
    .lbl{font-size:14px;font-weight:600;} .small{font-size:12px;font-weight:400;fill:var(--muted);}
    .memb{fill:none;stroke:var(--line-strong);stroke-width:2;}
    .flat{animation:fade 6s ease-in-out infinite;}
    .bent{opacity:0;animation:appear 6s ease-in-out infinite;}
    .pore{fill:var(--surface-2);stroke:var(--track);stroke-width:2.5;}
    .poreOpen{opacity:0;animation:appear 6s ease-in-out infinite;}
    .probe{animation:push 6s ease-in-out infinite;}
    .ion{fill:var(--track);stroke:var(--surface);stroke-width:1;opacity:0;}
    .i1{animation:flow 6s ease-in-out infinite;animation-delay:.1s;} .i2{animation:flow 6s ease-in-out infinite;animation-delay:.6s;}
    .i1,.i2{offset-path:path("M180 128 L180 224");offset-rotate:0deg;}
    @keyframes push{0%,10%{transform:translateY(-22px)}34%,100%{transform:translateY(0)}}
    @keyframes fade{0%,30%{opacity:1}42%,100%{opacity:0}}
    @keyframes appear{0%,34%{opacity:0}44%,100%{opacity:1}}
    @keyframes flow{0%,44%{opacity:0;offset-distance:0%}52%{opacity:1}92%{offset-distance:100%;opacity:1}100%{opacity:0}}
    @media (prefers-reduced-motion:reduce){
      .probe{animation:none;transform:translateY(0)}
      .flat{animation:none;opacity:0}
      .bent,.poreOpen{animation:none;opacity:1}
      .i1,.i2{animation:none;opacity:1;offset-distance:60%}
    }
  </style>

  <text class="small" x="330" y="96" text-anchor="end">outside</text>
  <text class="small" x="330" y="250" text-anchor="end">inside</text>

  <!-- probe pushing down -->
  <g class="probe">
    <line x1="180" y1="40" x2="180" y2="96" stroke="var(--warn)" stroke-width="3" stroke-linecap="round"/>
    <path d="M172 88 L180 100 L188 88 Z" fill="var(--warn)"/>
    <text class="lbl" x="180" y="34" text-anchor="middle" style="fill:var(--warn)">force</text>
  </g>

  <!-- flat (resting) membrane -->
  <g class="flat">
    <line class="memb" x1="20" y1="150" x2="340" y2="150"/>
    <line class="memb" x1="20" y1="166" x2="340" y2="166"/>
  </g>
  <!-- bent (tense) membrane -->
  <g class="bent">
    <path class="memb" d="M20 150 Q110 150 170 128 Q180 124 190 128 Q250 150 340 150"/>
    <path class="memb" d="M20 166 Q110 166 170 144 Q180 140 190 144 Q250 166 340 166"/>
    <text class="small" x="250" y="134" style="fill:var(--warn)">membrane tension</text>
  </g>

  <!-- closed channel (resting) -->
  <g class="flat"><rect class="pore" x="166" y="134" width="28" height="48" rx="7"/></g>
  <!-- open channel (bent apart) -->
  <g class="poreOpen">
    <rect class="pore" x="156" y="126" width="13" height="50" rx="5"/>
    <rect class="pore" x="191" y="126" width="13" height="50" rx="5"/>
  </g>
  <text class="lbl" x="180" y="120" text-anchor="middle" style="fill:var(--track)">Piezo channel</text>

  <!-- cations in -->
  <g class="ion i1"><circle r="6"/></g>
  <g class="ion i2"><circle r="6"/></g>
  <text class="lbl" x="208" y="210" style="fill:var(--track)">cations in</text>

  <text class="small" x="180" y="286" text-anchor="middle">tension bends the channel open</text>
</svg>
