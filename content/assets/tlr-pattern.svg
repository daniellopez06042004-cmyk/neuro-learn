<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 310" role="img" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>A pattern-recognition receptor senses a shared microbial pattern</title>
  <desc>Three different bacteria each carry the same surface molecule, LPS. An immune cell's TLR4 receptor binds that shared pattern, and the cell switches on a danger response.</desc>
  <style>
    svg{--text:#22221f;--muted:#5f5e5a;--line:#dcdad1;--line-strong:#b4b2a9;--surface:#ffffff;--surface-2:#efede6;--warn:#ba7517;--track:#D4537E;}
    @media (prefers-color-scheme:dark){svg{--text:#f1efe8;--muted:#b4b2a9;--line:#3a3a37;--line-strong:#5f5e5a;--surface:#22221f;--surface-2:#2c2c2a;--warn:#ef9f27;--track:#e67ba0;}}
    text{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,sans-serif;fill:var(--text);}
    .lbl{font-size:14px;font-weight:600;} .small{font-size:12px;font-weight:400;fill:var(--muted);}
    .mic{fill:var(--surface-2);stroke:var(--line-strong);stroke-width:2;}
    .lps{fill:var(--warn);}
    .cell{fill:var(--surface-2);stroke:var(--line-strong);stroke-width:2;}
    .tlr{fill:none;stroke:var(--track);stroke-width:3;stroke-linecap:round;}
    .key{fill:var(--warn);offset-path:path("M180 112 L180 196");offset-rotate:0deg;opacity:0;animation:key 6s ease-in-out infinite;}
    .resp{opacity:0;animation:resp 6s ease-in-out infinite;}
    .onGlow{fill:none;stroke:var(--track);stroke-width:3;opacity:0;animation:resp 6s ease-in-out infinite;}
    @keyframes key{0%,16%{offset-distance:0%;opacity:0}24%{opacity:1}56%{offset-distance:100%;opacity:1}100%{offset-distance:100%;opacity:1}}
    @keyframes resp{0%,60%{opacity:0}74%,100%{opacity:1}}
    @media (prefers-reduced-motion:reduce){.key{animation:none;offset-distance:100%;opacity:1}.resp,.onGlow{animation:none;opacity:1}}
  </style>

  <text class="small" x="180" y="26" text-anchor="middle">different microbes · same surface pattern</text>

  <!-- three different-shaped bacteria, each studded with LPS (amber) -->
  <!-- rod -->
  <rect class="mic" x="40" y="54" width="54" height="24" rx="12"/>
  <rect class="lps" x="52" y="46" width="7" height="10" rx="2"/><rect class="lps" x="68" y="46" width="7" height="10" rx="2"/>
  <!-- oval -->
  <ellipse class="mic" cx="180" cy="66" rx="26" ry="16"/>
  <rect class="lps" x="168" y="46" width="7" height="10" rx="2"/><rect class="lps" x="184" y="46" width="7" height="10" rx="2"/>
  <!-- blob -->
  <circle class="mic" cx="300" cy="66" r="20"/>
  <rect class="lps" x="288" y="42" width="7" height="10" rx="2"/><rect class="lps" x="304" y="42" width="7" height="10" rx="2"/>
  <text class="small" x="330" y="92" text-anchor="end" style="fill:var(--warn)">LPS</text>

  <!-- the shared pattern travelling to the receptor -->
  <rect class="key" x="-4" y="-6" width="8" height="12" rx="2"/>

  <!-- immune cell with TLR4 -->
  <circle class="cell" cx="180" cy="236" r="46"/>
  <!-- TLR groove on top -->
  <path class="tlr" d="M168 196 q12 -6 24 0"/>
  <rect class="lps resp" x="176" y="192" width="8" height="12" rx="2"/>
  <text class="lbl" x="180" y="240" text-anchor="middle">immune cell</text>
  <text class="lbl" x="210" y="196" style="fill:var(--track)">TLR4</text>

  <!-- response -->
  <circle class="onGlow" cx="180" cy="236" r="52"/>
  <text class="lbl resp" x="180" y="300" text-anchor="middle" style="fill:var(--track)">danger detected → respond ✓</text>
</svg>
