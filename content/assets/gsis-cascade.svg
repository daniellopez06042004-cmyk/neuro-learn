<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 330" role="img">
  <title>Glucose-stimulated insulin secretion in a beta cell</title>
  <desc>Glucose (green hexagons) enters a pancreatic beta cell through a GLUT2 transporter and reaches glucokinase; metabolism fills a rising ATP meter. The high ATP closes the K_ATP channel: its two halves slide shut, a cross marks it closed, and the outward potassium flow stops, leaving potassium inside. The membrane potential trace then climbs past the dashed threshold line, the voltage-gated calcium channel opens and calcium enters, and an insulin granule fuses with the membrane and releases insulin outside the cell. End state: K_ATP shut, calcium channel open with calcium inside, granule fused, insulin outside.</desc>
  <style>
    :root,svg{--text:#22221f;--muted:#5f5e5a;--line:#dcdad1;--line-strong:#b4b2a9;--surface:#ffffff;--surface-2:#efede6;--ok:#0f6e56;--bad:#993c1d;--warn:#ba7517;--track:#7F77DD;--lipid:#e8d9c4;}
    @media (prefers-color-scheme:dark){:root,svg{--text:#f1efe8;--muted:#b4b2a9;--line:#3a3a37;--line-strong:#5f5e5a;--surface:#22221f;--surface-2:#2c2c2a;--ok:#5dcaa5;--bad:#f0997b;--warn:#ef9f27;--track:#a39df0;--lipid:#4a4237;}}
    svg{--t1:color-mix(in srgb,var(--track) 22%,var(--surface));--t2:color-mix(in srgb,var(--track) 50%,var(--surface));--t0:color-mix(in srgb,var(--track) 9%,var(--surface));--t3:color-mix(in srgb,var(--track) 78%,var(--text));--w1:color-mix(in srgb,var(--warn) 24%,var(--surface));--glu1:color-mix(in srgb,var(--ok) 24%,var(--surface));--n1:color-mix(in srgb,var(--line-strong) 32%,var(--surface));--n2:color-mix(in srgb,var(--line-strong) 75%,var(--surface));--head:color-mix(in srgb,var(--lipid) 70%,var(--text));--nuc:color-mix(in srgb,var(--muted) 30%,var(--surface-2));}
    text{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,sans-serif;font-size:15px;font-weight:600;fill:var(--text);}
    .m{font-size:13px;font-weight:400;fill:var(--muted);}
    .sub{font-size:12px;font-weight:600;}
    .cyto{fill:var(--t0);}
    .nuc{fill:var(--nuc);}
    .lip{fill:var(--lipid);}
    .hd{fill:none;stroke:var(--head);stroke-width:7;stroke-linecap:round;stroke-dasharray:0 8;}
    .cT{fill:var(--t1);stroke:var(--track);stroke-width:2;}
    .bar{fill:var(--t2);}
    .enz{fill:var(--n1);stroke:var(--line-strong);stroke-width:2;stroke-linejoin:round;}
    .hex{fill:var(--glu1);stroke:var(--ok);stroke-width:2;stroke-linejoin:round;}
    .ion{stroke:var(--surface);stroke-width:1.5;}
    .kion{fill:var(--warn);}
    .caion{fill:var(--track);}
    .ins{fill:var(--t3);}
    .gran{fill:var(--t1);stroke:var(--track);stroke-width:2;}
    .core{fill:var(--t3);}
    .arw{fill:none;stroke:var(--line-strong);stroke-width:3;stroke-linecap:round;stroke-linejoin:round;}
    .vm{fill:none;stroke:var(--track);stroke-width:2.5;stroke-linecap:round;}
    .thr{fill:none;stroke:var(--warn);stroke-width:1.5;stroke-dasharray:5 4;}
    .badge{fill:var(--surface);stroke:var(--line-strong);stroke-width:2;}
    .xm{fill:none;stroke:var(--muted);stroke-width:3;stroke-linecap:round;}

    .g1{animation:g1 10s ease-in-out infinite;}
    @keyframes g1{0%,3%{transform:translate(-16px,-100px)}8%{transform:translate(1px,-66px)}12%{transform:translate(1px,-26px)}16%,100%{transform:translate(0,0)}}
    .g2{animation:g2 10s ease-in-out infinite;}
    @keyframes g2{0%,6%{transform:translate(6px,-126px)}10%{transform:translate(-33px,-88px)}14%{transform:translate(-33px,-46px)}18%,100%{transform:translate(0,0)}}
    .aEnz{opacity:1;animation:aEnz 10s ease-in-out infinite;}
    @keyframes aEnz{0%,11%{opacity:0}15%,100%{opacity:1}}
    .atpFill{transform-origin:112px 209px;animation:atp 10s ease-in-out infinite;}
    @keyframes atp{0%,15%{transform:scaleY(.14)}28%,100%{transform:scaleY(1)}}
    .k1{opacity:0;animation:k1 10s linear infinite;}
    @keyframes k1{0%{opacity:1;transform:translateY(80px)}7%{opacity:1;transform:translateY(0)}9%,100%{opacity:0;transform:translateY(0)}}
    .k2{opacity:0;animation:k2 10s linear infinite;}
    @keyframes k2{0%,10%{opacity:0;transform:translateY(88px)}11%{opacity:1;transform:translateY(80px)}18%{opacity:1;transform:translateY(0)}20%,100%{opacity:0;transform:translateY(0)}}
    .k3{opacity:0;animation:k3 10s linear infinite;}
    @keyframes k3{0%,20%{opacity:0;transform:translateY(88px)}21%{opacity:1;transform:translateY(80px)}28%{opacity:1;transform:translateY(0)}30%,100%{opacity:0;transform:translateY(0)}}
    .kL{animation:kL 10s ease-in-out infinite;}
    @keyframes kL{0%,28%{transform:translateX(-7px)}40%,100%{transform:translateX(0)}}
    .kR{animation:kR 10s ease-in-out infinite;}
    @keyframes kR{0%,28%{transform:translateX(7px)}40%,100%{transform:translateX(0)}}
    .xb{opacity:1;animation:xb 10s ease-in-out infinite;}
    @keyframes xb{0%,38%{opacity:0}42%,100%{opacity:1}}
    .aAtp{opacity:1;animation:aAtp 10s ease-in-out infinite;}
    @keyframes aAtp{0%,26%{opacity:0}30%,100%{opacity:1}}
    .vmR{stroke-dasharray:100 100;stroke-dashoffset:0;animation:vmR 10s ease-in-out infinite;}
    @keyframes vmR{0%,40%{stroke-dashoffset:100}52%,100%{stroke-dashoffset:0}}
    .aCa{opacity:1;animation:aCa 10s ease-in-out infinite;}
    @keyframes aCa{0%,50%{opacity:0}54%,100%{opacity:1}}
    .caL{animation:caL 10s ease-in-out infinite;}
    @keyframes caL{0%,52%{transform:translateX(7px)}60%,100%{transform:translateX(0)}}
    .caR{animation:caR 10s ease-in-out infinite;}
    @keyframes caR{0%,52%{transform:translateX(-7px)}60%,100%{transform:translateX(0)}}
    .c1{animation:c1 10s ease-in-out infinite;}
    @keyframes c1{0%,54%{transform:translate(-34px,-142px)}60%{transform:translate(-10px,-102px)}64%{transform:translate(-10px,-68px)}68%,100%{transform:translate(0,0)}}
    .c2{animation:c2 10s ease-in-out infinite;}
    @keyframes c2{0%,57%{transform:translate(-30px,-176px)}62%{transform:translate(-34px,-130px)}66%{transform:translate(-34px,-96px)}71%,100%{transform:translate(0,0)}}
    .c3{animation:c3 10s ease-in-out infinite;}
    @keyframes c3{0%,60%{transform:translate(-30px,-198px)}65%{transform:translate(-48px,-156px)}69%{transform:translate(-48px,-122px)}74%,100%{transform:translate(0,0)}}
    .gMv{opacity:0;animation:gMv 10s ease-in-out infinite;}
    @keyframes gMv{0%,60%{opacity:1;transform:translateY(116px)}72%,76%{opacity:1;transform:translateY(0)}78%,100%{opacity:0;transform:translateY(0)}}
    .gFz{opacity:1;animation:gFz 10s ease-in-out infinite;}
    @keyframes gFz{0%,74%{opacity:0}78%,100%{opacity:1}}
    .i1{animation:i1 10s ease-in-out infinite;}
    @keyframes i1{0%,74%{opacity:0;transform:translate(10px,64px)}76%{opacity:1;transform:translate(8px,54px)}83%,100%{opacity:1;transform:translate(0,0)}}
    .i2{animation:i2 10s ease-in-out infinite;}
    @keyframes i2{0%,76%{opacity:0;transform:translate(-12px,72px)}78%{opacity:1;transform:translate(-10px,60px)}85%,100%{opacity:1;transform:translate(0,0)}}
    .i3{animation:i3 10s ease-in-out infinite;}
    @keyframes i3{0%,78%{opacity:0;transform:translate(-2px,78px)}80%{opacity:1;transform:translate(-2px,66px)}85%,100%{opacity:1;transform:translate(0,0)}}
    .xw{fill-opacity:1;animation:xw 10s ease-in-out infinite;}
    @keyframes xw{0%,38%{fill-opacity:0}42%,100%{fill-opacity:1}}
    @media (prefers-reduced-motion:reduce){*{animation:none!important;}}
  </style>

  <!-- the beta cell: cytoplasm and nucleus -->
  <path class="cyto" d="M12 98 H348 V290 Q348 310 326 312 Q250 317 180 315 Q108 313 34 312 Q12 310 12 290 Z"/>
  <ellipse class="nuc" cx="58" cy="274" rx="38" ry="25"/>
  <path d="M30 274 C38 264 48 284 58 274 C68 264 78 284 86 274" style="fill:none;stroke:var(--line-strong);stroke-width:2;stroke-linecap:round"/>

  <!-- plasma membrane: lipid band with two rows of head groups -->
  <rect class="lip" x="12" y="64" width="336" height="34"/>
  <path class="hd" d="M16 67.5 H344"/>
  <path class="hd" d="M16 94.5 H344"/>

  <!-- fused granule: a pore cut through the membrane (end state) -->
  <g class="gFz">
    <path d="M316 64 C316 82 306 88 306 104 C306 120 314 130 324 130 C334 130 342 120 342 104 C342 88 332 82 332 64 Z" style="fill:var(--t1)"/>
    <path d="M316 64 C316 82 306 88 306 104 C306 120 314 130 324 130 C334 130 342 120 342 104 C342 88 332 82 332 64" style="fill:none;stroke:var(--track);stroke-width:2"/>
  </g>

  <!-- GLUT2 transporter: open pore -->
  <g><rect class="cT" x="24" y="54" width="16" height="54" rx="8"/><rect class="bar" x="33" y="60" width="5" height="42" rx="2.5"/></g>
  <g><rect class="cT" x="54" y="54" width="16" height="54" rx="8"/><rect class="bar" x="56" y="60" width="5" height="42" rx="2.5"/></g>

  <!-- K_ATP channel: two subunits slide shut -->
  <g class="kL"><rect class="cT" x="141" y="54" width="16" height="54" rx="8"/><rect class="bar" x="150" y="60" width="5" height="42" rx="2.5"/></g>
  <g class="kR"><rect class="cT" x="159" y="54" width="16" height="54" rx="8"/><rect class="bar" x="161" y="60" width="5" height="42" rx="2.5"/></g>

  <!-- voltage-gated Ca channel: two subunits open apart -->
  <g class="caL"><rect class="cT" x="234" y="54" width="16" height="54" rx="8"/><rect class="bar" x="243" y="60" width="5" height="42" rx="2.5"/></g>
  <g class="caR"><rect class="cT" x="266" y="54" width="16" height="54" rx="8"/><rect class="bar" x="268" y="60" width="5" height="42" rx="2.5"/></g>

  <!-- glucokinase -->
  <path class="enz" d="M32 162 C32 148 42 138 56 138 C63 138 67 142 69 146 C71 151 76 153 81 155 C86 158 85 164 85 168 C85 180 74 188 57 188 C40 188 32 176 32 162 Z"/>

  <!-- glucose outside, and two molecules that come in through GLUT2 -->
  <g transform="translate(20 42)"><path class="hex" d="M0 -7.5 L6.5 -3.8 L6.5 3.8 L0 7.5 L-6.5 3.8 L-6.5 -3.8 Z"/></g>
  <g transform="translate(108 36)"><path class="hex" d="M0 -7.5 L6.5 -3.8 L6.5 3.8 L0 7.5 L-6.5 3.8 L-6.5 -3.8 Z"/></g>
  <g transform="translate(128 50)"><path class="hex" d="M0 -7.5 L6.5 -3.8 L6.5 3.8 L0 7.5 L-6.5 3.8 L-6.5 -3.8 Z"/></g>
  <g transform="translate(46 122)"><g class="g1"><path class="hex" d="M0 -7.5 L6.5 -3.8 L6.5 3.8 L0 7.5 L-6.5 3.8 L-6.5 -3.8 Z"/></g></g>
  <g transform="translate(80 146)"><g class="g2"><path class="hex" d="M0 -7.5 L6.5 -3.8 L6.5 3.8 L0 7.5 L-6.5 3.8 L-6.5 -3.8 Z"/></g></g>

  <!-- metabolism raises ATP -->
  <g class="aEnz"><path class="arw" d="M86 184 H93"/><path class="arw" d="M92 179 L98 184 L92 189"/></g>
  <rect x="100" y="150" width="24" height="62" rx="6" style="fill:var(--surface-2);stroke:var(--line-strong);stroke-width:1.5"/>
  <g class="atpFill"><rect x="103" y="153" width="18" height="56" rx="3" style="fill:var(--ok)"/></g>

  <!-- ATP closes the K_ATP channel -->
  <g class="aAtp"><path class="arw" d="M126 152 C136 140 141 127 148 115"/><path class="arw" d="M142 120 L149 112 L156 118"/></g>

  <!-- K+ leaving through K_ATP, until it shuts; some stay inside -->
  <g transform="translate(158 54)"><g class="k1"><circle class="ion kion" r="5"/></g></g>
  <g transform="translate(158 54)"><g class="k2"><circle class="ion kion" r="5"/></g></g>
  <g transform="translate(158 54)"><g class="k3"><circle class="ion kion" r="5"/></g></g>
  <circle class="ion kion" cx="164" cy="122" r="5"/>
  <circle class="ion kion" cx="184" cy="136" r="5"/>

  <!-- the closed badge -->
  <g class="xb"><circle class="badge" cx="152" cy="34" r="11"/><path class="xm" d="M147 29 L157 39 M157 29 L147 39"/></g>

  <!-- membrane potential climbs past threshold -->
  <path class="thr" d="M146 174 H254"/>
  <path class="vm" d="M148 196 H180"/>
  <path class="vm vmR" pathLength="100" d="M180 196 C198 196 208 160 244 156"/>
  <g class="aCa"><path class="arw" d="M246 150 C252 138 250 128 254 118"/><path class="arw" d="M248 124 L254 115 L260 123"/></g>

  <!-- Ca2+ outside and entering -->
  <circle class="ion caion" cx="262" cy="54" r="5"/>
  <g transform="translate(268 168)"><g class="c1"><circle class="ion caion" r="5"/></g></g>
  <g transform="translate(292 196)"><g class="c2"><circle class="ion caion" r="5"/></g></g>
  <g transform="translate(306 222)"><g class="c3"><circle class="ion caion" r="5"/></g></g>

  <!-- insulin granules; one rises and fuses -->
  <g><circle class="gran" cx="236" cy="286" r="11"/><circle class="core" cx="236" cy="286" r="5"/></g>
  <g><circle class="gran" cx="130" cy="286" r="11"/><circle class="core" cx="130" cy="286" r="5"/></g>
  <g><circle class="gran" cx="176" cy="296" r="11"/><circle class="core" cx="176" cy="296" r="5"/></g>
  <g><circle class="gran" cx="218" cy="256" r="11"/><circle class="core" cx="218" cy="256" r="5"/></g>
  <g><circle class="gran" cx="284" cy="258" r="11"/><circle class="core" cx="284" cy="258" r="5"/></g>
  <g class="gMv"><circle class="gran" cx="324" cy="116" r="12"/><circle class="core" cx="324" cy="116" r="5.5"/></g>

  <!-- insulin released outside -->
  <g transform="translate(314 52)"><g class="i1"><circle class="ins" r="5"/></g></g>
  <g transform="translate(338 46)"><g class="i2"><circle class="ins" r="5"/></g></g>
  <g transform="translate(326 36)"><g class="i3"><circle class="ins" r="5"/></g></g>

  <text x="74" y="118">GLUT2</text>
  <text x="12" y="206">glucokinase</text>
  <text x="112" y="228" text-anchor="middle">ATP ↑</text>
  <text x="168" y="40">K<tspan class="sub" dy="4">ATP</tspan><tspan class="xw" dy="-4"> closed</tspan></text>
  <text x="268" y="150">Ca²⁺</text>
  <text x="346" y="24" text-anchor="end">insulin</text>
  <text class="m" x="196" y="130">K⁺</text>
  <text class="m" x="156" y="226">depolarizes</text>
</svg>
