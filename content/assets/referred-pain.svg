  <g class="gmo"><ellipse cx="140" cy="124" rx="14" ry="27" transform="rotate(-16 140 124)"/><ellipse cx="212" cy="124" rx="14" ry="27" transform="rotate(16 212 124)"/><ellipse cx="140" cy="170" rx="27" ry="18"/><ellipse cx="212" cy="170" rx="27" ry="18"/><rect x="140" y="142" width="72" height="16" rx="6"/></g>
  <g class="gm"><ellipse cx="140" cy="124" rx="14" ry="27" transform="rotate(-16 140 124)"/><ellipse cx="212" cy="124" rx="14" ry="27" transform="rotate(16 212 124)"/><ellipse cx="140" cy="170" rx="27" ry="18"/><ellipse cx="212" cy="170" rx="27" ry="18"/><rect x="140" y="142" width="72" height="16" rx="6"/></g>
  <circle cx="176" cy="150" r="2.5" style="fill:var(--line-strong)"/>
  <text class="lbl" x="216" y="84" text-anchor="middle">T1–T4 dorsal horn</text>
  <ellipse class="drg" cx="316" cy="136" rx="28" ry="44"/>
  <text class="lbl" x="316" y="84" text-anchor="middle">DRG</text>
