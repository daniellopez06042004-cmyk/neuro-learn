<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 300" role="img">
  <title>Indirect immunofluorescence: one primary, several glowing secondaries</title>
  <desc>A target protein sits in the cell membrane with a notch-shaped epitope on top. An unlabeled rabbit primary antibody binds the notch with the tip of one Fab arm, its Fc stem pointing up. Then three fluorescent anti-rabbit secondary antibodies bind the stem of that one primary, and their dyes light up, so a single primary carries several labels.</desc>
  <style>
    :root,svg{--text:#22221f;--muted:#5f5e5a;--line:#dcdad1;--line-strong:#b4b2a9;--surface:#ffffff;--surface-2:#efede6;--ok:#0f6e56;--bad:#993c1d;--warn:#ba7517;--track:#5B8DEF;--lipid:#e8d9c4;}
    @media (prefers-color-scheme:dark){:root,svg{--text:#f1efe8;--muted:#b4b2a9;--line:#3a3a37;--line-strong:#5f5e5a;--surface:#22221f;--surface-2:#2c2c2a;--ok:#5dcaa5;--bad:#f0997b;--warn:#ef9f27;--track:#7ea6f5;--lipid:#4a4237;}}
    svg{--t0:color-mix(in srgb,var(--track) 9%,var(--surface));--t1:color-mix(in srgb,var(--track) 22%,var(--surface));--t2:color-mix(in srgb,var(--track) 50%,var(--surface));--t3:color-mix(in srgb,var(--track) 70%,var(--text));--b1:color-mix(in srgb,var(--bad) 22%,var(--surface));--w1:color-mix(in srgb,var(--warn) 24%,var(--surface));--n1:color-mix(in srgb,var(--line-strong) 32%,var(--surface));--n2:color-mix(in srgb,var(--line-strong) 75%,var(--surface));--head:color-mix(in srgb,var(--lipid) 70%,var(--text));--tissue:color-mix(in srgb,#e8b4b0 30%,var(--surface-2));--tissue-hi:color-mix(in srgb,#e8b4b0 55%,var(--surface-2));--tissue-line:color-mix(in srgb,#e8b4b0 45%,var(--line-strong));}
    text{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,sans-serif;font-size:14px;font-weight:600;fill:var(--text);}
    .m{font-weight:400;fill:var(--muted);}
    .lip{fill:var(--lipid);}
    .hd{fill:none;stroke:var(--head);stroke-width:7;stroke-linecap:round;stroke-dasharray:0 8;}
    .prot{fill:var(--tissue-hi);stroke:var(--tissue-line);stroke-width:2;stroke-linejoin:round;}
    .fl{fill:color-mix(in srgb,var(--track) 40%,#ffffff);stroke:var(--track);stroke-width:1.5;stroke-linejoin:round;}
    .lead{fill:none;stroke:var(--muted);stroke-width:1.5;stroke-linecap:round;}
    .note{font-size:13px;font-weight:400;fill:var(--muted);}
    .pin{animation:pin 9s ease-in-out infinite;}
    @keyframes pin{0%,9%{opacity:0;transform:translateY(-60px)}26%,95%{opacity:1;transform:translateY(0)}99%,100%{opacity:0;transform:translateY(0)}}
    .s0{animation:s0 9s ease-out infinite;}
    @keyframes s0{0%,32%{opacity:0;transform:translate(11.4px,-42.5px)}42%,95%{opacity:1;transform:translate(0px,0px)}99%,100%{opacity:0;transform:translate(0px,0px)}}
    .s1{animation:s1 9s ease-out infinite;}
    @keyframes s1{0%,39%{opacity:0;transform:translate(-42.5px,-11.4px)}49%,95%{opacity:1;transform:translate(0px,0px)}99%,100%{opacity:0;transform:translate(0px,0px)}}
    .s2{animation:s2 9s ease-out infinite;}
    @keyframes s2{0%,46%{opacity:0;transform:translate(42.5px,11.4px)}56%,95%{opacity:1;transform:translate(0px,0px)}99%,100%{opacity:0;transform:translate(0px,0px)}}
    .glow{opacity:0;animation:glow 9s ease-in-out infinite;}
    @keyframes glow{0%,60%{opacity:0}70%,95%{opacity:1}99%,100%{opacity:0}}
    .Lp{opacity:0;animation:Lp 9s ease-in-out infinite;}@keyframes Lp{0%,20%{opacity:0}28%,95%{opacity:1}99%,100%{opacity:0}}
    .Ls{opacity:0;animation:Ls 9s ease-in-out infinite;}@keyframes Ls{0%,46%{opacity:0}54%,95%{opacity:1}99%,100%{opacity:0}}
    @media (prefers-reduced-motion:reduce){*{animation-delay:-8.0s!important;animation-play-state:paused!important;}}
  </style>

  <defs><radialGradient id="fg" cx="50%" cy="50%" r="50%"><stop offset="0" style="stop-color:var(--track);stop-opacity:.75"/><stop offset=".45" style="stop-color:var(--track);stop-opacity:.3"/><stop offset="1" style="stop-color:var(--track);stop-opacity:0"/></radialGradient></defs>
  <rect class="lip" x="12" y="248" width="336" height="34" rx="4"/><path class="hd" d="M16 251.5H348"/><path class="hd" d="M16 278.5H348"/>
  <path class="prot" d="M150 292 C146 258 148 206 152 186 C154 176 155.5 178.8 163.5 180.8 L180 195 L187.7 174.3 C195.7 173.3 206 176 208 186 C212 206 214 258 210 292 Z"/>
  <g class="pin"><path d="M175.9 178.5L164.5 136L133.4 167.2M164.5 136L178.4 83.9" style="fill:none;stroke:var(--muted);stroke-width:17;stroke-linecap:round;stroke-linejoin:round"/><polygon points="186,173.8 180,194 164.7,179.5" style="fill:var(--muted);stroke:var(--muted);stroke-width:4;stroke-linejoin:round"/><polygon points="142.6,173.5 122,178.5 127,158" style="fill:var(--muted);stroke:var(--muted);stroke-width:4;stroke-linejoin:round"/><path d="M175.9 178.5L164.5 136L133.4 167.2M164.5 136L178.4 83.9" style="fill:none;stroke:var(--n1);stroke-width:13;stroke-linecap:round;stroke-linejoin:round"/><polygon points="186,173.8 180,194 164.7,179.5" style="fill:var(--n1)"/><polygon points="142.6,173.5 122,178.5 127,158" style="fill:var(--n1)"/><path d="M173 167.9L175.9 178.5" style="fill:none;stroke:#ffffff;stroke-opacity:.4;stroke-width:8;stroke-linecap:round"/><path d="M141.1 159.4L133.4 167.2" style="fill:none;stroke:#ffffff;stroke-opacity:.4;stroke-width:8;stroke-linecap:round"/></g>
  <g class="s0"><path d="M180.3 77.1L188.5 46.2L157.6 54.5M188.5 46.2L215.4 19.3" style="fill:none;stroke:var(--track);stroke-width:15;stroke-linecap:round;stroke-linejoin:round"/><path d="M180.3 77.1L188.5 46.2L157.6 54.5M188.5 46.2L215.4 19.3" style="fill:none;stroke:var(--t1);stroke-width:11;stroke-linecap:round;stroke-linejoin:round"/><path d="M183.1 66.5L180.3 77.1" style="fill:none;stroke:#ffffff;stroke-opacity:.4;stroke-width:6;stroke-linecap:round"/><path d="M168.3 51.6L157.6 54.5" style="fill:none;stroke:#ffffff;stroke-opacity:.4;stroke-width:6;stroke-linecap:round"/><polygon class="fl" points="215.4,9.3 218.1,15.6 224.9,16.3 219.8,20.8 221.3,27.4 215.4,23.9 209.5,27.4 211,20.8 205.9,16.3 212.7,15.6"/></g>
  <g class="s1"><path d="M165.5 101.1L134.6 92.9L157.3 70.2M134.6 92.9L97.9 102.7" style="fill:none;stroke:var(--track);stroke-width:15;stroke-linecap:round;stroke-linejoin:round"/><path d="M165.5 101.1L134.6 92.9L157.3 70.2M134.6 92.9L97.9 102.7" style="fill:none;stroke:var(--t1);stroke-width:11;stroke-linecap:round;stroke-linejoin:round"/><path d="M154.9 98.3L165.5 101.1" style="fill:none;stroke:#ffffff;stroke-opacity:.4;stroke-width:6;stroke-linecap:round"/><path d="M149.5 78L157.3 70.2" style="fill:none;stroke:#ffffff;stroke-opacity:.4;stroke-width:6;stroke-linecap:round"/><polygon class="fl" points="97.9,92.7 100.6,99 107.4,99.6 102.3,104.1 103.8,110.8 97.9,107.3 92.1,110.8 93.6,104.1 88.4,99.6 95.2,99"/></g>
  <g class="s2"><path d="M176.3 122.7L207.2 130.9L184.6 153.6M207.2 130.9L244 121.1" style="fill:none;stroke:var(--track);stroke-width:15;stroke-linecap:round;stroke-linejoin:round"/><path d="M176.3 122.7L207.2 130.9L184.6 153.6M207.2 130.9L244 121.1" style="fill:none;stroke:var(--t1);stroke-width:11;stroke-linecap:round;stroke-linejoin:round"/><path d="M187 125.5L176.3 122.7" style="fill:none;stroke:#ffffff;stroke-opacity:.4;stroke-width:6;stroke-linecap:round"/><path d="M192.4 145.8L184.6 153.6" style="fill:none;stroke:#ffffff;stroke-opacity:.4;stroke-width:6;stroke-linecap:round"/><polygon class="fl" points="244,111.1 246.7,117.4 253.5,118 248.3,122.5 249.8,129.2 244,125.7 238.1,129.2 239.6,122.5 234.4,118 241.3,117.4"/></g>
  <g class="glow"><circle cx="215.4" cy="19.3" r="26" fill="url(#fg)"/><circle cx="97.9" cy="102.7" r="26" fill="url(#fg)"/><circle cx="244" cy="121.1" r="26" fill="url(#fg)"/></g>
  <g class="glow"><polygon class="fl" points="215.4,9.3 218.1,15.6 224.9,16.3 219.8,20.8 221.3,27.4 215.4,23.9 209.5,27.4 211,20.8 205.9,16.3 212.7,15.6"/><polygon class="fl" points="97.9,92.7 100.6,99 107.4,99.6 102.3,104.1 103.8,110.8 97.9,107.3 92.1,110.8 93.6,104.1 88.4,99.6 95.2,99"/><polygon class="fl" points="244,111.1 246.7,117.4 253.5,118 248.3,122.5 249.8,129.2 244,125.7 238.1,129.2 239.6,122.5 234.4,118 241.3,117.4"/></g>
  <path class="lead" d="M122 225L148 220"/><text x="14" y="230">target protein</text>
  <g class="Lp"><text x="214" y="178">rabbit primary</text><text class="note" x="214" y="196">unlabeled</text></g>
  <g class="Ls"><text x="14" y="28">fluorescent secondaries</text><text class="note" x="14" y="46">anti-rabbit</text></g>
</svg>
