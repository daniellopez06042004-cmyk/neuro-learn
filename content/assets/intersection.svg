<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 250" role="img" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>Intersectional genetics: Cre AND Flp</title>
  <desc>Three neurons. Cre-only and Flp-only stay off; only the neuron with both Cre and Flp turns its payload on.</desc>
  <style>
    svg{--text:#22221f;--muted:#5f5e5a;--line-strong:#b4b2a9;--surface-2:#efede6;--ok:#0f6e56;--bad:#993c1d;--cre:#5B8DEF;--flp:#7F77DD;}
    @media (prefers-color-scheme:dark){svg{--text:#f1efe8;--muted:#b4b2a9;--line-strong:#5f5e5a;--surface-2:#2c2c2a;--ok:#5dcaa5;--bad:#f0997b;--cre:#7ea6f5;--flp:#9a93e8;}}
    text{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,sans-serif;fill:var(--text);}
    .lbl{font-size:15px;font-weight:600;} .st{font-size:13px;font-weight:600;}
    .den{fill:none;stroke:var(--line-strong);stroke-width:2.5;stroke-linecap:round;}
    .axon{fill:none;stroke:var(--line-strong);stroke-width:2.5;stroke-linecap:round;}
    .soma{fill:var(--surface-2);stroke:var(--cre);stroke-width:2.5;}
    .somaOn{fill:var(--cre);}
    .pulse{animation:pulse 5s ease-in-out infinite;transform-origin:180px 128px;}
    .ring{fill:none;stroke:var(--cre);stroke-width:2.5;opacity:0;animation:ring 5s ease-out infinite;transform-origin:180px 128px;}
    @keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
    @keyframes ring{0%{transform:scale(.7);opacity:.5}70%{opacity:0}100%{transform:scale(1.8);opacity:0}}
    @media (prefers-reduced-motion:reduce){.pulse{animation:none}.ring{animation:none;opacity:0}}
  </style>

  <!-- badges -->
  <g font-size="14" font-weight="600" text-anchor="middle">
    <rect x="52" y="40" width="40" height="24" rx="12" fill="var(--cre)"/><text x="72" y="57" fill="#fff">Cre</text>
    <rect x="140" y="40" width="40" height="24" rx="12" fill="var(--cre)"/><text x="160" y="57" fill="#fff">Cre</text>
    <rect x="184" y="40" width="40" height="24" rx="12" fill="var(--flp)"/><text x="204" y="57" fill="#fff">Flp</text>
    <rect x="268" y="40" width="40" height="24" rx="12" fill="var(--flp)"/><text x="288" y="57" fill="#fff">Flp</text>
  </g>

  <!-- neuron glyph, three times. soma centers x=72,180,288 y=128 -->
  <!-- col 1: Cre only, off -->
  <g transform="translate(72,128)">
    <g class="den"><path d="M-5,-9 C -13,-20 -20,-24 -28,-31"/><path d="M5,-9 C 13,-20 20,-24 28,-31"/><path d="M-10,-3 C -24,-8 -32,-8 -41,-7"/><path d="M0,-12 C -1,-26 1,-31 0,-40"/></g>
    <path class="axon" d="M0,12 C 2,28 -2,38 0,52"/>
    <circle class="soma" r="13"/>
  </g>
  <text class="st" x="72" y="196" text-anchor="middle" fill="var(--bad)">✕ off</text>
  <text class="lbl" x="72" y="220" text-anchor="middle">Cre only</text>

  <!-- col 2: Cre + Flp, ON -->
  <g transform="translate(180,128)">
    <g class="den"><path d="M-5,-9 C -13,-20 -20,-24 -28,-31"/><path d="M5,-9 C 13,-20 20,-24 28,-31"/><path d="M-10,-3 C -24,-8 -32,-8 -41,-7"/><path d="M0,-12 C -1,-26 1,-31 0,-40"/></g>
    <path class="axon" d="M0,12 C 2,28 -2,38 0,52"/>
  </g>
  <circle class="ring" cx="180" cy="128" r="13"/>
  <g class="pulse"><circle class="soma somaOn" cx="180" cy="128" r="13"/></g>
  <text class="st" x="180" y="196" text-anchor="middle" fill="var(--ok)">✓ ON</text>
  <text class="lbl" x="180" y="220" text-anchor="middle">Cre + Flp</text>

  <!-- col 3: Flp only, off -->
  <g transform="translate(288,128)">
    <g class="den"><path d="M-5,-9 C -13,-20 -20,-24 -28,-31"/><path d="M5,-9 C 13,-20 20,-24 28,-31"/><path d="M-10,-3 C -24,-8 -32,-8 -41,-7"/><path d="M0,-12 C -1,-26 1,-31 0,-40"/></g>
    <path class="axon" d="M0,12 C 2,28 -2,38 0,52"/>
    <circle class="soma" style="stroke:var(--flp)" r="13"/>
  </g>
  <text class="st" x="288" y="196" text-anchor="middle" fill="var(--bad)">✕ off</text>
  <text class="lbl" x="288" y="220" text-anchor="middle">Flp only</text>
</svg>
