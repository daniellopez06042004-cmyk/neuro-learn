<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 344" role="img">
  <title>hM3Dq excites, hM4Di silences</title>
  <desc>The same drug docks two engineered receptors: hM3Dq couples to Gq and the neuron fires; hM4Di couples to Gi/o and the neuron goes quiet.</desc>
  <style>
    svg{--text:#22221f;--muted:#5f5e5a;--line:#dcdad1;--line-strong:#b4b2a9;--surface:#ffffff;--surface-2:#efede6;--lipid:#e8d9c4;--ok:#0f6e56;--warn:#ba7517;--track:#5B8DEF;}
    @media (prefers-color-scheme:dark){svg{--text:#f1efe8;--muted:#b4b2a9;--line:#3a3a37;--line-strong:#5f5e5a;--surface:#22221f;--surface-2:#2c2c2a;--lipid:#4a4237;--ok:#5dcaa5;--warn:#ef9f27;--track:#7ea6f5;}}
    text{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,sans-serif;fill:var(--text);}
    .lbl{font-size:16px;font-weight:600;}
    .small{font-size:14px;font-weight:600;fill:var(--muted);}
    .lipid{fill:var(--lipid);stroke:none;}
    .head{fill:var(--line-strong);}
    .gpcr{fill:color-mix(in srgb, var(--track) 30%, var(--surface));stroke:var(--track);stroke-width:2;}
    .gprot{fill:color-mix(in srgb, var(--track) 16%, var(--surface));stroke:var(--track);stroke-width:2;}
    .drugF{fill:color-mix(in srgb, var(--warn) 70%, var(--surface));stroke:var(--warn);stroke-width:2;}
    .den{fill:none;stroke:var(--line-strong);stroke-width:2.5;stroke-linecap:round;}
    .axon{fill:none;stroke:var(--line-strong);stroke-width:3;stroke-linecap:round;}
    .somaE{fill:var(--track);stroke:var(--track);stroke-width:2.5;}
    .nucE{fill:color-mix(in srgb, var(--surface) 70%, var(--track));}
    .somaS{fill:color-mix(in srgb, var(--line-strong) 24%, var(--surface));stroke:var(--line-strong);stroke-width:2.5;}
    .nucS{fill:color-mix(in srgb, var(--line-strong) 55%, var(--surface));}
    .arrow{fill:color-mix(in srgb, var(--track) 40%, var(--surface));stroke:var(--track);stroke-width:1.5;}
    .arrowQ{fill:color-mix(in srgb, var(--line-strong) 30%, var(--surface));stroke:var(--line-strong);stroke-width:1.5;}
    .trace{fill:none;stroke:var(--line-strong);stroke-width:1.5;stroke-dasharray:3 4;}
    .spike{fill:none;stroke:var(--track);stroke-width:3;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:260;stroke-dashoffset:260;animation:fire 8s linear infinite;}
    .flat{fill:none;stroke:var(--muted);stroke-width:3;stroke-linecap:round;}
    /* beats: 1 drug falls · 2 drug docks in both receptors · 3 one neuron fires, the other goes quiet · 4 hold */
    .dr{animation:dock 8s ease-in-out infinite;}
    .out{opacity:0;animation:out 8s ease-in-out infinite;}
    @keyframes dock{0%,6%{opacity:0;transform:translateX(-48px)}22%,100%{opacity:1;transform:translateX(0)}}
    @keyframes fire{0%,34%{stroke-dashoffset:260}66%{stroke-dashoffset:0}100%{stroke-dashoffset:0}}
    @keyframes out{0%,36%{opacity:0}50%,100%{opacity:1}}
    @media (prefers-reduced-motion:reduce){
      .dr{animation:none;opacity:1;transform:none}
      .spike{animation:none;stroke-dashoffset:0}
      .out{animation:none;opacity:1}
    }
  </style>

  <!-- ================= ROW 1: hM3Dq · Gq → fires ================= -->
  <text class="lbl" x="18" y="32" text-anchor="start">hM3Dq · Gq</text>

  <!-- membrane patch with the receptor -->
  <rect class="lipid" x="18" y="82" width="136" height="28"/>
  <g class="head">
    <circle cx="23" cy="82" r="4"/><circle cx="33" cy="82" r="4"/><circle cx="43" cy="82" r="4"/><circle cx="53" cy="82" r="4"/>
    <circle cx="63" cy="82" r="4"/><circle cx="105" cy="82" r="4"/><circle cx="115" cy="82" r="4"/><circle cx="125" cy="82" r="4"/>
    <circle cx="135" cy="82" r="4"/><circle cx="145" cy="82" r="4"/>
    <circle cx="23" cy="110" r="4"/><circle cx="33" cy="110" r="4"/><circle cx="43" cy="110" r="4"/><circle cx="53" cy="110" r="4"/>
    <circle cx="63" cy="110" r="4"/><circle cx="105" cy="110" r="4"/><circle cx="115" cy="110" r="4"/><circle cx="125" cy="110" r="4"/>
    <circle cx="135" cy="110" r="4"/><circle cx="145" cy="110" r="4"/>
  </g>
  <rect class="gpcr" x="70" y="74" width="14" height="44" rx="6"/>
  <rect class="gpcr" x="90" y="74" width="14" height="44" rx="6"/>
  <g class="dr">
    <polygon class="drugF" points="87,46 99,53 99,67 87,74 75,67 75,53"/>
    <text class="small" x="108" y="58" text-anchor="start" style="fill:var(--warn)">drug</text>
  </g>
  <!-- G protein under the receptor -->
  <g class="gprot">
    <circle cx="80" cy="128" r="9"/><circle cx="95" cy="131" r="7"/>
  </g>
  <!-- arrow to the neuron -->
  <g class="arrow"><path d="M124 132 L166 132 L166 126 L182 136 L166 146 L166 140 L124 140 Z"/></g>

  <!-- neuron: fires -->
  <g transform="translate(252,96)">
    <g class="den">
      <path d="M-8,-13 C-17,-26 -25,-32 -33,-40"/><path d="M-22,-28 L-31,-30"/>
      <path d="M8,-13 C17,-26 25,-32 33,-40"/><path d="M22,-28 L31,-30"/>
      <path d="M-14,-7 C-26,-14 -35,-16 -43,-15"/><path d="M-31,-14 L-37,-21"/>
      <path d="M0,-19 C-1,-33 1,-39 0,-47"/><path d="M0,-35 L7,-42"/>
    </g>
    <path class="axon" d="M18,2 L74,2"/>
    <circle class="somaE" r="18"/>
    <circle class="nucE" r="6"/>
  </g>
  <line class="trace" x1="190" y1="152" x2="344" y2="152"/>
  <polyline class="spike" points="190,152 212,152 220,132 228,172 236,152 252,152 260,132 268,172 276,152 292,152 300,132 308,172 316,152 344,152"/>
  <g class="out"><text class="lbl" x="344" y="42" text-anchor="end" style="fill:var(--track)">fires</text></g>

  <!-- divider -->
  <line x1="18" y1="178" x2="344" y2="178" stroke="var(--line)" stroke-width="2" stroke-dasharray="4 6"/>

  <!-- ================= ROW 2: hM4Di · Gi/o → quiet ================= -->
  <text class="lbl" x="18" y="210" text-anchor="start">hM4Di · Gi/o</text>

  <rect class="lipid" x="18" y="260" width="136" height="28"/>
  <g class="head">
    <circle cx="23" cy="260" r="4"/><circle cx="33" cy="260" r="4"/><circle cx="43" cy="260" r="4"/><circle cx="53" cy="260" r="4"/>
    <circle cx="63" cy="260" r="4"/><circle cx="105" cy="260" r="4"/><circle cx="115" cy="260" r="4"/><circle cx="125" cy="260" r="4"/>
    <circle cx="135" cy="260" r="4"/><circle cx="145" cy="260" r="4"/>
    <circle cx="23" cy="288" r="4"/><circle cx="33" cy="288" r="4"/><circle cx="43" cy="288" r="4"/><circle cx="53" cy="288" r="4"/>
    <circle cx="63" cy="288" r="4"/><circle cx="105" cy="288" r="4"/><circle cx="115" cy="288" r="4"/><circle cx="125" cy="288" r="4"/>
    <circle cx="135" cy="288" r="4"/><circle cx="145" cy="288" r="4"/>
  </g>
  <rect class="gpcr" x="70" y="252" width="14" height="44" rx="6"/>
  <rect class="gpcr" x="90" y="252" width="14" height="44" rx="6"/>
  <g class="dr">
    <polygon class="drugF" points="87,224 99,231 99,245 87,252 75,245 75,231"/>
  </g>
  <g class="gprot">
    <circle cx="80" cy="306" r="9"/><circle cx="95" cy="309" r="7"/>
  </g>
  <g class="arrowQ"><path d="M124 310 L166 310 L166 304 L182 314 L166 324 L166 318 L124 318 Z"/></g>

  <!-- neuron: quiet -->
  <g transform="translate(252,274)">
    <g class="den">
      <path d="M-8,-13 C-17,-26 -25,-32 -33,-40"/><path d="M-22,-28 L-31,-30"/>
      <path d="M8,-13 C17,-26 25,-32 33,-40"/><path d="M22,-28 L31,-30"/>
      <path d="M-14,-7 C-26,-14 -35,-16 -43,-15"/><path d="M-31,-14 L-37,-21"/>
      <path d="M0,-19 C-1,-33 1,-39 0,-47"/><path d="M0,-35 L7,-42"/>
    </g>
    <path class="axon" d="M18,2 L74,2"/>
    <circle class="somaS" r="18"/>
    <circle class="nucS" r="6"/>
  </g>
  <line class="trace" x1="190" y1="330" x2="344" y2="330"/>
  <line class="flat" x1="190" y1="330" x2="344" y2="330"/>
  <g class="out"><text class="lbl" x="344" y="220" text-anchor="end" style="fill:var(--muted)">quiet</text></g>
</svg>
