<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="color-scheme" content="light dark"><meta name="viewport" content="width=device-width, initial-scale=1">
<!--
  Thresholding bias. Two simulated fluorescence images, "control" and "treated", whose cells share the same
  brightness values (slightly jittered, in different places), so there is no real difference. A cell counts as positive
  when its brightness is above the threshold. With one shared threshold the two percentages stay close
  wherever you put it; with separate thresholds you can manufacture a "difference". Everything is simulated
  and illustrative.
-->
<style>
  :root{--text:#22221f;--muted:#5f5e5a;--line:#dcdad1;--line-strong:#b4b2a9;--track:#5B8DEF;--bad:#993c1d;--ok:#0f6e56;--field:#101312;--glow:#7dff9a;--ring:#ffd34d;}
  @media (prefers-color-scheme:dark){:root{--text:#f1efe8;--muted:#b4b2a9;--line:#3a3a37;--line-strong:#5f5e5a;--track:#7ea6f5;--bad:#f0997b;--ok:#5dcaa5;--field:#050706;}}
  html,body{background:transparent;margin:0}
  body{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,sans-serif;color:var(--text);font-size:14px;padding:10px 10px 8px}
  .seg{display:flex;gap:8px;margin:0 0 8px}
  .seg button{flex:1;min-height:44px;border:1.5px solid var(--line-strong);border-radius:12px;background:transparent;color:var(--text);font:inherit;font-weight:600;cursor:pointer;padding:0 4px}
  .seg button.sel{border-color:var(--track);background:color-mix(in srgb,var(--track) 16%,transparent)}
  .seg button.sel::before{content:"✓ ";font-weight:800}
  canvas{display:block;width:100%}
  label.f{display:flex;align-items:center;gap:10px;margin:6px 0 0;font-weight:600}
  label.f span{min-width:78px}
  label.f[hidden]{display:none}
  input[type=range]{flex:1;height:32px;accent-color:var(--text)}
  .say{min-height:40px;margin:6px 0 0;font-weight:600;line-height:1.4}
  .src{margin:4px 0 0;font-size:12px;color:var(--muted)}
</style></head>
<body>
  <div class="seg" role="radiogroup" aria-label="Threshold rule">
    <button data-mode="one" role="radio" aria-checked="true" class="sel">One threshold</button>
    <button data-mode="two" role="radio" aria-checked="false">One per group</button>
  </div>
  <canvas id="c" role="img" aria-label="Two simulated fluorescence images, control and treated, with cells of varying brightness. Cells above the threshold are ringed and counted as positive. Moving the threshold changes both percentages together; separate thresholds per group can create a difference that isn't real."></canvas>
  <label class="f" id="f1"><span id="n1">Threshold</span><input id="t1" type="range" min="5" max="95" value="50" aria-label="Threshold"></label>
  <label class="f" id="f2" hidden><span>Treated</span><input id="t2" type="range" min="5" max="95" value="50" aria-label="Treated threshold"></label>
  <p class="say" id="say" aria-live="polite"></p>
  <p class="src">Simulated images: both groups' cells come from the same brightness distribution.</p>
<script>
(function () {
  // Small seeded random generator so the two "images" are fixed draws from the same distribution.
  function rng(seed) { return function () { seed = (seed * 1664525 + 1013904223) % 4294967296; return seed / 4294967296; }; }
  function cells(seed) {
    var r = rng(seed), out = [], tries = 0;
    while (out.length < 26 && tries++ < 2000) {
      var x = 0.08 + r() * 0.84, y = 0.1 + r() * 0.8, rad = 0.055 + r() * 0.03;
      if (out.some(function (c) { return Math.hypot(c.x - x, c.y - y) < c.r + rad + 0.02; })) continue;
      // brightness: a broad, continuous spread, so there's no obvious gap to put the threshold in
      var b = Math.min(0.98, Math.max(0.04, (r() + r() + r()) / 3 * 1.15 - 0.05));
      var wob = [r(), r(), r(), r(), r(), r()].map(function (v) { return 0.85 + v * 0.3; });
      out.push({ x: x, y: y, r: rad, b: b, wob: wob });
    }
    return out;
  }
  // Same brightness values in both images (slightly jittered and in different places): no real difference.
  var ctrl = cells(11), trt = cells(29), jr = rng(7);
  trt.length = Math.min(trt.length, ctrl.length); ctrl.length = trt.length;
  var bs = ctrl.map(function (c) { return c.b; }).sort(function () { return jr() - 0.5; });
  trt.forEach(function (c, i) { c.b = Math.min(0.98, Math.max(0.04, bs[i] + (jr() - 0.5) * 0.06)); });
  var GROUPS = [{ name: 'Control', cells: ctrl }, { name: 'Treated', cells: trt }];
  var cv = document.getElementById('c'), ctx = cv.getContext('2d'), say = document.getElementById('say');
  var t1 = document.getElementById('t1'), t2 = document.getElementById('t2'), f2 = document.getElementById('f2'), n1 = document.getElementById('n1');
  var W = 0, H = 236, col = {}, mode = 'one';
  function readColors() { var cs = getComputedStyle(document.documentElement); ['text', 'muted', 'line', 'line-strong', 'track', 'bad', 'ok', 'field', 'glow', 'ring'].forEach(function (k) { col[k] = cs.getPropertyValue('--' + k).trim(); }); }
  function size() { W = cv.clientWidth || 320; var d = window.devicePixelRatio || 1; cv.width = Math.round(W * d); cv.height = Math.round(H * d); cv.style.height = H + 'px'; ctx.setTransform(d, 0, 0, d, 0, 0); draw(); }
  function label(s, x, y, c, align, weight, px) { ctx.fillStyle = c; ctx.font = (weight || 600) + ' ' + (px || 13) + 'px -apple-system,system-ui,sans-serif'; ctx.textAlign = align || 'left'; ctx.fillText(s, x, y); }
  function blob(cx, cy, r, wob) {
    ctx.beginPath();
    for (var i = 0; i <= 6; i++) {
      var a0 = (i - 1) / 6 * 6.283, a1 = i / 6 * 6.283, r0 = r * wob[(i + 5) % 6], r1 = r * wob[i % 6];
      var x1 = cx + Math.cos(a1) * r1, y1 = cy + Math.sin(a1) * r1;
      if (!i) { ctx.moveTo(x1, y1); continue; }
      var am = (a0 + a1) / 2, rm = (r0 + r1) / 2 * 1.08;
      ctx.quadraticCurveTo(cx + Math.cos(am) * rm, cy + Math.sin(am) * rm, x1, y1);
    }
    ctx.closePath();
  }
  function pct(g, th) { var n = g.cells.filter(function (c) { return c.b * 100 > th; }).length; return Math.round(n / g.cells.length * 100); }
  function draw() {
    if (!W) return;
    var th = [Number(t1.value), mode === 'one' ? Number(t1.value) : Number(t2.value)];
    var gap = 10, pw = (W - gap) / 2, ph = 190, top = 22;
    ctx.clearRect(0, 0, W, H);
    var p = GROUPS.map(function (g, i) { return pct(g, th[i]); });
    GROUPS.forEach(function (g, i) {
      var x0 = i * (pw + gap);
      label(g.name, x0 + 2, 15, col.text, 'left', 700, 14);
      label(p[i] + '% positive', x0 + pw - 2, 15, col.text, 'right', 700, 14);
      ctx.fillStyle = col.field; roundRect(x0, top, pw, ph, 10); ctx.fill();
      ctx.save(); roundRect(x0, top, pw, ph, 10); ctx.clip();
      g.cells.forEach(function (c) {
        var cx = x0 + c.x * pw, cy = top + c.y * ph, r = c.r * Math.min(pw, ph) * 1.25;
        ctx.globalAlpha = 0.12 + 0.88 * c.b; ctx.fillStyle = col.glow; blob(cx, cy, r, c.wob); ctx.fill();
        ctx.globalAlpha = 0.5 * c.b; ctx.fillStyle = '#ffffff'; blob(cx, cy, r * 0.45, c.wob); ctx.fill();
        ctx.globalAlpha = 1;
        if (c.b * 100 > th[i]) { ctx.strokeStyle = col.ring; ctx.lineWidth = 2; blob(cx, cy, r + 3.5, c.wob); ctx.stroke(); }
      });
      ctx.restore();
    });
    label('ringed = counted as positive', W / 2, top + ph + 18, col.muted, 'center', 400, 12);
    var d = Math.abs(p[0] - p[1]), text;
    if (mode === 'one') text = 'Same rule for both: the counts move together and stay close (' + p[0] + '% vs ' + p[1] + '%).';
    else text = d >= 15 ? 'A ' + d + '-point "effect", made only by moving one group\'s threshold.' : 'Now drag the treated threshold away from the control one and watch a "difference" appear.';
    if (say.textContent !== text) say.textContent = text;
  }
  function roundRect(x, y, w, h, r) { ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r); ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath(); }
  document.querySelectorAll('.seg button').forEach(function (b) {
    b.onclick = function () {
      mode = b.dataset.mode;
      document.querySelectorAll('.seg button').forEach(function (x) { var on = x === b; x.classList.toggle('sel', on); x.setAttribute('aria-checked', String(on)); });
      f2.hidden = mode === 'one'; n1.textContent = mode === 'one' ? 'Threshold' : 'Control';
      t1.setAttribute('aria-label', mode === 'one' ? 'Threshold' : 'Control threshold');
      if (mode === 'two') t2.value = t1.value;
      draw();
    };
  });
  t1.oninput = draw; t2.oninput = draw;
  readColors(); size();
  matchMedia('(prefers-color-scheme: dark)').addEventListener('change', function () { readColors(); draw(); });
  addEventListener('resize', size);
})();
</script>
</body></html>
