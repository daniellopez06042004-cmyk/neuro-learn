<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 320" role="img" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>Clonal selection and memory</title>
  <desc>A row of lymphocytes each carries a differently shaped receptor. An antigen matches one of them; that cell is selected and multiplies into many identical effector cells plus a long-lived memory cell, while the non-matching cells stay quiet.</desc>
  <style>
    svg{--text:#22221f;--muted:#5f5e5a;--line:#dcdad1;--line-strong:#b4b2a9;--surface:#ffffff;--surface-2:#efede6;--warn:#ba7517;--track:#D4537E;}
    @media (prefers-color-scheme:dark){svg{--text:#f1efe8;--muted:#b4b2a9;--line:#3a3a37;--line-strong:#5f5e5a;--surface:#22221f;--surface-2:#2c2c2a;--warn:#ef9f27;--track:#e67ba0;}}
    text{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,sans-serif;fill:var(--text);}
    .lbl{font-size:14px;font-weight:600;} .small{font-size:12px;font-weight:400;fill:var(--muted);}
    .cell{fill:var(--surface-2);stroke:var(--line-strong);stroke-width:2;}
    .rcpt{fill:none;stroke:var(--line-strong);stroke-width:2.5;}
    .sel{animation:sel 7s ease-in-out infinite;}
    .selR{animation:selR 7s ease-in-out infinite;}
    .ag{opacity:0;animation:ag 7s ease-in-out infinite;}
    .clone{opacity:0;animation:clone 7s ease-in-out infinite;}
    .mem{opacity:0;animation:clone 7s ease-in-out infinite;}
    @keyframes ag{0%{opacity:0;transform:translateY(-16px)}12%,40%{opacity:1;transform:translateY(0)}50%,100%{opacity:0}}
    @keyframes sel{0%,40%{fill:var(--surface-2);stroke:var(--line-strong)}52%,100%{fill:var(--track);stroke:var(--track)}}
    @keyframes selR{0%,40%{stroke:var(--line-strong)}52%,100%{stroke:var(--track)}}
    @keyframes clone{0%,54%{opacity:0;transform:scale(.4)}68%,100%{opacity:1;transform:scale(1)}}
    @media (prefers-reduced-motion:reduce){
      .ag{animation:none;opacity:0}
      .sel{animation:none;fill:var(--track);stroke:var(--track)}
      .selR{animation:none;stroke:var(--track)}
      .clone,.mem{animation:none;opacity:1;transform:none}
    }
  </style>

  <text class="small" x="20" y="34">diverse lymphocytes, each a different receptor</text>

  <!-- row of lymphocytes with different receptor shapes -->
  <!-- cell 1 (square receptor) -->
  <circle class="cell" cx="46" cy="78" r="20"/>
  <rect class="rcpt" x="40" y="46" width="12" height="12" fill="none"/>
  <!-- cell 2 (triangle) -->
  <circle class="cell" cx="112" cy="78" r="20"/>
  <path class="rcpt" d="M106 58 L118 58 L112 46 Z"/>
  <!-- cell 3 (the match: notch) -->
  <circle class="cell sel" cx="180" cy="78" r="20" style="transform-origin:180px 78px"/>
  <path class="rcpt selR" d="M172 58 q8 -10 16 0"/>
  <!-- cell 4 (diamond) -->
  <circle class="cell" cx="248" cy="78" r="20"/>
  <path class="rcpt" d="M248 46 L256 56 L248 66 L240 56 Z"/>
  <!-- cell 5 (double prong) -->
  <circle class="cell" cx="314" cy="78" r="20"/>
  <path class="rcpt" d="M308 58 L308 48 M320 58 L320 48"/>

  <!-- antigen that matches cell 3 -->
  <g class="ag"><path d="M172 38 q8 10 16 0" fill="var(--warn)"/><text class="lbl" x="180" y="30" text-anchor="middle" style="fill:var(--warn)">antigen</text></g>

  <text class="lbl" x="180" y="120" text-anchor="middle" style="fill:var(--track)">match → selected</text>
  <path d="M180 128 L180 150" stroke="var(--line-strong)" stroke-width="2" marker-end=""/>
  <path d="M174 144 L180 154 L186 144" fill="none" stroke="var(--line-strong)" stroke-width="2"/>

  <!-- clones expand below -->
  <text class="small" x="20" y="178">one cell multiplies into many</text>
  <g class="clone" style="transform-origin:70px 212px"><circle class="cell" cx="70" cy="212" r="17" style="fill:var(--track);stroke:var(--track)"/></g>
  <g class="clone" style="transform-origin:120px 212px"><circle class="cell" cx="120" cy="212" r="17" style="fill:var(--track);stroke:var(--track)"/></g>
  <g class="clone" style="transform-origin:170px 212px"><circle class="cell" cx="170" cy="212" r="17" style="fill:var(--track);stroke:var(--track)"/></g>
  <g class="clone" style="transform-origin:220px 212px"><circle class="cell" cx="220" cy="212" r="17" style="fill:var(--track);stroke:var(--track)"/></g>
  <text class="lbl clone" x="145" y="250" text-anchor="middle">effector clones</text>

  <!-- memory cell -->
  <g class="mem" style="transform-origin:300px 212px">
    <circle class="cell" cx="300" cy="212" r="18" style="stroke:var(--track);stroke-width:3;stroke-dasharray:4 4"/>
    <text x="300" y="217" text-anchor="middle" font-size="16" font-weight="800" style="fill:var(--track)">★</text>
  </g>
  <text class="lbl mem" x="300" y="250" text-anchor="middle">memory</text>

  <text class="small" x="180" y="300" text-anchor="middle">memory makes the next response faster</text>
</svg>
