<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 300" role="img" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>MHC class I and class II present antigen to T cells</title>
  <desc>Top row: an ordinary infected cell displays an internal peptide on MHC class I, which a cytotoxic T cell inspects. Bottom row: a dendritic cell engulfs a microbe and displays a fragment on MHC class II to a helper T cell. In both, the T-cell receptor reads the peptide held in the MHC groove.</desc>
  <style>
    svg{--text:#22221f;--muted:#5f5e5a;--line:#dcdad1;--line-strong:#b4b2a9;--surface:#ffffff;--surface-2:#efede6;--warn:#ba7517;--track:#D4537E;}
    @media (prefers-color-scheme:dark){svg{--text:#f1efe8;--muted:#b4b2a9;--line:#3a3a37;--line-strong:#5f5e5a;--surface:#22221f;--surface-2:#2c2c2a;--warn:#ef9f27;--track:#e67ba0;}}
    text{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,sans-serif;fill:var(--text);}
    .lbl{font-size:14px;font-weight:600;} .small{font-size:12px;font-weight:400;fill:var(--muted);}
    .cell{fill:var(--surface-2);stroke:var(--line-strong);stroke-width:2;}
    .mhc{fill:none;stroke:var(--track);stroke-width:2.5;stroke-linecap:round;}
    .pep{fill:var(--warn);}
    .tcr{fill:none;stroke:var(--track);stroke-width:2.5;stroke-linecap:round;}
    .fit{opacity:0;animation:fit 6s ease-in-out infinite;}
    @keyframes fit{0%,40%{opacity:0}55%,100%{opacity:1}}
    .tc{animation:dock 6s ease-in-out infinite;}
    @keyframes dock{0%,20%{transform:translateX(26px)}44%,100%{transform:translateX(0)}}
    @media (prefers-reduced-motion:reduce){.fit{animation:none;opacity:1}.tc{animation:none;transform:translateX(0)}}
  </style>

  <!-- ===== TOP: MHC I ===== -->
  <path class="cell" d="M20 44 h150 a0 0 0 0 1 0 0 v70 h-150 Z" />
  <text class="small" x="30" y="66">infected cell</text>
  <text class="small" x="30" y="104">internal peptide</text>
  <!-- MHC I groove on the membrane (right edge) -->
  <path class="mhc" d="M170 70 q10 -2 10 8 M170 92 q10 2 10 -8"/>
  <rect class="pep" x="176" y="76" width="12" height="10" rx="2"/>
  <text class="lbl" x="196" y="60">MHC I</text>

  <!-- cytotoxic T cell -->
  <g class="tc">
   <circle class="cell" cx="276" cy="81" r="34"/>
   <path class="tcr" d="M242 74 q-10 2 -10 7 M242 88 q-10 -2 -10 -7"/>
   <rect class="pep fit" x="224" y="76" width="12" height="10" rx="2"/>
   <text class="lbl" x="286" y="78" text-anchor="middle">cytotoxic</text>
   <text class="lbl" x="286" y="94" text-anchor="middle">T cell</text>
  </g>

  <line x1="20" y1="150" x2="340" y2="150" stroke="var(--line)" stroke-width="1" stroke-dasharray="3 5"/>

  <!-- ===== BOTTOM: MHC II ===== -->
  <path class="cell" d="M20 186 h150 v70 h-150 Z"/>
  <text class="small" x="30" y="208">dendritic cell</text>
  <text class="small" x="30" y="246">engulfed fragment</text>
  <circle cx="60" cy="226" r="9" fill="var(--warn)" opacity=".5"/>
  <path class="mhc" d="M170 212 q10 -2 10 8 M170 234 q10 2 10 -8"/>
  <rect class="pep" x="176" y="218" width="12" height="10" rx="2"/>
  <text class="lbl" x="196" y="202">MHC II</text>

  <!-- helper T cell -->
  <g class="tc">
   <circle class="cell" cx="276" cy="223" r="34"/>
   <path class="tcr" d="M242 216 q-10 2 -10 7 M242 230 q-10 -2 -10 -7"/>
   <rect class="pep fit" x="224" y="218" width="12" height="10" rx="2"/>
   <text class="lbl" x="286" y="220" text-anchor="middle">helper</text>
   <text class="lbl" x="286" y="236" text-anchor="middle">T cell</text>
  </g>

  <text class="small" x="180" y="288" text-anchor="middle">T-cell receptor reads peptide + MHC</text>
</svg>
