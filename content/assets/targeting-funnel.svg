<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 340" role="img" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>Targeting specificity funnel</title>
  <desc>A crowd of 24 cells narrows through three filters — retrograde route (12 left), Cre-dependent switch (5 left), and a subtype Cre line — leaving 2 target cells.</desc>
  <style>
    svg{--text:#22221f;--muted:#5f5e5a;--line:#dcdad1;--line-strong:#b4b2a9;--surface:#ffffff;--surface-2:#efede6;--ok:#0f6e56;--track:#5B8DEF;}
    @media (prefers-color-scheme:dark){svg{--text:#f1efe8;--muted:#b4b2a9;--line:#3a3a37;--line-strong:#5f5e5a;--surface:#22221f;--surface-2:#2c2c2a;--ok:#5dcaa5;--track:#7ea6f5;}}
    text{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,sans-serif;fill:var(--text);}
    .flt{font-size:14px;font-weight:600;} .cnt{font-size:15px;font-weight:700;fill:var(--muted);}
    .dot{fill:var(--surface-2);stroke:var(--line-strong);stroke-width:1.5;}
    .win{fill:var(--track);stroke:var(--surface);stroke-width:1.5;}
    .band{fill:none;stroke:var(--line-strong);stroke-width:1;stroke-dasharray:4 4;}
    .funnel{fill:none;stroke:var(--line-strong);stroke-width:1.5;}
    .tgt{animation:p 4.5s ease-in-out infinite;}
    @keyframes p{0%,100%{opacity:.8}50%{opacity:1}}
    @media (prefers-reduced-motion:reduce){.tgt{animation:none}}
  </style>

  <!-- funnel outline -->
  <path class="funnel" d="M20 40 L340 40 L240 296 L120 296 Z"/>

  <!-- start: 24 cells (count sits above the rim) -->
  <text class="cnt" x="340" y="30" text-anchor="end">24</text>
  <g class="dot"><circle cx="59" cy="56" r="6"/><circle cx="81" cy="56" r="6"/><circle cx="103" cy="56" r="6"/><circle cx="125" cy="56" r="6"/><circle cx="147" cy="56" r="6"/><circle cx="169" cy="56" r="6"/><circle cx="191" cy="56" r="6"/><circle cx="213" cy="56" r="6"/><circle cx="235" cy="56" r="6"/><circle cx="257" cy="56" r="6"/><circle cx="279" cy="56" r="6"/><circle cx="301" cy="56" r="6"/><circle cx="59" cy="76" r="6"/><circle cx="81" cy="76" r="6"/><circle cx="103" cy="76" r="6"/><circle cx="125" cy="76" r="6"/><circle cx="147" cy="76" r="6"/><circle cx="169" cy="76" r="6"/><circle cx="191" cy="76" r="6"/><circle cx="213" cy="76" r="6"/><circle cx="235" cy="76" r="6"/><circle cx="257" cy="76" r="6"/><circle cx="279" cy="76" r="6"/><circle cx="301" cy="76" r="6"/></g>

  <!-- filter 1 -->
  <line class="band" x1="47.875" y1="96" x2="312.125" y2="96"/>
  <text class="flt" x="180" y="116" text-anchor="middle">retrograde · pancreas-projecting</text>

  <!-- 12 left -->
  <g class="dot"><circle cx="125" cy="138" r="6"/><circle cx="147" cy="138" r="6"/><circle cx="169" cy="138" r="6"/><circle cx="191" cy="138" r="6"/><circle cx="213" cy="138" r="6"/><circle cx="235" cy="138" r="6"/><circle cx="125" cy="158" r="6"/><circle cx="147" cy="158" r="6"/><circle cx="169" cy="158" r="6"/><circle cx="191" cy="158" r="6"/><circle cx="213" cy="158" r="6"/><circle cx="235" cy="158" r="6"/></g>
  <text class="cnt" x="306" y="153">12</text>

  <!-- filter 2 -->
  <line class="band" x1="79.9062" y1="178" x2="280.094" y2="178"/>
  <text class="flt" x="180" y="198" text-anchor="middle">DIO · Cre+ only</text>

  <!-- 5 left -->
  <g class="dot"><circle cx="147" cy="220" r="6"/><circle cx="169" cy="220" r="6"/><circle cx="191" cy="220" r="6"/><circle cx="213" cy="220" r="6"/><circle cx="180" cy="240" r="6"/></g>
  <text class="cnt" x="276" y="235">5</text>

  <!-- filter 3 -->
  <line class="band" x1="111.156" y1="258" x2="248.844" y2="258"/>
  <text class="flt" x="180" y="280" text-anchor="middle">subtype Cre line</text>

  <!-- 2 targets leave the funnel -->
  <g class="tgt"><circle class="win" cx="168" cy="318" r="8"/><circle class="win" cx="192" cy="318" r="8"/></g>
  <text class="cnt" x="214" y="323" style="fill:var(--ok)">✓ 2 targets</text>
</svg>
