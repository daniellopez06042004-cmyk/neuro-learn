<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 310" role="img" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>Force thresholds tile the stimulus range</title>
  <desc>A rising force level sweeps upward. Three afferents with different thresholds switch on in turn: a low-threshold afferent fires at gentle force, a medium one at moderate force, and a high-threshold afferent fires only in the strong, potentially harmful range. Together they report the whole range of force.</desc>
  <style>
    svg{--text:#22221f;--muted:#5f5e5a;--line:#dcdad1;--line-strong:#b4b2a9;--surface:#ffffff;--surface-2:#efede6;--warn:#ba7517;--bad:#993c1d;--track:#1D9E75;}
    @media (prefers-color-scheme:dark){svg{--text:#f1efe8;--muted:#b4b2a9;--line:#3a3a37;--line-strong:#5f5e5a;--surface:#22221f;--surface-2:#2c2c2a;--warn:#ef9f27;--bad:#f0997b;--track:#32c48f;}}
    text{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,sans-serif;fill:var(--text);}
    .lbl{font-size:14px;font-weight:600;} .small{font-size:12px;font-weight:400;fill:var(--muted);}
    .bar{fill:var(--surface-2);stroke:var(--line-strong);stroke-width:1.5;}
    .fill{fill:var(--track);opacity:.28;animation:rise 6s ease-in-out infinite;transform-origin:50px 250px;}
    .mk{stroke:var(--line-strong);stroke-width:1.5;stroke-dasharray:4 4;}
    .soma{fill:var(--surface-2);stroke-width:2.5;}
    .onA{animation:onA 6s ease-in-out infinite;} .onB{animation:onB 6s ease-in-out infinite;} .onC{animation:onC 6s ease-in-out infinite;}
    /* force fill scales 0 -> full */
    @keyframes rise{0%,8%{transform:scaleY(0)}70%,100%{transform:scaleY(1)}}
    @keyframes onA{0%,20%{fill:var(--surface-2);stroke:var(--line-strong)}30%,100%{fill:var(--track);stroke:var(--track)}}
    @keyframes onB{0%,40%{fill:var(--surface-2);stroke:var(--line-strong)}50%,100%{fill:var(--warn);stroke:var(--warn)}}
    @keyframes onC{0%,62%{fill:var(--surface-2);stroke:var(--line-strong)}72%,100%{fill:var(--bad);stroke:var(--bad)}}
    .ckA{opacity:0;animation:ckA 6s ease-in-out infinite;} .ckB{opacity:0;animation:ckB 6s ease-in-out infinite;} .ckC{opacity:0;animation:ckC 6s ease-in-out infinite;}
    @keyframes ckA{0%,24%{opacity:0}34%,100%{opacity:1}}
    @keyframes ckB{0%,44%{opacity:0}54%,100%{opacity:1}}
    @keyframes ckC{0%,66%{opacity:0}76%,100%{opacity:1}}
    @media (prefers-reduced-motion:reduce){
      .fill{animation:none;transform:scaleY(1)}
      .onA{animation:none;fill:var(--track);stroke:var(--track)}
      .onB{animation:none;fill:var(--warn);stroke:var(--warn)}
      .onC{animation:none;fill:var(--bad);stroke:var(--bad)}
      .ckA,.ckB,.ckC{animation:none;opacity:1}
    }
  </style>

  <!-- force bar on the left -->
  <rect class="bar" x="36" y="50" width="28" height="200" rx="8"/>
  <rect class="fill" x="37.5" y="51.5" width="25" height="197"/>
  <text class="small" x="50" y="44" text-anchor="middle">force</text>
  <text class="small" x="50" y="266" text-anchor="middle">gentle→strong</text>

  <!-- threshold markers to the three afferents -->
  <line class="mk" x1="64" y1="210" x2="150" y2="210"/>
  <line class="mk" x1="64" y1="150" x2="150" y2="150"/>
  <line class="mk" x1="64" y1="90"  x2="150" y2="90"/>

  <!-- low-threshold afferent -->
  <circle class="soma onA" cx="176" cy="210" r="15"/>
  <text class="ckA" x="176" y="215" text-anchor="middle" font-size="16" font-weight="800" style="fill:var(--surface)">✓</text>
  <text class="lbl" x="200" y="206">LTMR</text>
  <text class="small" x="200" y="222">fires at gentle force</text>

  <!-- medium-threshold afferent -->
  <circle class="soma onB" cx="176" cy="150" r="15"/>
  <text class="ckB" x="176" y="155" text-anchor="middle" font-size="16" font-weight="800" style="fill:var(--surface)">✓</text>
  <text class="lbl" x="200" y="146">mid-threshold</text>
  <text class="small" x="200" y="162">fires at moderate force</text>

  <!-- high-threshold afferent -->
  <circle class="soma onC" cx="176" cy="90" r="15"/>
  <text class="ckC" x="176" y="95" text-anchor="middle" font-size="16" font-weight="800" style="fill:var(--surface)">✓</text>
  <text class="lbl" x="200" y="86">HTMR</text>
  <text class="small" x="200" y="102">fires only at strong force</text>

  <text class="small" x="180" y="292" text-anchor="middle">different thresholds tile the whole range</text>
</svg>
