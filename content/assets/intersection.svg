<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 268" role="img">
  <title>Intersectional genetics: Cre AND Flp</title>
  <desc>Three neurons. Cre-only and Flp-only stay off; only the neuron with both Cre and Flp turns its payload on.</desc>
  <style>
    svg{--text:#22221f;--muted:#5f5e5a;--line:#dcdad1;--line-strong:#b4b2a9;--surface:#ffffff;--surface-2:#efede6;--ok:#0f6e56;--bad:#993c1d;--cre:#5B8DEF;--flp:#7F77DD;}
    @media (prefers-color-scheme:dark){svg{--text:#f1efe8;--muted:#b4b2a9;--line:#3a3a37;--line-strong:#5f5e5a;--surface:#22221f;--surface-2:#2c2c2a;--ok:#5dcaa5;--bad:#f0997b;--cre:#7ea6f5;--flp:#9a93e8;}}
    text{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,sans-serif;fill:var(--text);}
    .lbl{font-size:15px;font-weight:600;}
    .st{font-size:15px;font-weight:600;}
    .bdg{font-size:14px;font-weight:600;fill:#ffffff;}
    .card{fill:color-mix(in srgb, var(--line-strong) 12%, var(--surface));stroke:var(--line);stroke-width:1.5;}
    .cardOn{fill:color-mix(in srgb, var(--cre) 14%, var(--surface));stroke:var(--cre);stroke-width:2;opacity:0;animation:cardOn 8s ease-in-out infinite;}
    .den{fill:none;stroke:var(--line-strong);stroke-width:2.5;stroke-linecap:round;}
    .axon{fill:none;stroke:var(--line-strong);stroke-width:2.5;stroke-linecap:round;}
    .somaCre{fill:color-mix(in srgb, var(--cre) 18%, var(--surface));stroke:var(--cre);stroke-width:2.5;}
    .somaFlp{fill:color-mix(in srgb, var(--flp) 18%, var(--surface));stroke:var(--flp);stroke-width:2.5;}
    .nuc{fill:color-mix(in srgb, var(--line-strong) 40%, var(--surface));}
    .somaOn{fill:var(--cre);stroke:var(--cre);stroke-width:2.5;opacity:0;animation:somaOn 8s ease-in-out infinite;}
    .nucOn{fill:color-mix(in srgb, var(--surface) 70%, var(--cre));opacity:0;animation:somaOn 8s ease-in-out infinite;}
    .ring{fill:none;stroke:var(--cre);stroke-width:2.5;opacity:0;animation:ring 8s ease-out infinite;}
    .creB{fill:var(--cre);} .flpB{fill:var(--flp);}
    /* beats: 1 three genotypes · 2 the single-recombinase cells fail · 3 the AND cell lights · 4 hold */
    .vOff{opacity:0;animation:vOff 8s ease-in-out infinite;}
    .vOn{opacity:0;animation:vOn 8s ease-in-out infinite;}
    @keyframes vOff{0%,20%{opacity:0;transform:translateY(6px)}32%,100%{opacity:1;transform:translateY(0)}}
    @keyframes somaOn{0%,42%{opacity:0}56%,100%{opacity:1}}
    @keyframes cardOn{0%,42%{opacity:0}58%,100%{opacity:1}}
    @keyframes ring{0%,44%{opacity:0;transform:scale(.7)}58%{opacity:.55;transform:scale(1.05)}74%,100%{opacity:0;transform:scale(1.6)}}
    @keyframes vOn{0%,60%{opacity:0;transform:scale(.7)}72%,100%{opacity:1;transform:scale(1)}}
    @media (prefers-reduced-motion:reduce){
      .vOff{animation:none;opacity:1;transform:none}
      .vOn{animation:none;opacity:1;transform:none}
      .somaOn,.nucOn{animation:none;opacity:1}
      .cardOn{animation:none;opacity:1}
      .ring{animation:none;opacity:0}
    }
  </style>

  <!-- ===== cards ===== -->
  <rect class="card" x="12" y="16" width="108" height="238" rx="14"/>
  <rect class="card" x="126" y="16" width="108" height="238" rx="14"/>
  <rect class="card" x="240" y="16" width="108" height="238" rx="14"/>
  <rect class="cardOn" x="126" y="16" width="108" height="238" rx="14"/>

  <!-- ===== column 1: Cre only, off ===== -->
  <g>
    <rect class="creB" x="44" y="30" width="44" height="26" rx="13"/>
    <text class="bdg" x="66" y="48" text-anchor="middle">Cre</text>
  </g>
  <g transform="translate(66,150)">
    <g class="den">
      <path d="M-7,-13 C-16,-26 -24,-32 -32,-40"/><path d="M-21,-28 L-30,-30"/>
      <path d="M7,-13 C16,-26 24,-32 32,-40"/><path d="M21,-28 L30,-30"/>
      <path d="M-13,-6 C-25,-13 -34,-15 -42,-14"/><path d="M-30,-13 L-36,-20"/>
      <path d="M13,-6 C25,-13 34,-15 42,-14"/><path d="M30,-13 L36,-20"/>
      <path d="M0,-18 C-1,-32 1,-38 0,-46"/><path d="M0,-34 L7,-41"/>
    </g>
    <path class="axon" d="M0,18 C2,34 -2,44 0,58"/>
    <circle class="somaCre" r="18"/>
    <circle class="nuc" r="6"/>
  </g>
  <g class="vOff">
    <text class="st" x="66" y="226" text-anchor="middle" style="fill:var(--bad)">✕ off</text>
  </g>
  <text class="lbl" x="66" y="248" text-anchor="middle">Cre only</text>

  <!-- ===== column 2: Cre + Flp, ON ===== -->
  <g>
    <rect class="creB" x="134" y="30" width="44" height="26" rx="13"/>
    <text class="bdg" x="156" y="48" text-anchor="middle">Cre</text>
    <rect class="flpB" x="182" y="30" width="44" height="26" rx="13"/>
    <text class="bdg" x="204" y="48" text-anchor="middle">Flp</text>
  </g>
  <g transform="translate(180,150)">
    <g class="den">
      <path d="M-7,-13 C-16,-26 -24,-32 -32,-40"/><path d="M-21,-28 L-30,-30"/>
      <path d="M7,-13 C16,-26 24,-32 32,-40"/><path d="M21,-28 L30,-30"/>
      <path d="M-13,-6 C-25,-13 -34,-15 -42,-14"/><path d="M-30,-13 L-36,-20"/>
      <path d="M13,-6 C25,-13 34,-15 42,-14"/><path d="M30,-13 L36,-20"/>
      <path d="M0,-18 C-1,-32 1,-38 0,-46"/><path d="M0,-34 L7,-41"/>
    </g>
    <path class="axon" d="M0,18 C2,34 -2,44 0,58"/>
    <circle class="ring" r="18" style="transform-origin:0 0"/>
    <circle class="somaCre" r="18"/>
    <circle class="nuc" r="6"/>
    <circle class="somaOn" r="18"/>
    <circle class="nucOn" r="6"/>
  </g>
  <g class="vOn" style="transform-origin:180px 221px">
    <text class="st" x="180" y="226" text-anchor="middle" style="fill:var(--ok)">✓ ON</text>
  </g>
  <text class="lbl" x="180" y="248" text-anchor="middle">Cre + Flp</text>

  <!-- ===== column 3: Flp only, off ===== -->
  <g>
    <rect class="flpB" x="272" y="30" width="44" height="26" rx="13"/>
    <text class="bdg" x="294" y="48" text-anchor="middle">Flp</text>
  </g>
  <g transform="translate(294,150)">
    <g class="den">
      <path d="M-7,-13 C-16,-26 -24,-32 -32,-40"/><path d="M-21,-28 L-30,-30"/>
      <path d="M7,-13 C16,-26 24,-32 32,-40"/><path d="M21,-28 L30,-30"/>
      <path d="M-13,-6 C-25,-13 -34,-15 -42,-14"/><path d="M-30,-13 L-36,-20"/>
      <path d="M13,-6 C25,-13 34,-15 42,-14"/><path d="M30,-13 L36,-20"/>
      <path d="M0,-18 C-1,-32 1,-38 0,-46"/><path d="M0,-34 L7,-41"/>
    </g>
    <path class="axon" d="M0,18 C2,34 -2,44 0,58"/>
    <circle class="somaFlp" r="18"/>
    <circle class="nuc" r="6"/>
  </g>
  <g class="vOff">
    <text class="st" x="294" y="226" text-anchor="middle" style="fill:var(--bad)">✕ off</text>
  </g>
  <text class="lbl" x="294" y="248" text-anchor="middle">Flp only</text>
</svg>
