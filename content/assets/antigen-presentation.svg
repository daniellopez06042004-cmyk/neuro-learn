<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 262" role="img">
  <title>MHC class I and class II present antigen to T cells</title>
  <desc>Top: an infected cell moves an internal peptide onto MHC class I at its surface, and a cytotoxic T cell docks to inspect it. Bottom: a dendritic cell takes a fragment of an engulfed microbe onto MHC class II for a helper T cell. In both, the T-cell receptor (TCR) reads the peptide held in the MHC groove.</desc>
  <style>
    :root,svg{--text:#22221f;--muted:#5f5e5a;--line:#dcdad1;--line-strong:#b4b2a9;--surface:#ffffff;--surface-2:#efede6;--ok:#0f6e56;--bad:#993c1d;--warn:#ba7517;--track:#D4537E;--lipid:#e8d9c4;}
    @media (prefers-color-scheme:dark){:root,svg{--text:#f1efe8;--muted:#b4b2a9;--line:#3a3a37;--line-strong:#5f5e5a;--surface:#22221f;--surface-2:#2c2c2a;--ok:#5dcaa5;--bad:#f0997b;--warn:#ef9f27;--track:#e67ba0;--lipid:#4a4237;}}
    svg{--t1:color-mix(in srgb,var(--track) 22%,var(--surface));--t2:color-mix(in srgb,var(--track) 50%,var(--surface));--t0:color-mix(in srgb,var(--track) 9%,var(--surface));--w1:color-mix(in srgb,var(--warn) 24%,var(--surface));--b1:color-mix(in srgb,var(--bad) 22%,var(--surface));--ok1:color-mix(in srgb,var(--ok) 22%,var(--surface));--n1:color-mix(in srgb,var(--line-strong) 32%,var(--surface));--n2:color-mix(in srgb,var(--line-strong) 75%,var(--surface));--head:color-mix(in srgb,var(--lipid) 70%,var(--text));--tissue:color-mix(in srgb,#e8b4b0 30%,var(--surface-2));}
    text{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,sans-serif;font-size:14px;font-weight:600;fill:var(--text);}
    .m{font-weight:400;fill:var(--muted);}
    .lip{fill:var(--lipid);}
    .hd{fill:none;stroke:var(--head);stroke-width:7;stroke-linecap:round;stroke-dasharray:0 8;}
    .cT{fill:var(--t1);stroke:var(--track);stroke-width:2;}
    .cN{fill:var(--n1);stroke:var(--line-strong);stroke-width:2;}
    .nT{fill:var(--t2);}
    .nN{fill:var(--n2);}
    .pep{fill:var(--warn);stroke:var(--warn);stroke-width:1.5;}
    .mhc{fill:var(--t2);stroke:var(--track);stroke-width:2;stroke-linejoin:round;}
    .halo{fill:none;stroke:var(--track);stroke-width:3;opacity:0;animation:halo 8s ease-in-out infinite;}
    @keyframes halo{0%,48%{opacity:0}62%,95%{opacity:.9}100%{opacity:0}}
    .tc{animation:dock 8s ease-in-out infinite;}
    @keyframes dock{0%,30%{transform:translateX(30px)}48%,95%{transform:translateX(0)}100%{transform:translateX(30px)}}
    .eng{opacity:0;animation:eng 8s ease-in-out infinite;}
    @keyframes eng{0%,48%{opacity:0}64%,95%{opacity:1}100%{opacity:0}}
    @keyframes p1{0%,10%{transform:translate(-64px,-10px);opacity:1}30%{transform:translate(0px,0px);opacity:1}95%{transform:translate(0px,0px);opacity:1}97.5%{transform:translate(0px,0px);opacity:0}97.6%{transform:translate(-64px,-10px);opacity:0}100%{transform:translate(-64px,-10px);opacity:1}}
    .p1{animation:p1 8s ease-in-out infinite;}
    @keyframes p2{0%,10%{transform:translate(-78px,2px);opacity:1}30%{transform:translate(0px,0px);opacity:1}95%{transform:translate(0px,0px);opacity:1}97.5%{transform:translate(0px,0px);opacity:0}97.6%{transform:translate(-78px,2px);opacity:0}100%{transform:translate(-78px,2px);opacity:1}}
    .p2{animation:p2 8s ease-in-out infinite;}
    @media (prefers-reduced-motion:reduce){*{animation-delay:-6.9s!important;animation-play-state:paused!important;}}
  </style>
  <!-- top: an infected cell shows an internal peptide on MHC class I -->
