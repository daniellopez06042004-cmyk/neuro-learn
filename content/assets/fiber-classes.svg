<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 300" role="img" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>Aβ, Aδ and C fibers conduct at different speeds</title>
  <desc>Three sensory axons stacked vertically: a thick, heavily myelinated Aβ fiber, a thin lightly myelinated Aδ fiber, and an unmyelinated C fiber. A signal starts from the same point on the left; it reaches the right end first on Aβ, later on Aδ, and last on the slow C fiber.</desc>
  <style>
    svg{--text:#22221f;--muted:#5f5e5a;--line:#dcdad1;--line-strong:#b4b2a9;--surface:#ffffff;--surface-2:#efede6;--track:#1D9E75;}
    @media (prefers-color-scheme:dark){svg{--text:#f1efe8;--muted:#b4b2a9;--line:#3a3a37;--line-strong:#5f5e5a;--surface:#22221f;--surface-2:#2c2c2a;--track:#32c48f;}}
    text{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,sans-serif;fill:var(--text);}
    .lbl{font-size:14px;font-weight:600;} .small{font-size:12px;font-weight:400;fill:var(--muted);}
    .axon{fill:none;stroke:var(--line-strong);stroke-linecap:round;}
    .mye{fill:var(--surface-2);stroke:var(--line-strong);stroke-width:1.5;}
    .pulse{fill:var(--track);stroke:var(--surface);stroke-width:1.5;}
    .start{stroke:var(--line-strong);stroke-width:1.5;stroke-dasharray:4 4;}
    .p1{animation:run 5s linear infinite;}
    .p2{animation:run 5s linear infinite;animation-delay:.0s;}
    .p3{animation:run 5s linear infinite;}
    /* speeds differ: Aβ fast (reaches end early and holds), Aδ medium, C slow */
    @keyframes runFast{0%,6%{offset-distance:0%}30%{offset-distance:100%}100%{offset-distance:100%}}
    @keyframes runMed{0%,6%{offset-distance:0%}52%{offset-distance:100%}100%{offset-distance:100%}}
    @keyframes runSlow{0%,6%{offset-distance:0%}88%{offset-distance:100%}100%{offset-distance:100%}}
    .ab{offset-path:path("M70 70 L330 70");offset-rotate:0deg;animation:runFast 5s ease-out infinite;}
    .ad{offset-path:path("M70 150 L330 150");offset-rotate:0deg;animation:runMed 5s ease-out infinite;}
    .c{offset-path:path("M70 230 L330 230");offset-rotate:0deg;animation:runSlow 5s ease-out infinite;}
    @media (prefers-reduced-motion:reduce){.ab,.ad,.c{animation:none;offset-distance:100%}}
  </style>

  <!-- shared start line -->
  <line class="start" x1="70" y1="52" x2="70" y2="248"/>
  <text class="small" x="70" y="44" text-anchor="middle">stimulus</text>

  <!-- Aβ: thick, many myelin segments -->
  <line class="axon" x1="70" y1="70" x2="330" y2="70" stroke-width="3"/>
  <g class="mye"><rect x="92" y="63" width="30" height="14" rx="7"/><rect x="134" y="63" width="30" height="14" rx="7"/><rect x="176" y="63" width="30" height="14" rx="7"/><rect x="218" y="63" width="30" height="14" rx="7"/><rect x="260" y="63" width="30" height="14" rx="7"/></g>
  <text class="lbl" x="70" y="96" >Aβ</text>
  <text class="small" x="150" y="96">thick, myelinated · fast</text>
  <circle class="pulse ab" r="7"/>

  <!-- Aδ: thin, fewer/smaller myelin -->
  <line class="axon" x1="70" y1="150" x2="330" y2="150" stroke-width="2.2"/>
  <g class="mye"><rect x="100" y="144.5" width="22" height="11" rx="5.5"/><rect x="150" y="144.5" width="22" height="11" rx="5.5"/><rect x="200" y="144.5" width="22" height="11" rx="5.5"/><rect x="250" y="144.5" width="22" height="11" rx="5.5"/></g>
  <text class="lbl" x="70" y="176">Aδ</text>
  <text class="small" x="150" y="176">thin, lightly myelinated · medium</text>
  <circle class="pulse ad" r="6"/>

  <!-- C: unmyelinated -->
  <line class="axon" x1="70" y1="230" x2="330" y2="230" stroke-width="1.8"/>
  <text class="lbl" x="70" y="256">C</text>
  <text class="small" x="150" y="256">unmyelinated · slow</text>
  <circle class="pulse c" r="5"/>

  <!-- finish line -->
  <line class="start" x1="330" y1="52" x2="330" y2="248"/>
  <text class="small" x="330" y="280" text-anchor="middle">target</text>
</svg>
