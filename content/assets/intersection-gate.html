<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="color-scheme" content="light dark"><meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root{--text:#22221f;--muted:#5f5e5a;--line:#dcdad1;--line-strong:#b4b2a9;--surface-2:#efede6;--ok:#0f6e56;--bad:#993c1d;--track:#5B8DEF;}
  @media (prefers-color-scheme:dark){:root{--text:#f1efe8;--muted:#b4b2a9;--line:#3a3a37;--line-strong:#5f5e5a;--surface-2:#2c2c2a;--ok:#5dcaa5;--bad:#f0997b;--track:#7ea6f5;}}
  html,body{background:transparent;margin:0}
  body{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,sans-serif;color:var(--text);font-size:15px}
  .seg{display:flex;gap:8px;margin-bottom:10px}
  .seg button{flex:1;min-height:44px;border:1.5px solid var(--line-strong);border-radius:12px;background:transparent;color:var(--text);font:inherit;font-weight:600;cursor:pointer}
  .seg button.sel::before{content:"✓ ";font-weight:800;}
  .seg button.sel{border-color:var(--track);background:color-mix(in srgb,var(--track) 16%,transparent)}
  .tog{display:flex;gap:8px;margin-bottom:14px}
  .tog button{flex:1;min-height:44px;border:1.5px solid var(--line-strong);border-radius:12px;background:transparent;color:var(--text);font:inherit;font-weight:700;cursor:pointer}
  .tog button.on{border-color:var(--track);background:color-mix(in srgb,var(--track) 18%,transparent)}
  .result{display:flex;align-items:center;gap:14px;padding:14px;border-radius:12px;background:var(--surface-2);border:1px solid var(--line)}
  .dot{width:34px;height:34px;border-radius:50%;background:var(--surface-2);border:2.5px solid var(--line-strong);flex:none}
  .dot.on{background:var(--track);border-color:var(--track)}
  .v{font-weight:700} .v.good{color:var(--ok)} .v.off{color:var(--muted)}
  .exp{font-size:13px;color:var(--muted);margin-top:10px;min-height:34px}
</style></head>
<body>
  <div class="seg" id="mode">
    <button data-m="and" class="sel">Cre AND Flp</button>
    <button data-m="sub">Cre-on, Flp-off</button>
  </div>
  <div class="tog">
    <button id="cre">Cre: off</button>
    <button id="flp">Flp: off</button>
  </div>
  <div class="result"><span class="dot" id="dot"></span><span class="v" id="v">off</span></div>
  <div class="exp" id="exp"></div>
<script>
(function(){
  var mode='and',cre=false,flp=false;
  var mb=document.querySelectorAll('#mode button'),cb=document.getElementById('cre'),fb=document.getElementById('flp'),
      dot=document.getElementById('dot'),v=document.getElementById('v'),exp=document.getElementById('exp');
  mb.forEach(function(b){b.onclick=function(){mode=b.dataset.m;mb.forEach(function(x){x.classList.remove('sel')});b.classList.add('sel');render();};});
  cb.onclick=function(){cre=!cre;render();};fb.onclick=function(){flp=!flp;render();};
  function render(){
    cb.textContent='Cre: '+(cre?'on':'off');cb.classList.toggle('on',cre);
    fb.textContent='Flp: '+(flp?'on':'off');fb.classList.toggle('on',flp);
    var on=mode==='and'?(cre&&flp):(cre&&!flp);
    dot.classList.toggle('on',on);
    v.textContent=on?'✓ ON — expressed':'off';v.className='v '+(on?'good':'off');
    if(mode==='and') exp.textContent=on?'Both recombinases present — the AND-gate opens.':'An AND-gate needs Cre and Flp; off-target cells with just one stay off.';
    else exp.textContent=on?'Cre turns it on; Flp is absent, so it stays on.':(flp&&cre?'Flp subtracts this cell back out.':'No Cre, nothing to turn on.');
  }
  render();
})();
</script>
</body></html>
