<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 400" role="img"
     aria-label="Two neurons. The hM3Dq (Gq) neuron binds the drug and pulses green, firing an impulse down its myelinated axon; the hM4Di (Gi) neuron binds the drug and falls silent." xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <clipPath id="insL"><circle cx="350" cy="92" r="46"/></clipPath>
    <clipPath id="insR"><circle cx="470" cy="92" r="46"/></clipPath>
  </defs>
  <style>
    .bg{fill:#f5f7fb}.ink{fill:#131722}.muted{fill:#5b6472}
    .soma{fill:#dbe6f7;stroke:#8aa0c8}.den{stroke:#8aa0c8;fill:none;stroke-linecap:round}
    .axon{stroke:#8aa0c8;fill:none;stroke-linecap:round}.nuc{fill:#8fb0e6}
    .myelin{fill:#e9eef7;stroke:#e0a3b0}.mnuc{fill:#e0a3b0}.bouton{fill:#8aa0c8}
    .greenS{fill:#2fd08a}.ring{fill:none;stroke:#2fd08a}
    .lipid{fill:#f0bf63}.head{fill:#f5d487}.gpcr{fill:#7f9cf5;stroke:#5B8DEF}.gpcrS{fill:#c98bdd;stroke:#a85fc7}
    .lig{fill:#e0607a;stroke:#b6405a}.gq{fill:#2fd08a}.gi{fill:#d6455b}.ins{fill:#eef2fb;stroke:#c7d2e6}
    .label{font:600 15px -apple-system,sans-serif}.sub{font:400 12px -apple-system,sans-serif}.tag{font:700 11px -apple-system,sans-serif}
    @media (prefers-color-scheme:dark){
      .bg{fill:#0f1420}.ink{fill:#eef1f7}.muted{fill:#9aa4b5}
      .soma{fill:#223052;stroke:#4a5f8a}.den{stroke:#4a5f8a}.axon{stroke:#4a5f8a}.nuc{fill:#3f63a8}
      .myelin{fill:#232c3f;stroke:#8a5560}.mnuc{fill:#8a5560}.bouton{fill:#4a5f8a}
      .lipid{fill:#8a6a2e}.head{fill:#a9842f}.ins{fill:#161d2c;stroke:#2b3346}
    }
    /* soma breathing + green pulse (excited) */
    .pulse{transform-box:fill-box;transform-origin:center;animation:breathe 1.5s ease-in-out infinite}
    @keyframes breathe{0%{transform:scale(1)}50%{transform:scale(1.11)}100%{transform:scale(1)}}
    .greenS{animation:tint 1.5s ease-in-out infinite}
    @keyframes tint{0%{opacity:.15}50%{opacity:.9}100%{opacity:.15}}
    .r1{transform-box:fill-box;transform-origin:center;animation:ring 1.5s ease-out infinite}
    .r2{transform-box:fill-box;transform-origin:center;animation:ring 1.5s ease-out infinite;animation-delay:.5s}
    @keyframes ring{0%{transform:scale(.5);opacity:.55}80%{opacity:0}100%{transform:scale(1.9);opacity:0}}
    .ap{offset-rotate:0deg;animation:none}
    .ligL,.ligR{animation:dock 1.5s ease-in-out infinite}
    @keyframes dock{0%{transform:translateY(-14px);opacity:.2}30%{transform:translateY(0);opacity:1}100%{transform:translateY(0);opacity:1}}
    .dim{opacity:.45}
    .flat{animation:flat 1.5s ease-in-out infinite}@keyframes flat{0%,30%{opacity:0}45%{opacity:1}100%{opacity:1}}
  </style>

  <rect class="bg" x="0" y="0" width="820" height="400" rx="18"/>
  <text class="label ink" x="410" y="30" text-anchor="middle">Same drug, opposite effect — the receptor decides</text>
  <line x1="410" y1="48" x2="410" y2="372" stroke="#9aa4b5" stroke-width="1" stroke-dasharray="4 6" opacity="0.4"/>

  <!-- receptor inset LEFT (hM3Dq) -->
  <line class="den" x1="300" y1="150" x2="336" y2="120" stroke-width="1.5" stroke-dasharray="3 3"/>
  <circle class="ins" cx="350" cy="92" r="46" stroke-width="2"/>
  <g clip-path="url(#insL)">
    <rect class="lipid" x="304" y="86" width="92" height="7" rx="3"/><rect class="lipid" x="304" y="97" width="92" height="7" rx="3"/>
    <g class="head"><circle cx="316" cy="86" r="3"/><circle cx="336" cy="86" r="3"/><circle cx="366" cy="86" r="3"/><circle cx="384" cy="86" r="3"/><circle cx="316" cy="104" r="3"/><circle cx="336" cy="104" r="3"/><circle cx="366" cy="104" r="3"/><circle cx="384" cy="104" r="3"/></g>
    <path class="gpcr" d="M350 104 q-9 0 -9 -11 q0 -8 5 -9 q-3 -7 3 -9 q4 -2 6 1 q3 -4 7 -1 q5 3 2 9 q5 1 5 9 q0 11 -9 11 Z" stroke-width="1.5"/>
    <polygon class="lig ligL" points="350,72 356,76 356,82 350,86 344,82 344,76" stroke-width="1.5" style="transform-box:fill-box;transform-origin:center"/>
    <ellipse class="gq" cx="350" cy="116" rx="12" ry="6"/>
  </g>
  <text class="tag ink" x="350" y="152" text-anchor="middle">hM3Dq · Gq</text>

  <!-- receptor inset RIGHT (hM4Di) -->
  <line class="den" x1="520" y1="150" x2="484" y2="120" stroke-width="1.5" stroke-dasharray="3 3"/>
  <circle class="ins" cx="470" cy="92" r="46" stroke-width="2"/>
  <g clip-path="url(#insR)">
    <rect class="lipid" x="424" y="86" width="92" height="7" rx="3"/><rect class="lipid" x="424" y="97" width="92" height="7" rx="3"/>
    <g class="head"><circle cx="436" cy="86" r="3"/><circle cx="456" cy="86" r="3"/><circle cx="486" cy="86" r="3"/><circle cx="504" cy="86" r="3"/><circle cx="436" cy="104" r="3"/><circle cx="456" cy="104" r="3"/><circle cx="486" cy="104" r="3"/><circle cx="504" cy="104" r="3"/></g>
    <path class="gpcrS" d="M470 104 q-9 0 -9 -11 q0 -8 5 -9 q-3 -7 3 -9 q4 -2 6 1 q3 -4 7 -1 q5 3 2 9 q5 1 5 9 q0 11 -9 11 Z" stroke-width="1.5"/>
    <polygon class="lig ligR" points="470,72 476,76 476,82 470,86 464,82 464,76" stroke-width="1.5" style="transform-box:fill-box;transform-origin:center"/>
    <ellipse class="gi" cx="470" cy="116" rx="12" ry="6"/>
  </g>
  <text class="tag ink" x="470" y="152" text-anchor="middle">hM4Di · Gi/o</text>

  <!-- ===== LEFT NEURON (excited, pulsing green) ===== -->
  <g transform="translate(200,185)">
    <!-- dendritic tree -->
    <g class="den" stroke-width="3">
      <path d="M-4,-28 C -12,-52 -26,-66 -40,-82"/><path d="M-26,-66 C -36,-70 -48,-70 -58,-78"/><path d="M-26,-66 C -30,-80 -40,-88 -46,-100"/>
      <path d="M8,-28 C 16,-50 30,-62 46,-78"/><path d="M30,-62 C 40,-66 52,-64 62,-72"/><path d="M30,-62 C 36,-78 46,-86 52,-98"/>
      <path d="M-22,-16 C -42,-24 -60,-26 -80,-30"/><path d="M20,-16 C 40,-24 58,-26 78,-30"/><path d="M0,-32 C -2,-56 2,-72 0,-94"/>
    </g>
    <!-- myelinated axon -->
    <path class="axon" d="M0,30 C 2,54 -2,78 0,104 C 1,126 0,150 0,168" stroke-width="5"/>
    <g><rect class="myelin" x="-9" y="46" width="18" height="26" rx="8" stroke-width="2"/><ellipse class="mnuc" cx="6" cy="52" rx="2.2" ry="1.6"/></g>
    <g><rect class="myelin" x="-9" y="82" width="18" height="26" rx="8" stroke-width="2"/><ellipse class="mnuc" cx="6" cy="88" rx="2.2" ry="1.6"/></g>
    <g><rect class="myelin" x="-9" y="118" width="18" height="26" rx="8" stroke-width="2"/><ellipse class="mnuc" cx="6" cy="124" rx="2.2" ry="1.6"/></g>
    <!-- terminal arbor -->
    <g class="axon" stroke-width="3"><path d="M0,168 C -8,182 -18,190 -26,198"/><path d="M0,168 C 0,186 2,196 2,206"/><path d="M0,168 C 8,182 18,190 26,198"/></g>
    <circle class="bouton" cx="-26" cy="198" r="4"/><circle class="bouton" cx="2" cy="206" r="4"/><circle class="bouton" cx="26" cy="198" r="4"/>
    <!-- action potential travelling down the axon -->
    <circle class="greenS" r="5">
      <animateMotion dur="1.5s" repeatCount="indefinite" path="M0,30 C 2,54 -2,78 0,104 C 1,126 0,150 0,168" keyPoints="0;0;1" keyTimes="0;0.3;1" calcMode="linear"/>
    </circle>
    <!-- pulse rings -->
    <circle class="ring r1" cx="0" cy="0" r="34" stroke-width="3"/>
    <circle class="ring r2" cx="0" cy="0" r="34" stroke-width="3"/>
    <!-- soma: base + green tint, breathing -->
    <g class="pulse">
      <path class="soma" d="M-30,-4 C -34,-22 -20,-34 -2,-33 C 14,-32 32,-24 31,-5 C 30,10 24,30 4,31 C -14,32 -30,16 -30,-4 Z"/>
      <path class="greenS" d="M-30,-4 C -34,-22 -20,-34 -2,-33 C 14,-32 32,-24 31,-5 C 30,10 24,30 4,31 C -14,32 -30,16 -30,-4 Z"/>
      <ellipse class="nuc" cx="0" cy="-1" rx="13" ry="11"/>
    </g>
    <text class="sub ink" x="0" y="238" text-anchor="middle">Excited — fires</text>
  </g>

  <!-- ===== RIGHT NEURON (silenced, still) ===== -->
  <g transform="translate(620,185)">
    <g class="dim">
      <g class="den" stroke-width="3">
        <path d="M-4,-28 C -12,-52 -26,-66 -40,-82"/><path d="M-26,-66 C -36,-70 -48,-70 -58,-78"/><path d="M-26,-66 C -30,-80 -40,-88 -46,-100"/>
        <path d="M8,-28 C 16,-50 30,-62 46,-78"/><path d="M30,-62 C 40,-66 52,-64 62,-72"/><path d="M30,-62 C 36,-78 46,-86 52,-98"/>
        <path d="M-22,-16 C -42,-24 -60,-26 -80,-30"/><path d="M20,-16 C 40,-24 58,-26 78,-30"/><path d="M0,-32 C -2,-56 2,-72 0,-94"/>
      </g>
      <path class="axon" d="M0,30 C 2,54 -2,78 0,104 C 1,126 0,150 0,168" stroke-width="5"/>
      <g><rect class="myelin" x="-9" y="46" width="18" height="26" rx="8" stroke-width="2"/></g>
      <g><rect class="myelin" x="-9" y="82" width="18" height="26" rx="8" stroke-width="2"/></g>
      <g><rect class="myelin" x="-9" y="118" width="18" height="26" rx="8" stroke-width="2"/></g>
      <g class="axon" stroke-width="3"><path d="M0,168 C -8,182 -18,190 -26,198"/><path d="M0,168 C 0,186 2,196 2,206"/><path d="M0,168 C 8,182 18,190 26,198"/></g>
      <circle class="bouton" cx="-26" cy="198" r="4"/><circle class="bouton" cx="2" cy="206" r="4"/><circle class="bouton" cx="26" cy="198" r="4"/>
      <path class="soma" d="M-30,-4 C -34,-22 -20,-34 -2,-33 C 14,-32 32,-24 31,-5 C 30,10 24,30 4,31 C -14,32 -30,16 -30,-4 Z"/>
      <ellipse class="nuc" cx="0" cy="-1" rx="13" ry="11"/>
    </g>
    <!-- flat "no firing" mark across the axon -->
    <line class="flat" x1="-16" y1="100" x2="16" y2="100" stroke="#d6455b" stroke-width="4" stroke-linecap="round"/>
    <text class="sub ink" x="0" y="238" text-anchor="middle">Silenced — quiet</text>
  </g>

  <text class="sub muted" x="410" y="388" text-anchor="middle">Drug docks the engineered GPCR → G-protein sets the direction</text>
</svg>
