<!--
  Receptor potentials are graded; spikes are all-or-none. Computed live with two coupled compartments:
  a passive sensory ending whose mechanically gated conductance grows with the press, and a spike
  initiation zone with Hodgkin–Huxley Na⁺/K⁺ channels (squid constants, 6.3 °C). The receptor potential
  spreads passively from the ending to the zone and shrinks on the way. The ending's shape is a real
  mouse skin afferent, traced by Wu, Williams & Nathans (2012, eLife, 10.7554/eLife.00181), from
  NeuroMorpho.Org (neuron A11-11), seen from above.
-->

      r = rates(Vs);
      var dVe = -0.3 * (Ve + 65) - g * f * Ve - GC * (Ve - Vs);
      var dVs = -120 * m * m * m * h * (Vs - 50) - 36 * n * n * n * n * (Vs + 77) - 0.3 * (Vs + 54.387) - GC * (Vs - Ve);
      Ve += DT * dVe; Vs += DT * dVs;
      m += DT * (r[0] * (1 - m) - r[1] * m); h += DT * (r[2] * (1 - h) - r[3] * h); n += DT * (r[4] * (1 - n) - r[5] * n);
    }
    return out;
  }
  var RUNS = PRESS.map(simulate);
  var spikes = RUNS.map(function (run) { var c = 0; for (var i = 1; i < run.length; i++) if (run[i - 1].s < 0 && run[i].s >= 0) c++; return c; });
  var plateau = RUNS.map(function (run) { return run[Math.round(45 / 0.05)].e; });

  // ---------- drawing ----------
  var cv = document.getElementById('c'), ctx = cv.getContext('2d'), say = document.getElementById('say');
  var W = 0, H = 380, col = {};
  function readColors() { var cs = getComputedStyle(document.documentElement); ['text', 'muted', 'line', 'line-strong', 'surface-2', 'sp', 'rp', 'skin'].forEach(function (k) { col[k] = cs.getPropertyValue('--' + k).trim(); }); }
  function size() { W = cv.clientWidth || 320; var d = window.devicePixelRatio || 1; cv.width = Math.round(W * d); cv.height = Math.round(H * d); cv.style.height = H + 'px'; ctx.setTransform(d, 0, 0, d, 0, 0); }
  function label(s, x, y, c, align, weight) { ctx.fillStyle = c; ctx.font = (weight || 600) + ' 13px -apple-system,system-ui,sans-serif'; ctx.textAlign = align || 'left'; ctx.fillText(s, x, y); }
  var PT = 162, PB = H - 22, PL = 40, PR = function () { return W - 6; };
  var vy = function (v) { return PT + (40 - v) / 110 * (PB - PT); };
  var tx = function (t) { return PL + t / T * (PR() - PL); };

  function scene(s, fired) {
    // skin panel, the traced ending, the probe pressing on it, and the axon to the spike zone
    ctx.fillStyle = col.skin; rr(0, 0, W, 132, 12);
    var ox = 8, oy = 4, glow = Math.max(0, Math.min(1, (s.e + 65) / 30));
    ctx.save(); ctx.translate(ox, oy);
    ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    if (glow > 0.02) { ctx.globalAlpha = glow * 0.45; ctx.strokeStyle = col.rp; ctx.lineWidth = 5; ctx.stroke(ENDING); ctx.globalAlpha = 1; }
    ctx.strokeStyle = col.sp; ctx.lineWidth = 1.6; ctx.stroke(ENDING);
    ctx.restore();
    // probe: a shaded disk over the middle of the arbor that deepens with the press
    var px = ox + 58, py = oy + 46;
    ctx.globalAlpha = 0.18 + 0.5 * s.f; ctx.fillStyle = col.text;
    ctx.beginPath(); ctx.arc(px, py, 10 + 16 * s.f, 0, 6.283); ctx.fill(); ctx.globalAlpha = 1;
    ctx.strokeStyle = col.text; ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(px, py, 10 + 16 * s.f, 0, 6.283); ctx.stroke();
    label('probe', px + 30, py - 16, col.text);
    // stem → axon → spike zone
    var sx = ox + ROOT[0], sy = oy + ROOT[1], zx = Math.max(190, W * 0.62), ay = 112;
    ctx.strokeStyle = col.sp; ctx.lineWidth = 2.5;
    ctx.beginPath(); ctx.moveTo(sx, sy); ctx.quadraticCurveTo(sx, ay, sx + 30, ay); ctx.lineTo(W - 8, ay); ctx.stroke();
    var zoneOn = fired ? 1 : 0;
    ctx.fillStyle = zoneOn ? col.sp : col['surface-2']; ctx.strokeStyle = col.sp; ctx.lineWidth = 2;
    rr(zx - 18, ay - 8, 36, 16, 8);
    ctx.strokeStyle = col.sp; strokeRR(zx - 18, ay - 8, 36, 16, 8);
    label('spike zone', zx, ay - 14, col.sp, 'center');
    label('ending (traced)', 138, 58, col.muted, 'left', 400);
    label('to spinal cord →', W - 8, ay + 16 + 0, col.muted, 'right', 400);
  }
  function rr(x, y, w, h, r) { pathRR(x, y, w, h, r); ctx.fill(); }
  function strokeRR(x, y, w, h, r) { pathRR(x, y, w, h, r); ctx.stroke(); }
  function pathRR(x, y, w, h, r) { ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r); ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath(); }

  function plot(shown, k, upto) {
    ctx.strokeStyle = col.line; ctx.lineWidth = 1;
    [40, 0, -65].forEach(function (v) { ctx.beginPath(); ctx.moveTo(PL, vy(v)); ctx.lineTo(PR(), vy(v)); ctx.stroke(); });
    label('+40', PL - 6, vy(40) + 4, col.muted, 'right', 400); label('0', PL - 6, vy(0) + 4, col.muted, 'right', 400); label('−65', PL - 6, vy(-65) + 4, col.muted, 'right', 400);
    label('mV', PL + 4, vy(40) + 15, col.muted, 'left', 400);
    // the press, as a bar under the traces
    var run = RUNS[k];
    ctx.fillStyle = col.text; ctx.globalAlpha = 0.5;
    ctx.beginPath(); ctx.moveTo(tx(0), PB + 10);
    for (var i = 0; i <= upto; i += 4) ctx.lineTo(tx(run[i].t), PB + 10 - 6 * run[i].f);
    ctx.lineTo(tx(run[upto].t), PB + 10); ctx.closePath(); ctx.fill(); ctx.globalAlpha = 1;
    label('press', tx(OFF + RAMP) + 6, PB + 13, col.muted, 'left', 400);
    // earlier presses, faint, so the graded steps stay visible
    shown.forEach(function (j) { if (j !== k) trace(RUNS[j], RUNS[j].length - 1, 0.25); });
    trace(run, upto, 1);
    label('spike zone', PR() - 2, vy(40) + 15, col.sp, 'right'); label('ending', PR() - 2, vy(40) + 31, col.rp, 'right');
  }
  function trace(run, upto, a) {
    ctx.globalAlpha = a; ctx.lineJoin = 'round';
    [['e', col.rp, 2.5], ['s', col.sp, 2.5]].forEach(function (c) {
      ctx.strokeStyle = c[1]; ctx.lineWidth = c[2]; ctx.beginPath();
      for (var i = 0; i <= upto; i++) { var p = run[i]; i ? ctx.lineTo(tx(p.t), vy(p[c[0]])) : ctx.moveTo(tx(p.t), vy(p[c[0]])); }
      ctx.stroke();
    });
    ctx.globalAlpha = 1;
  }
  var WORDS = ['A gentle press: a small receptor potential at the ending. It fades on the way to the spike zone, which stays below threshold.',
    'A firmer press: a bigger receptor potential (it is graded), but the spike zone still stays below threshold.',
    'A hard press: the receptor potential is large enough that the spike zone fires, again and again while the press lasts.'];

  // ---------- playback: 1 ms of model time takes 40 ms; on open it plays gentle → firmer → hard, then repeats hard ----------
  var k = 0, auto = true, shown = [0], start = 0, holdUntil = 0, still = matchMedia('(prefers-reduced-motion: reduce)').matches;
  function select(j) { document.querySelectorAll('.seg button').forEach(function (b) { var on = Number(b.dataset.run) === j; b.classList.toggle('sel', on); b.setAttribute('aria-checked', String(on)); }); }
  function frame(now) {
    var run = RUNS[k], last = run.length - 1, i;
    if (still) { i = last; }
    else {
      if (!start) start = now;
      i = Math.min(last, Math.round((now - start) / 40 / 0.05));
      if (i === last && !holdUntil) holdUntil = now + 1400;
      if (holdUntil && now > holdUntil) {
        if (auto && k < 2) { k++; if (shown.indexOf(k) < 0) shown.push(k); select(k); } else auto = false;
        start = now; holdUntil = 0; i = 0;
      }
    }
    var s = RUNS[k][i], fired = RUNS[k][i].s > -20;
    ctx.clearRect(0, 0, W, H);
    scene(s, fired); plot(shown, k, i);
    var text = RUNS[k][i].t < ON ? 'At rest.' : WORDS[k];
    if (still) text = WORDS[k];
    if (say.textContent !== text) say.textContent = text;
    if (!still) requestAnimationFrame(frame);
  }
  document.querySelectorAll('.seg button').forEach(function (b) {
    b.onclick = function () {
      k = Number(b.dataset.run); auto = false; if (shown.indexOf(k) < 0) shown.push(k);
      start = 0; holdUntil = 0; select(k); if (still) requestAnimationFrame(frame);
    };
  });
  if (still) { shown = [0, 1, 2]; k = 2; }
  select(k); readColors(); size();
  matchMedia('(prefers-color-scheme: dark)').addEventListener('change', function () { readColors(); if (still) requestAnimationFrame(frame); });
  addEventListener('resize', function () { size(); if (still) requestAnimationFrame(frame); });
  window.__check = { spikes: spikes, plateau: plateau }; // for the app side's tests
  requestAnimationFrame(frame);
})();
</script>
</body></html>
