<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 360" role="img" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>Pseudounipolar DRG neuron</title>
  <desc>A DRG sensory neuron: the cell body sits off to the side on a short stem that forks into a peripheral branch to an organ and a central branch into the spinal cord dorsal horn. A signal travels from the organ up past the fork into the cord.</desc>
  <style>
    svg{--text:#22221f;--muted:#5f5e5a;--line:#dcdad1;--line-strong:#b4b2a9;--surface:#ffffff;--surface-2:#efede6;--ok:#0f6e56;--track:#7F77DD;}
    @media (prefers-color-scheme:dark){svg{--text:#f1efe8;--muted:#b4b2a9;--line:#3a3a37;--line-strong:#5f5e5a;--surface:#22221f;--surface-2:#2c2c2a;--ok:#5dcaa5;--track:#9a93e8;}}
    text{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,sans-serif;fill:var(--text);}
    .lbl{font-size:15px;font-weight:600;}
    .small{font-size:14px;font-weight:400;fill:var(--muted);}
    .branch{stroke:var(--line-strong);stroke-width:2.5;fill:none;stroke-linecap:round;}
    .tissue{fill:#e8b4b0;opacity:.5;stroke:var(--line-strong);stroke-width:2;}
    .soma{fill:var(--surface-2);stroke:var(--track);stroke-width:2.5;}
    .somaOn{fill:var(--track);animation:somaPulse 6s ease-in-out infinite;}
    .dh{fill:var(--surface-2);stroke:var(--line-strong);stroke-width:2;}
    .dhOn{fill:var(--track);opacity:0;animation:dhGlow 6s ease-in-out infinite;}
    .sig{fill:var(--track);stroke:var(--surface);stroke-width:2;offset-path:path("M180 300 L180 96");offset-rotate:0deg;animation:run 6s ease-in-out infinite;}
    @keyframes run{0%,16%{offset-distance:0%}70%,100%{offset-distance:100%}}
    @keyframes somaPulse{0%,34%{opacity:0}44%{opacity:.9}58%{opacity:.35}100%{opacity:.35}}
    @keyframes dhGlow{0%,64%{opacity:0}76%{opacity:.9}100%{opacity:.85}}
    @media (prefers-reduced-motion:reduce){
      .sig{animation:none;offset-distance:100%}
      .somaOn{animation:none;opacity:.35}
      .dhOn{animation:none;opacity:.85}
    }
  </style>

  <!-- central branch (fork -> cord) and peripheral branch (fork -> organ) -->
  <path class="branch" d="M180 210 L180 96"/>
  <path class="branch" d="M180 210 L180 300"/>
  <!-- stem to cell body, off to the side -->
  <path class="branch" d="M180 210 L120 210"/>

  <!-- dorsal horn at top -->
  <ellipse class="dh" cx="180" cy="64" rx="66" ry="32"/>
  <ellipse class="dhOn" cx="180" cy="64" rx="66" ry="32"/>
  <text class="lbl" x="180" y="69" text-anchor="middle">dorsal horn</text>

  <!-- organ (tissue) at bottom -->
  <ellipse class="tissue" cx="180" cy="324" rx="72" ry="28"/>
  <text class="lbl" x="180" y="341" text-anchor="middle">colon / pancreas</text>
  <!-- small terminal branches into organ -->
  <path class="branch" d="M180 300 q-14 8 -22 16 M180 300 q14 8 22 16 M180 300 q0 10 0 18" stroke-width="2"/>

  <!-- DRG capsule around the cell body -->
  <ellipse cx="116" cy="210" rx="40" ry="34" fill="none" stroke="var(--line-strong)" stroke-width="1.5" stroke-dasharray="4 5"/>
  <text class="small" x="116" y="162" text-anchor="middle">DRG</text>

  <!-- cell body -->
  <circle class="soma" cx="116" cy="210" r="16"/>
  <circle class="somaOn" cx="116" cy="210" r="16"/>
  <text class="lbl" x="116" y="262" text-anchor="middle">cell body</text>

  <!-- fork node -->
  <circle cx="180" cy="210" r="4" fill="var(--line-strong)"/>

  <!-- travelling signal -->
  <circle class="sig" r="7"/>

  <!-- branch labels (right side, clear of the soma) -->
  <text class="lbl" x="196" y="150" text-anchor="start">central branch</text>
  <text class="small" x="196" y="168" text-anchor="start">to cord</text>
  <text class="lbl" x="196" y="252" text-anchor="start">peripheral</text>
  <text class="lbl" x="196" y="270" text-anchor="start">branch</text>
</svg>
