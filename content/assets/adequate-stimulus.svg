  <line class="div" x1="16" y1="170" x2="344" y2="170"/>
  <text class="key" x="16" y="202">cut</text>
  <g class="out2"><text class="lbl" x="344" y="202" text-anchor="end" style="fill:var(--muted)">barely registers</text></g>
