<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 330" role="img" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>hM3Dq excites, hM4Di silences</title>
  <desc>The same drug docks two engineered receptors: hM3Dq couples to Gq and the neuron fires; hM4Di couples to Gi/o and the neuron goes quiet.</desc>
  <style>
    svg{--text:#22221f;--muted:#5f5e5a;--line-strong:#b4b2a9;--surface-2:#efede6;--warn:#ba7517;--ok:#0f6e56;--track:#5B8DEF;}
    @media (prefers-color-scheme:dark){svg{--text:#f1efe8;--muted:#b4b2a9;--line-strong:#5f5e5a;--surface-2:#2c2c2a;--warn:#ef9f27;--ok:#5dcaa5;--track:#7ea6f5;}}
    text{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,sans-serif;fill:var(--text);}
    .lbl{font-size:15px;font-weight:600;} .small{font-size:14px;font-weight:400;fill:var(--muted);}
    .den{fill:none;stroke:var(--line-strong);stroke-width:2.5;stroke-linecap:round;}
    .axon{fill:none;stroke:var(--line-strong);stroke-width:2.5;stroke-linecap:round;}
    .memb{fill:none;stroke:var(--line-strong);stroke-width:2;}
    .gpcr{fill:var(--surface-2);stroke:var(--track);stroke-width:2;}
    .drug{fill:var(--warn);}
    .somaE{fill:var(--track);stroke:var(--track);stroke-width:2.5;}
    .somaS{fill:var(--surface-2);stroke:var(--line-strong);stroke-width:2.5;}
    .spike{fill:none;stroke:var(--track);stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:150;stroke-dashoffset:150;animation:fire 5s linear infinite;}
    .flat{fill:none;stroke:var(--muted);stroke-width:2.5;stroke-linecap:round;}
    @keyframes fire{0%,20%{stroke-dashoffset:150}55%{stroke-dashoffset:0}80%{stroke-dashoffset:0}100%{stroke-dashoffset:150}}
    @media (prefers-reduced-motion:reduce){.spike{animation:none;stroke-dashoffset:0}}
  </style>

  <!-- divider -->
  <line x1="24" y1="165" x2="336" y2="165" stroke="var(--line-strong)" stroke-width="1" stroke-dasharray="3 5" opacity=".5"/>

  <!-- ROW 1: hM3Dq -> fires -->
  <text class="lbl" x="24" y="36" text-anchor="start">hM3Dq · Gq</text>
  <!-- receptor inset -->
  <line class="memb" x1="30" y1="86" x2="120" y2="86"/><line class="memb" x1="30" y1="98" x2="120" y2="98"/>
  <rect class="gpcr" x="66" y="78" width="18" height="28" rx="6"/>
  <polygon class="drug" points="75,58 83,63 83,72 75,77 67,72 67,63"/>
  <text class="small" x="98" y="128" text-anchor="middle">drug docks</text>
  <!-- neuron fires -->
  <g transform="translate(248,96)">
    <g class="den"><path d="M-5,-9 C -13,-20 -20,-24 -28,-31"/><path d="M5,-9 C 13,-20 20,-24 28,-31"/><path d="M-10,-3 C -24,-8 -32,-8 -41,-7"/></g>
    <circle class="somaE" r="13"/>
    <path class="axon" d="M12,2 L40,2"/>
  </g>
  <polyline class="spike" points="252,116 268,116 276,92 284,140 292,116 320,116"/>
  <text class="lbl" x="226" y="142" text-anchor="middle" style="fill:var(--track)">fires</text>

  <!-- ROW 2: hM4Di -> quiet -->
  <text class="lbl" x="24" y="200" text-anchor="start">hM4Di · Gi/o</text>
  <line class="memb" x1="30" y1="250" x2="120" y2="250"/><line class="memb" x1="30" y1="262" x2="120" y2="262"/>
  <rect class="gpcr" x="66" y="242" width="18" height="28" rx="6" style="stroke:var(--muted)"/>
  <polygon class="drug" points="75,222 83,227 83,236 75,241 67,236 67,227"/>
  <text class="small" x="98" y="292" text-anchor="middle">drug docks</text>
  <g transform="translate(248,260)">
    <g class="den"><path d="M-5,-9 C -13,-20 -20,-24 -28,-31"/><path d="M5,-9 C 13,-20 20,-24 28,-31"/><path d="M-10,-3 C -24,-8 -32,-8 -41,-7"/></g>
    <circle class="somaS" r="13"/>
    <path class="axon" d="M12,2 L40,2"/>
  </g>
  <line class="flat" x1="252" y1="280" x2="320" y2="280"/>
  <text class="lbl" x="226" y="306" text-anchor="middle" style="fill:var(--muted)">quiet</text>
</svg>
