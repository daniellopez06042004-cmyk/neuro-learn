<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 340" role="img"
     aria-label="CNO back-metabolizes to clozapine, which crosses the blood-brain barrier and binds an off-target neuron, which flashes red — an effect not caused by the DREADD." xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <style>
    .bg{fill:#f5f7fb}.ink{fill:#131722}.muted{fill:#5b6472}
    .cno{fill:#9aa4b5}.clz{fill:#e0607a;stroke:#b63f58}.bbb{stroke:#9aa4b5}
    .soma{fill:#dbe6f7;stroke:#8aa0c8}.den{stroke:#8aa0c8;fill:none;stroke-linecap:round}.axon{stroke:#8aa0c8;fill:none;stroke-linecap:round}
    .nuc{fill:#8fb0e6}.bouton{fill:#8aa0c8}.redP{fill:#d6455b}.warn{fill:#d6455b}
    .label{font:600 16px -apple-system,sans-serif}.sub{font:400 13px -apple-system,sans-serif}.tag{font:700 12px -apple-system,sans-serif}
    @media (prefers-color-scheme:dark){.bg{fill:#0f1420}.ink{fill:#eef1f7}.muted{fill:#9aa4b5}.bbb{stroke:#3a4356}
      .soma{fill:#223052;stroke:#4a5f8a}.den{stroke:#4a5f8a}.axon{stroke:#4a5f8a}.nuc{fill:#3f63a8}.bouton{fill:#4a5f8a}.warn{fill:#ff6f88}}
    .cnofade{animation:cf 5s ease-in-out infinite}@keyframes cf{0%,22%{opacity:1}34%{opacity:0}100%{opacity:0}}
    .convert{animation:cv 5s ease-in-out infinite}@keyframes cv{0%,20%{opacity:0}34%{opacity:1}100%{opacity:1}}
    .cross{animation:cr 5s ease-in-out infinite}@keyframes cr{0%,38%{transform:translateX(0);opacity:0}44%{opacity:1}64%{transform:translateX(250px);opacity:1}100%{transform:translateX(250px);opacity:1}}
    .hitPulse{transform-box:fill-box;transform-origin:center;animation:hp 5s ease-in-out infinite}
    @keyframes hp{0%,66%{transform:scale(1)}74%{transform:scale(1.12)}82%{transform:scale(1)}90%{transform:scale(1.08)}100%{transform:scale(1)}}
    .redTint{animation:rt 5s ease-in-out infinite}@keyframes rt{0%,66%{opacity:0}76%{opacity:.85}88%{opacity:.4}100%{opacity:.5}}
    .warnpop{transform-box:fill-box;transform-origin:center;animation:wp 5s ease-in-out infinite}@keyframes wp{0%,70%{opacity:0;transform:scale(.6)}84%{opacity:1;transform:scale(1)}100%{opacity:1}}
  </style>
  <rect class="bg" x="0" y="0" width="820" height="340" rx="18"/>
  <text class="label ink" x="300" y="34" text-anchor="middle">CNO isn't fully inert — it back-converts to clozapine</text>

  <!-- CNO -->
  <g class="cnofade" transform="translate(120,150)"><circle class="cno" cx="0" cy="0" r="26"/><text class="tag" x="0" y="5" text-anchor="middle" fill="#fff">CNO</text><text class="sub muted" x="0" y="48" text-anchor="middle">"inert" drug</text></g>
  <!-- convert -->
  <g class="convert"><text class="sub muted" x="205" y="145" text-anchor="middle">metabolized →</text>
    <g transform="translate(300,150)"><circle class="clz" cx="0" cy="0" r="28" stroke-width="2"/><text class="tag" x="0" y="5" text-anchor="middle" fill="#fff">clozapine</text></g>
  </g>

  <!-- BBB -->
  <line class="bbb" x1="440" y1="60" x2="440" y2="275" stroke-width="4" stroke-dasharray="6 8"/>
  <text class="sub muted" x="440" y="296" text-anchor="middle">blood–brain barrier</text>

  <!-- clozapine crosses -->
  <g class="cross" transform="translate(360,150)"><circle class="clz" cx="0" cy="0" r="18" stroke-width="2"/><text class="tag" x="0" y="4" text-anchor="middle" fill="#fff" font-size="10">clz</text></g>

  <!-- off-target NEURON (organic) -->
  <g transform="translate(650,175)">
    <g class="den" stroke-width="3"><path d="M-3,-18 C -8,-32 -18,-40 -26,-50"/><path d="M4,-18 C 10,-32 20,-38 30,-48"/><path d="M-14,-10 C -28,-16 -40,-18 -52,-20"/><path d="M12,-10 C 26,-16 38,-18 50,-20"/><path d="M0,-20 C -1,-34 1,-44 0,-56"/></g>
    <path class="axon" d="M0,20 C 2,40 -2,56 0,74" stroke-width="4"/>
    <g class="axon" stroke-width="3"><path d="M0,74 C -7,84 -14,88 -20,94"/><path d="M0,74 C 1,86 1,92 1,98"/><path d="M0,74 C 7,84 14,88 20,94"/></g>
    <circle class="bouton" cx="-20" cy="94" r="3.5"/><circle class="bouton" cx="1" cy="98" r="3.5"/><circle class="bouton" cx="20" cy="94" r="3.5"/>
    <g class="hitPulse">
      <path class="soma" d="M-22,-3 C -25,-16 -14,-25 -1,-24 C 11,-23 24,-17 23,-3 C 22,8 17,22 3,23 C -10,24 -22,12 -22,-3 Z"/>
      <path class="redP redTint" d="M-22,-3 C -25,-16 -14,-25 -1,-24 C 11,-23 24,-17 23,-3 C 22,8 17,22 3,23 C -10,24 -22,12 -22,-3 Z"/>
      <ellipse class="nuc" cx="0" cy="-1" rx="10" ry="8"/>
    </g>
    <text class="sub ink" x="0" y="120" text-anchor="middle">off-target neuron</text>
  </g>

  <!-- warning -->
  <g class="warnpop" transform="translate(650,95)"><polygon class="warn" points="0,-22 20,16 -20,16"/><text class="tag" x="0" y="12" text-anchor="middle" fill="#fff">!</text></g>

  <text class="sub muted" x="410" y="325" text-anchor="middle">Effect without a DREADD → why the DREADD-free + actuator control is essential</text>
</svg>
