    .a1{animation:a1 10s ease-out infinite;}
    @keyframes a1{0%,44%{stroke-dashoffset:1;opacity:1}51%,95%{stroke-dashoffset:0;opacity:1}99%{stroke-dashoffset:0;opacity:0}100%{stroke-dashoffset:1;opacity:0}}
    .a2{animation:a2 10s ease-out infinite;}
    @keyframes a2{0%,48%{stroke-dashoffset:1;opacity:1}55%,95%{stroke-dashoffset:0;opacity:1}99%{stroke-dashoffset:0;opacity:0}100%{stroke-dashoffset:1;opacity:0}}
    .a3{animation:a3 10s ease-out infinite;}
    @keyframes a3{0%,52%{stroke-dashoffset:1;opacity:1}59%,95%{stroke-dashoffset:0;opacity:1}99%{stroke-dashoffset:0;opacity:0}100%{stroke-dashoffset:1;opacity:0}}
    .lit{opacity:0;animation:lit 10s ease-in-out infinite;}
    @keyframes lit{0%,58%{opacity:0;}66%,95%{opacity:1;}99%,100%{opacity:0;}}
    .L1{opacity:0;animation:L1 10s ease-in-out infinite;}@keyframes L1{0%,28%{opacity:0;}34%,95%{opacity:1;}99%,100%{opacity:0;}}
    .L2{opacity:0;animation:L2 10s ease-in-out infinite;}@keyframes L2{0%,48%{opacity:0;}54%,95%{opacity:1;}99%,100%{opacity:0;}}
