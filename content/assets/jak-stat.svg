<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 322" role="img">
  <title>JAK-STAT signaling from receptor to gene</title>
  <desc>A cytokine binds its receptor in the cell surface. The receptor-associated JAK enzymes become active (filled) and tag STAT proteins (amber dot); the tagged STATs pair up, travel into the nucleus, sit on the DNA and switch on a target gene.</desc>
  <style>
    :root,svg{--text:#22221f;--muted:#5f5e5a;--line:#dcdad1;--line-strong:#b4b2a9;--surface:#ffffff;--surface-2:#efede6;--ok:#0f6e56;--bad:#993c1d;--warn:#ba7517;--track:#D4537E;--lipid:#e8d9c4;}
    @media (prefers-color-scheme:dark){:root,svg{--text:#f1efe8;--muted:#b4b2a9;--line:#3a3a37;--line-strong:#5f5e5a;--surface:#22221f;--surface-2:#2c2c2a;--ok:#5dcaa5;--bad:#f0997b;--warn:#ef9f27;--track:#e67ba0;--lipid:#4a4237;}}
    svg{--t1:color-mix(in srgb,var(--track) 22%,var(--surface));--t2:color-mix(in srgb,var(--track) 50%,var(--surface));--t0:color-mix(in srgb,var(--track) 9%,var(--surface));--w1:color-mix(in srgb,var(--warn) 24%,var(--surface));--b1:color-mix(in srgb,var(--bad) 22%,var(--surface));--ok1:color-mix(in srgb,var(--ok) 22%,var(--surface));--n1:color-mix(in srgb,var(--line-strong) 32%,var(--surface));--n2:color-mix(in srgb,var(--line-strong) 75%,var(--surface));--head:color-mix(in srgb,var(--lipid) 70%,var(--text));--tissue:color-mix(in srgb,#e8b4b0 30%,var(--surface-2));}
    text{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,sans-serif;font-size:14px;font-weight:600;fill:var(--text);}
    .m{font-weight:400;fill:var(--muted);}
    .lip{fill:var(--lipid);}
    .hd{fill:none;stroke:var(--head);stroke-width:7;stroke-linecap:round;stroke-dasharray:0 8;}
    .cT{fill:var(--t1);stroke:var(--track);stroke-width:2;}
    .cN{fill:var(--n1);stroke:var(--line-strong);stroke-width:2;}
    .nT{fill:var(--t2);}
    .nN{fill:var(--n2);}
    .jak{opacity:0;animation:jak 9s ease-in-out infinite;}
    @keyframes jak{0%,22%{opacity:0}32%,95%{opacity:1}100%{opacity:0}}
    .geneOn{opacity:0;animation:geneOn 9s ease-in-out infinite;}
    @keyframes geneOn{0%,60%{opacity:0}74%,95%{opacity:1}100%{opacity:0}}
    .geneOff{opacity:1;animation:geneOff 9s ease-in-out infinite;}
    @keyframes geneOff{0%,60%{opacity:1}70%,95%{opacity:0}100%{opacity:1}}
    .st{fill:var(--t2);stroke:var(--track);stroke-width:2;}
    .tag{opacity:0;animation:tag 9s ease-in-out infinite;}
    @keyframes tag{0%,30%{opacity:0}40%,95%{opacity:1}100%{opacity:0}}
    @keyframes m0{0%,42%{transform:translate(-48px,-82px);opacity:1}52%{transform:translate(-14px,-54px);opacity:1}60%{transform:translate(0px,0px);opacity:1}95%{transform:translate(0px,0px);opacity:1}97.5%{transform:translate(0px,0px);opacity:0}97.6%{transform:translate(-48px,-82px);opacity:0}100%{transform:translate(-48px,-82px);opacity:1}}
    .m0{animation:m0 9s ease-in-out infinite;}
    @keyframes m1{0%,42%{transform:translate(22px,-82px);opacity:1}52%{transform:translate(11px,-54px);opacity:1}60%{transform:translate(0px,0px);opacity:1}95%{transform:translate(0px,0px);opacity:1}97.5%{transform:translate(0px,0px);opacity:0}97.6%{transform:translate(22px,-82px);opacity:0}100%{transform:translate(22px,-82px);opacity:1}}
    .m1{animation:m1 9s ease-in-out infinite;}
    .lab0{opacity:1;animation:lab0 9s ease-in-out infinite;}
    @keyframes lab0{0%,40%{opacity:1}46%,95%{opacity:0}100%{opacity:1}}
    .lab1{opacity:0;animation:lab1 9s ease-in-out infinite;}
    @keyframes lab1{0%,56%{opacity:0}62%,95%{opacity:1}100%{opacity:0}}
    .cyk{animation:cyk 9s ease-in-out infinite;}
    @keyframes cyk{0%,8%{opacity:0;transform:translate(60px,-8px)}12%{opacity:1}22%,95%{opacity:1;transform:translate(0,0)}100%{opacity:0;transform:translate(0,0)}}
    @media (prefers-reduced-motion:reduce){*{animation-delay:-7.8s!important;animation-play-state:paused!important;}}
  </style>
  <!-- the cell: cytoplasm under the membrane -->
  <path d="M12 104 H348 V296 Q348 310 334 310 H26 Q12 310 12 296 Z" style="fill:var(--t0)"/>
  <rect class="lip" x="12" y="70" width="138" height="36"/><path class="hd" d="M16 73.5 H150"/><path class="hd" d="M16 102.5 H150"/><rect class="lip" x="190" y="70" width="158" height="36"/><path class="hd" d="M194 73.5 H348"/><path class="hd" d="M194 102.5 H348"/>
  <!-- cytokine receptor -->
  <rect class="cT" x="152" y="52" width="16" height="82" rx="7"/>
  <rect class="cT" x="172" y="52" width="16" height="82" rx="7"/>
  <circle class="cT" cx="156" cy="54" r="11"/>
  <circle class="cT" cx="184" cy="54" r="11"/>
  <path class="cN" d="M159.5 140 C159.5 142.8 157.6 146.8 154.8 148.7 C152 150.5 146.5 151.7 142.8 151.1 C139.1 150.5 134 147.7 132.5 145.1 C130.9 142.5 131.9 138 133.7 135.3 C135.4 132.7 139.4 129.8 142.9 129.2 C146.4 128.6 151.8 129.8 154.6 131.6 C157.3 133.4 159.4 137.2 159.5 140Z"/><path class="jak" d="M159.5 140 C159.5 142.8 157.6 146.8 154.8 148.7 C152 150.5 146.5 151.7 142.8 151.1 C139.1 150.5 134 147.7 132.5 145.1 C130.9 142.5 131.9 138 133.7 135.3 C135.4 132.7 139.4 129.8 142.9 129.2 C146.4 128.6 151.8 129.8 154.6 131.6 C157.3 133.4 159.4 137.2 159.5 140Z" style="fill:var(--track);stroke:var(--track);stroke-width:2"/>
  <path class="cN" d="M208 140 C208 142.8 205.5 146.7 202.7 148.5 C199.8 150.3 194.4 151.5 190.9 150.8 C187.3 150.2 183.3 147.3 181.6 144.7 C179.9 142 179.1 137.4 180.7 135 C182.3 132.5 187.4 130.4 191.1 129.9 C194.7 129.3 199.8 129.8 202.7 131.5 C205.5 133.2 208 137.2 208 140Z"/><path class="jak" d="M208 140 C208 142.8 205.5 146.7 202.7 148.5 C199.8 150.3 194.4 151.5 190.9 150.8 C187.3 150.2 183.3 147.3 181.6 144.7 C179.9 142 179.1 137.4 180.7 135 C182.3 132.5 187.4 130.4 191.1 129.9 C194.7 129.3 199.8 129.8 202.7 131.5 C205.5 133.2 208 137.2 208 140Z" style="fill:var(--track);stroke:var(--track);stroke-width:2"/>
  <text x="216" y="145">JAK</text>
  <!-- nucleus -->
  <path d="M340.2 254 C339.9 262.4 329 271.7 314.2 279.1 C299.4 286.5 276.8 294.4 251.3 298.2 C225.8 302 189.9 303.1 161.1 301.8 C132.2 300.6 99.6 296.4 78.1 290.7 C56.6 284.9 40.1 275.7 32.3 267.4 C24.4 259 23.8 249 31.1 240.5 C38.4 232.1 54.4 222.5 76 216.6 C97.6 210.7 131.8 206.2 160.7 205.3 C189.5 204.4 223.3 207.3 249.2 211.2 C275.1 215 301 221.4 316.2 228.5 C331.3 235.7 340.5 245.6 340.2 254Z" style="fill:var(--t1);stroke:var(--track);stroke-width:2"/>
  <path d="M44 266 Q54 256 64 266 Q74 276 84 266 Q94 256 104 266 Q114 276 124 266 Q134 256 144 266 Q154 276 164 266 Q174 256 184 266 Q194 276 204 266" style="fill:none;stroke:var(--n2);stroke-width:2.5"/><path d="M44 266 Q54 276 64 266 Q74 256 84 266 Q94 276 104 266 Q114 256 124 266 Q134 276 144 266 Q154 256 164 266 Q174 276 184 266 Q194 256 204 266" style="fill:none;stroke:var(--n2);stroke-width:2.5"/>
  <rect class="cN" x="206" y="254" width="118" height="24" rx="7"/>
  <rect class="geneOn" x="206" y="254" width="118" height="24" rx="7" style="fill:var(--track);stroke:var(--track);stroke-width:2"/>
  <text class="geneOff" x="265" y="271" text-anchor="middle">target gene</text>
  <text class="geneOn" x="265" y="271" text-anchor="middle" style="fill:var(--surface)">target gene ON</text>
  <text class="m" x="50" y="244">nucleus</text>
  <g transform="translate(170 266)"><g class="m0"><rect x="-12" y="-10" width="24" height="20" rx="6" class="st"/><circle class="tag" cx="10" cy="-9" r="5" style="fill:var(--warn);stroke:var(--surface);stroke-width:1.5"/></g></g>
  <g transform="translate(196 266)"><g class="m1"><rect x="-12" y="-10" width="24" height="20" rx="6" class="st"/><circle class="tag" cx="10" cy="-9" r="5" style="fill:var(--warn);stroke:var(--surface);stroke-width:1.5"/></g></g>
  <text class="lab0" x="240" y="189">STAT</text>
  <text class="lab1" x="183" y="242" text-anchor="middle">STAT</text>
  <!-- the cytokine arrives and binds -->
  <g class="cyk"><path d="M185.8 30 C185.8 33.1 182.6 37.3 179.4 39.4 C176.1 41.6 170.2 43.6 166.3 42.9 C162.5 42.2 158.2 38.3 156.4 35.2 C154.5 32.2 153.6 27 155.3 24.3 C157.1 21.7 162.9 19.8 166.9 19.2 C170.9 18.6 176.2 18.8 179.3 20.6 C182.5 22.4 185.8 26.9 185.8 30Z" style="fill:var(--w1);stroke:var(--warn);stroke-width:2"/><text x="192" y="34" style="fill:var(--warn)">cytokine</text></g>
  <text x="72" y="128">receptor</text>
</svg>
