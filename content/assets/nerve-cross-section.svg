<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 340" role="img">
  <title>Inside a peripheral nerve</title>
  <desc>Cross-section of a peripheral nerve. The epineurium wraps the whole nerve and fills the space between three fascicles. Each fascicle is a bundle of axons bound by a ring of perineurium. Inside a fascicle, each axon has its own thin endoneurium; larger axons are myelinated (a thick ring around the axon) and the smallest are unmyelinated. A few axons are coloured as sensory and a few as motor, mixed together in the same fascicles: a mixed nerve.</desc>
  <style>
    svg{--text:#22221f;--muted:#5f5e5a;--line:#dcdad1;--line-strong:#b4b2a9;--surface:#ffffff;--surface-2:#efede6;--ok:#0f6e56;--bad:#993c1d;--warn:#ba7517;--track:#7F77DD;}
    @media (prefers-color-scheme:dark){svg{--text:#f1efe8;--muted:#b4b2a9;--line:#3a3a37;--line-strong:#5f5e5a;--surface:#22221f;--surface-2:#2c2c2a;--ok:#5dcaa5;--bad:#f0997b;--warn:#ef9f27;--track:#a39df0;}}
    svg{--tissue:color-mix(in srgb,#e8b4b0 30%,var(--surface-2));--tissue-lo:color-mix(in srgb,#e8b4b0 12%,var(--surface));--peri:color-mix(in srgb,#e8b4b0 50%,var(--line-strong));--myelin:color-mix(in srgb,var(--muted) 42%,var(--surface));--n1:color-mix(in srgb,var(--line-strong) 30%,var(--surface));--motor:color-mix(in srgb,var(--text) 78%,var(--surface));}
    text{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,sans-serif;font-size:15px;font-weight:600;fill:var(--text);}
    .nerve{fill:var(--tissue);stroke:var(--line-strong);stroke-width:2.5;}
    .fib{fill:none;stroke:color-mix(in srgb,#e8b4b0 45%,var(--line-strong));stroke-width:1.5;stroke-linecap:round;opacity:.7;}
    .endo-sp{fill:var(--tissue-lo);}
    .peri{fill:none;stroke:var(--peri);stroke-width:5;}
    .endo{fill:var(--surface);stroke:var(--peri);stroke-width:1.6;}
    .my{fill:none;stroke:var(--myelin);}
    .axN{fill:var(--n1);}
    .axS{fill:var(--track);}
    .axM{fill:var(--motor);}
    .mdot{fill:var(--surface);}
    .lead{fill:none;stroke:var(--text);stroke-width:1.5;}
    .tip{fill:var(--text);}
  </style>

