<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 300" width="360" height="300" role="img" aria-labelledby="t d">
  <title id="t">Why glucokinase is the glucose sensor</title>
  <desc id="d">Two enzyme-rate curves plotted against blood glucose. Hexokinase, with its low Km, rises steeply and is already flat at its maximum before the normal blood-glucose band. Glucokinase, with its high Km, is still climbing right across that band, so its rate tracks how much glucose there is. The curves are illustrative Michaelis-Menten shapes with no numbers.</desc>
  <style>
    svg{--text:#22221f;--muted:#5f5e5a;--line:#dcdad1;--line-strong:#b4b2a9;--surface:#ffffff;--surface-2:#efede6;--track:#7F77DD;--warn:#ba7517;}
    @media (prefers-color-scheme:dark){svg{--text:#f1efe8;--muted:#b4b2a9;--line:#3a3a37;--line-strong:#5f5e5a;--surface:#22221f;--surface-2:#2c2c2a;--track:#a39df0;--warn:#ef9f27;}}
    text{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,sans-serif;fill:var(--text);}
    .lbl{font-size:15px;font-weight:600;}
    .ax{font-size:14px;font-weight:400;fill:var(--muted);}
    .note{font-size:13px;font-weight:400;fill:var(--muted);}
    .axis{fill:none;stroke:var(--line-strong);stroke-width:1.6;stroke-linecap:round;}
    .band{fill:color-mix(in srgb,var(--warn) 16%,var(--surface));}
    .band-e{fill:none;stroke:color-mix(in srgb,var(--warn) 55%,var(--line-strong));stroke-width:1.2;stroke-dasharray:4 3;}
    .gk{fill:none;stroke:var(--track);stroke-width:3.4;stroke-linecap:round;stroke-linejoin:round;}
    .hex{fill:none;stroke:var(--line-strong);stroke-width:3;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:7 4;}
    .tick{fill:none;stroke:var(--line-strong);stroke-width:1.2;}
  </style>
