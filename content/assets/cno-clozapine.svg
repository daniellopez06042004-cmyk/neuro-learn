<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 368" role="img">
  <title>CNO back-converts to clozapine</title>
  <desc>CNO, a prodrug, is converted to clozapine, which crosses the blood–brain barrier and binds an off-target receptor on a neuron that has no DREADD.</desc>
  <style>
    svg{--text:#22221f;--muted:#5f5e5a;--line:#dcdad1;--line-strong:#b4b2a9;--surface:#ffffff;--surface-2:#efede6;--warn:#ba7517;--bad:#993c1d;}
    @media (prefers-color-scheme:dark){svg{--text:#f1efe8;--muted:#b4b2a9;--line:#3a3a37;--line-strong:#5f5e5a;--surface:#22221f;--surface-2:#2c2c2a;--warn:#ef9f27;--bad:#f0997b;}}
    text{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,sans-serif;fill:var(--text);}
    .lbl{font-size:16px;font-weight:600;}
    .small{font-size:14px;font-weight:400;fill:var(--muted);}
    .onTxt{font-size:16px;font-weight:600;fill:#ffffff;}
    .cnoF{fill:color-mix(in srgb, var(--line-strong) 26%, var(--surface));stroke:var(--line-strong);stroke-width:2.5;}
    .clzF{fill:var(--warn);stroke:color-mix(in srgb, var(--warn) 70%, var(--text));stroke-width:2;}
    .molF{fill:color-mix(in srgb, var(--warn) 80%, var(--surface));stroke:color-mix(in srgb, var(--warn) 70%, var(--text));stroke-width:2;}
    .conv{fill:color-mix(in srgb, var(--muted) 26%, var(--surface));stroke:var(--muted);stroke-width:2;stroke-linejoin:round;}
    .endo{fill:color-mix(in srgb, var(--line-strong) 26%, var(--surface));stroke:var(--line-strong);stroke-width:2;}
    .den{fill:none;stroke:var(--line-strong);stroke-width:2.5;stroke-linecap:round;}
    .axon{fill:none;stroke:var(--line-strong);stroke-width:3;stroke-linecap:round;}
    .soma{fill:color-mix(in srgb, var(--line-strong) 20%, var(--surface));stroke:var(--line-strong);stroke-width:2.5;}
    .nuc{fill:color-mix(in srgb, var(--line-strong) 50%, var(--surface));}
    .rec{fill:color-mix(in srgb, var(--line-strong) 34%, var(--surface));stroke:var(--line-strong);stroke-width:2;}
    .recHit{fill:color-mix(in srgb, var(--bad) 55%, var(--surface));stroke:var(--bad);stroke-width:2;opacity:0;animation:hit 9s ease-in-out infinite;}
    .somaHit{fill:color-mix(in srgb, var(--bad) 40%, var(--surface));stroke:var(--bad);stroke-width:2.5;opacity:0;animation:hit 9s ease-in-out infinite;}
    /* beats: 1 CNO is given · 2 it back-converts to clozapine · 3 clozapine crosses the barrier · 4 it binds an off-target receptor */
    .step2{opacity:0;animation:step2 9s ease-in-out infinite;}
    .mol{opacity:0;animation:cross 9s ease-in-out infinite;}
    .verdict{opacity:0;animation:hit 9s ease-in-out infinite;}
    @keyframes step2{0%,14%{opacity:0;transform:translateY(-10px)}28%,100%{opacity:1;transform:translateY(0)}}
    @keyframes cross{0%,30%{opacity:0;transform:translateY(0)}38%{opacity:1;transform:translateY(16px)}62%,100%{opacity:1;transform:translateY(82px)}}
    @keyframes hit{0%,66%{opacity:0}78%,100%{opacity:1}}
    @media (prefers-reduced-motion:reduce){
      .step2{animation:none;opacity:1;transform:none}
      .mol{animation:none;opacity:1;transform:translateY(82px)}
      .recHit,.somaHit,.verdict{animation:none;opacity:1}
    }
  </style>

  <!-- ===== stage 1: CNO, a prodrug ===== -->
  <rect class="cnoF" x="128" y="18" width="104" height="44" rx="22"/>
  <text class="lbl" x="180" y="46" text-anchor="middle">CNO</text>
  <text class="small" x="180" y="80" text-anchor="middle">prodrug</text>

  <!-- ===== stage 2: back-conversion to clozapine ===== -->
  <g class="step2">
    <path class="conv" d="M172 90 L188 90 L188 104 L198 104 L180 122 L162 104 L172 104 Z"/>
    <rect class="clzF" x="118" y="128" width="124" height="44" rx="22"/>
    <text class="onTxt" x="180" y="156" text-anchor="middle">clozapine</text>
  </g>

  <!-- ===== blood–brain barrier ===== -->
  <text class="small" x="344" y="196" text-anchor="end">blood–brain barrier</text>
  <g class="endo">
    <rect x="16" y="204" width="38" height="26" rx="8"/><rect x="58" y="204" width="38" height="26" rx="8"/>
    <rect x="100" y="204" width="38" height="26" rx="8"/><rect x="142" y="204" width="38" height="26" rx="8"/>
    <rect x="184" y="204" width="38" height="26" rx="8"/><rect x="226" y="204" width="38" height="26" rx="8"/>
    <rect x="268" y="204" width="38" height="26" rx="8"/><rect x="310" y="204" width="34" height="26" rx="8"/>
  </g>

  <!-- ===== clozapine crossing the barrier ===== -->
  <g class="mol">
    <polygon class="molF" points="180,166 193,173.5 193,188.5 180,196 167,188.5 167,173.5"/>
  </g>

  <!-- ===== stage 3: an off-target neuron with no DREADD ===== -->
  <g transform="translate(180,308)">
    <g class="den">
      <path d="M-9,-15 C-19,-28 -27,-34 -35,-42"/><path d="M-24,-30 L-33,-32"/>
      <path d="M9,-15 C19,-28 27,-34 35,-42"/><path d="M24,-30 L33,-32"/>
      <path d="M-15,-8 C-28,-15 -38,-17 -48,-16"/><path d="M-34,-15 L-40,-22"/>
      <path d="M15,-8 C28,-15 38,-17 48,-16"/><path d="M34,-15 L40,-22"/>
    </g>
    <path class="axon" d="M14,16 L54,34"/>
    <circle class="soma" r="22"/>
    <circle class="somaHit" r="22"/>
    <circle class="nuc" r="7"/>
  </g>
  <!-- the receptor clozapine binds -->
  <g>
    <rect class="rec" x="168" y="274" width="10" height="26" rx="4"/>
    <rect class="rec" x="182" y="274" width="10" height="26" rx="4"/>
    <rect class="recHit" x="168" y="274" width="10" height="26" rx="4"/>
    <rect class="recHit" x="182" y="274" width="10" height="26" rx="4"/>
  </g>
  <g class="verdict">
    <text class="lbl" x="180" y="356" text-anchor="middle" style="fill:var(--bad)">✕ no DREADD · off-target</text>
  </g>
</svg>
