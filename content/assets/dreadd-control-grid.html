<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="color-scheme" content="light dark"><meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root{--text:#22221f;--muted:#5f5e5a;--line:#dcdad1;--line-strong:#b4b2a9;--surface-2:#efede6;--ok:#0f6e56;--bad:#993c1d;--warn:#ba7517;--track:#5B8DEF;}
  @media (prefers-color-scheme:dark){:root{--text:#f1efe8;--muted:#b4b2a9;--line:#3a3a37;--line-strong:#5f5e5a;--surface-2:#2c2c2a;--ok:#5dcaa5;--bad:#f0997b;--warn:#ef9f27;--track:#7ea6f5;}}
  html,body{background:transparent;margin:0}
  body{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,sans-serif;color:var(--text);font-size:15px}
  .tog{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:44px;padding:0 4px}
  .tog span{font-weight:600}
  .tog small{display:block;font-weight:400;color:var(--muted);font-size:12px}
  .sw{min-width:92px;min-height:44px;border:1.5px solid var(--line-strong);border-radius:12px;background:transparent;color:var(--text);font:inherit;font-weight:700;cursor:pointer}
  .sw.on{border-color:var(--track);background:color-mix(in srgb,var(--track) 18%,transparent)}
  .readout{margin-top:14px;padding:12px 14px;border-radius:12px;background:var(--surface-2);border:1px solid var(--line)}
  .v{font-weight:700} .v.good{color:var(--ok)} .v.bad{color:var(--bad)} .v.off{color:var(--muted)}
  .exp{font-size:13px;color:var(--muted);margin-top:6px;min-height:34px}
</style></head>
<body>
  <div class="tog"><span>DREADD expressed?<small>hM3Dq in your neurons</small></span><button class="sw" id="dreadd">off</button></div>
  <div class="tog"><span>Actuator given?<small>CNO / DCZ</small></span><button class="sw" id="act">off</button></div>
  <div class="tog"><span>Actuator off-target?<small>e.g. CNO→clozapine</small></span><button class="sw" id="offt">off</button></div>
  <div class="readout"><span class="v" id="v"></span><div class="exp" id="exp"></div></div>
<script>
(function(){
  var d=document.getElementById('dreadd'),a=document.getElementById('act'),o=document.getElementById('offt'),
      v=document.getElementById('v'),exp=document.getElementById('exp');
  function st(b){return b.classList.contains('on');}
  [d,a,o].forEach(function(b){b.onclick=function(){b.classList.toggle('on');b.textContent=st(b)?'on':'off';render();};});
  function render(){
    var D=st(d),A=st(a),O=st(o);
    if(D&&A){v.textContent='✓ experimental — interpretable';v.className='v good';exp.textContent='DREADD + actuator. Readable only because the three control quadrants stay silent.';}
    else if(D&&!A){v.textContent='leak control';v.className='v off';exp.textContent='DREADD, no drug. Any effect here means a leaky DREADD.';}
    else if(!D&&A){ if(O){v.textContent='⚠ actuator-only effect!';v.className='v bad';exp.textContent='No DREADD, yet the actuator acts (CNO→clozapine). Without this control you would credit your neurons wrongly.';}
      else{v.textContent='✓ actuator control — silent';v.className='v good';exp.textContent='No DREADD, actuator on, no effect — the actuator is clean at this dose.';} }
    else{v.textContent='baseline';v.className='v off';exp.textContent='No DREADD, no drug. The reference for everything else.';}
  }
  render();
})();
</script>
</body></html>
