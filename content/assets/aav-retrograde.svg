<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 360" role="img" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>Retrograde AAV access to DRG neurons</title>
  <desc>A retrograde AAV injected in the pancreas is taken up at nerve terminals and carried up the axon, past the fork, to the DRG cell body, which then expresses the payload; a central branch runs on into the spinal cord.</desc>
  <style>
    svg{--text:#22221f;--muted:#5f5e5a;--line-strong:#b4b2a9;--surface:#ffffff;--surface-2:#efede6;--track:#5B8DEF;}
    @media (prefers-color-scheme:dark){svg{--text:#f1efe8;--muted:#b4b2a9;--line-strong:#5f5e5a;--surface:#22221f;--surface-2:#2c2c2a;--track:#7ea6f5;}}
    text{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,sans-serif;fill:var(--text);}
    .lbl{font-size:15px;font-weight:600;} .small{font-size:14px;font-weight:400;fill:var(--muted);}
    .branch{fill:none;stroke:var(--line-strong);stroke-width:2.5;stroke-linecap:round;}
    .tissue{fill:#e8b4b0;opacity:.5;stroke:var(--line-strong);stroke-width:2;}
    .cord{fill:var(--surface-2);stroke:var(--line-strong);stroke-width:2;}
    .soma{fill:var(--surface-2);stroke:var(--track);stroke-width:2.5;}
    .somaOn{fill:var(--track);opacity:0;animation:on 6s ease-in-out infinite;}
    .expr{opacity:0;animation:txt 6s ease-in-out infinite;}
    .cap{fill:var(--track);stroke:var(--surface);stroke-width:1.5;}
    /* terminal (180,300) → up the axon → fork (150,150) → stem → soma (116,150) */
    .v{offset-path:path("M180 300 L150 150 L116 150");offset-rotate:0deg;opacity:0;animation:ride 6s ease-in-out infinite;}
    .v2{animation-delay:.5s;} .v3{animation-delay:1s;}
    @keyframes ride{0%,6%{offset-distance:0%;opacity:0}12%{offset-distance:0%;opacity:1}56%{offset-distance:100%;opacity:1}64%,100%{offset-distance:100%;opacity:0}}
    @keyframes on{0%,60%{opacity:0}74%,100%{opacity:.9}}
    @keyframes txt{0%,62%{opacity:0}76%,100%{opacity:1}}
    @media (prefers-reduced-motion:reduce){.v{animation:none;opacity:0}.somaOn{animation:none;opacity:.9}.expr{animation:none;opacity:1}}
  </style>

  <!-- spinal cord at top -->
  <rect class="cord" x="120" y="30" width="120" height="44" rx="14"/>
  <text class="small" x="180" y="57" text-anchor="middle">spinal cord</text>

  <!-- central branch soma->cord, stem, peripheral axon down to pancreas -->
  <path class="branch" d="M132 150 L150 150"/>
  <path class="branch" d="M150 150 L150 74"/>
  <path class="branch" d="M150 150 L180 300"/>

  <!-- DRG soma off to the side -->
  <circle class="soma" cx="116" cy="150" r="16"/>
  <circle class="somaOn" cx="116" cy="150" r="16"/>
  <text class="lbl" x="116" y="118" text-anchor="middle">DRG cell body</text>
  <text class="small expr" x="116" y="190" text-anchor="middle">expresses payload</text>

  <!-- pancreas tissue bottom + terminals -->
  <ellipse class="tissue" cx="190" cy="324" rx="64" ry="28"/>
  <path class="branch" d="M180 300 q-12 8 -20 15 M180 300 q12 8 20 15 M180 300 q0 10 0 18" stroke-width="2"/>
  <text class="lbl" x="190" y="342" text-anchor="middle">pancreas</text>
  <text class="lbl" x="160" y="280" text-anchor="end">inject AAV2-retro</text>

  <!-- retrograde transport label -->
  <text class="small" x="186" y="222" text-anchor="start">retrograde</text>
  <text class="small" x="186" y="240" text-anchor="start">transport ↑</text>

  <!-- virus particles riding the axon to the soma -->
  <polygon class="cap v" points="0,-8 7,-4 7,4 0,8 -7,4 -7,-4"/>
  <polygon class="cap v v2" points="0,-8 7,-4 7,4 0,8 -7,4 -7,-4"/>
  <polygon class="cap v v3" points="0,-8 7,-4 7,4 0,8 -7,4 -7,-4"/>
</svg>
