<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 360" role="img" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>Retrograde AAV access to DRG neurons</title>
  <desc>A retrograde AAV injected in the pancreas is taken up at nerve terminals and carried up the axon to the DRG cell body, which then expresses the payload; a central branch runs on into the spinal cord.</desc>
  <style>
    svg{--text:#22221f;--muted:#5f5e5a;--line-strong:#b4b2a9;--surface:#ffffff;--surface-2:#efede6;--track:#5B8DEF;}
    @media (prefers-color-scheme:dark){svg{--text:#f1efe8;--muted:#b4b2a9;--line-strong:#5f5e5a;--surface:#22221f;--surface-2:#2c2c2a;--track:#7ea6f5;}}
    text{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,sans-serif;fill:var(--text);}
    .lbl{font-size:15px;font-weight:600;} .small{font-size:13px;font-weight:400;fill:var(--muted);}
    .branch{fill:none;stroke:var(--line-strong);stroke-width:2.5;stroke-linecap:round;}
    .tissue{fill:#e8b4b0;opacity:.5;stroke:var(--line-strong);stroke-width:2;}
    .cord{fill:var(--surface-2);stroke:var(--line-strong);stroke-width:2;}
    .soma{fill:var(--surface-2);stroke:var(--track);stroke-width:2.5;}
    .somaOn{fill:var(--track);opacity:0;animation:on 6s ease-in-out infinite;}
    .cap{fill:var(--track);stroke:#1a4fa0;stroke-width:1;}
    .v1{animation:rise 6s ease-in-out infinite;}
    .v2{animation:rise 6s ease-in-out infinite;animation-delay:1.3s;}
    .v3{animation:rise 6s ease-in-out infinite;animation-delay:2.6s;}
    @keyframes rise{0%{transform:translateY(0);opacity:0}8%{opacity:1}60%{transform:translateY(-150px);opacity:1}70%,100%{transform:translateY(-150px);opacity:0}}
    @keyframes on{0%,62%{opacity:0}76%{opacity:.9}100%{opacity:.85}}
    @media (prefers-reduced-motion:reduce){.v1,.v2,.v3{animation:none;opacity:0}.somaOn{animation:none;opacity:.85}}
  </style>

  <!-- spinal cord at top -->
  <rect class="cord" x="120" y="30" width="120" height="44" rx="14"/>
  <text class="small" x="180" y="57" text-anchor="middle">spinal cord</text>

  <!-- central branch soma->cord, stem, peripheral axon down to pancreas -->
  <path class="branch" d="M132 150 L150 150"/>
  <path class="branch" d="M150 150 L150 74"/>
  <path class="branch" d="M150 150 L180 300"/>

  <!-- DRG soma off to the side -->
  <circle class="soma" cx="116" cy="150" r="16"/>
  <circle class="somaOn" cx="116" cy="150" r="16"/>
  <text class="lbl" x="116" y="118" text-anchor="middle">DRG cell body</text>
  <text class="small" x="116" y="196" text-anchor="middle">· expresses</text>

  <!-- pancreas tissue bottom + terminals -->
  <ellipse class="tissue" cx="190" cy="322" rx="58" ry="26"/>
  <path class="branch" d="M180 300 q-12 8 -20 15 M180 300 q12 8 20 15 M180 300 q0 10 0 18" stroke-width="2"/>
  <text class="lbl" x="190" y="292" text-anchor="middle">inject AAV2-retro</text>

  <!-- retrograde transport label -->
  <text class="small" x="196" y="230" text-anchor="start">retrograde</text>
  <text class="small" x="196" y="246" text-anchor="start">transport ↑</text>

  <!-- virus particles travelling up the peripheral axon (start near terminal y=300) -->
  <g class="v1"><polygon class="cap" points="168,300 175,296 175,304 168,308 161,304 161,296"/></g>
  <g class="v2"><polygon class="cap" points="166,300 173,296 173,304 166,308 159,304 159,296"/></g>
  <g class="v3"><polygon class="cap" points="170,300 177,296 177,304 170,308 163,304 163,296"/></g>
</svg>
