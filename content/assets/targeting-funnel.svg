<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 360" role="img"
     aria-label="Three filters narrow a mixed population of cells to the single target: retrograde route, then Cre-dependent switch, then a subtype Cre line." xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs><linearGradient id="tg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#34d17f"/><stop offset="1" stop-color="#1f9d61"/></linearGradient></defs>
  <style>
    .bg{fill:#f5f7fb}.ink{fill:#131722}.muted{fill:#5b6472}
    .bar{fill:#dfe5f0;stroke:#9aa4b5}.dot{fill:#c9d0dc}.target{fill:url(#tg)}
    .label{font:600 15px -apple-system,sans-serif}.sub{font:400 12px -apple-system,sans-serif}.tag{font:700 13px -apple-system,sans-serif}
    @media (prefers-color-scheme:dark){.bg{fill:#0f1420}.ink{fill:#eef1f7}.muted{fill:#9aa4b5}.bar{fill:#1e2740;stroke:#3a4356}.dot{fill:#2b3346}}
    /* each tier of dots fades out in sequence; target survives */
    .t1{animation:f1 5s ease-in-out infinite}@keyframes f1{0%,20%{opacity:1}30%{opacity:.12}100%{opacity:.12}}
    .t2{animation:f2 5s ease-in-out infinite}@keyframes f2{0%,45%{opacity:1}55%{opacity:.12}100%{opacity:.12}}
    .t3{animation:f3 5s ease-in-out infinite}@keyframes f3{0%,70%{opacity:1}80%{opacity:.12}100%{opacity:.12}}
    .win{animation:w 5s ease-in-out infinite}@keyframes w{0%,80%{opacity:0;transform:scale(.6)}90%{opacity:1;transform:scale(1)}100%{opacity:1}}
  </style>
  <rect class="bg" x="0" y="0" width="820" height="360" rx="18"/>
  <text class="label ink" x="410" y="34" text-anchor="middle">Each layer of specificity removes off-target cells</text>

  <!-- mixed population at top -->
  <g>
    <circle class="target" cx="410" cy="70" r="12"/>
    <circle class="dot t1" cx="360" cy="70" r="11"/><circle class="dot t1" cx="310" cy="70" r="11"/>
    <circle class="dot t2" cx="460" cy="70" r="11"/><circle class="dot t2" cx="510" cy="70" r="11"/>
    <circle class="dot t3" cx="260" cy="70" r="11"/><circle class="dot t3" cx="560" cy="70" r="11"/>
  </g>

  <!-- filter 1 -->
  <rect class="bar" x="150" y="110" width="520" height="40" rx="10"/>
  <text class="tag ink" x="410" y="135" text-anchor="middle">1 · Retrograde route → only pancreas-projecting</text>
  <!-- filter 2 -->
  <rect class="bar" x="150" y="180" width="520" height="40" rx="10"/>
  <text class="tag ink" x="410" y="205" text-anchor="middle">2 · DIO switch → only Cre+ cells</text>
  <!-- filter 3 -->
  <rect class="bar" x="150" y="250" width="520" height="40" rx="10"/>
  <text class="tag ink" x="410" y="275" text-anchor="middle">3 · Subtype Cre line → only your neuron type</text>

  <!-- target emerges -->
  <g class="win" transform="translate(410,320)" style="transform-origin:410px 320px">
    <circle class="target" cx="0" cy="0" r="15"/>
    <text class="tag" x="0" y="5" text-anchor="middle" fill="#fff">✓</text>
    <text class="sub ink" x="0" y="34" text-anchor="middle">your target neuron</text>
  </g>
</svg>
