<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 300" role="img" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>Microglia prune complement-tagged synapses</title>
  <desc>Two synapses sit on a neuron. The weaker, less-active one is tagged with complement protein; a microglial cell extends a process, engulfs the tagged synapse, and it disappears, while the active untagged synapse remains.</desc>
  <style>
    svg{--text:#22221f;--muted:#5f5e5a;--line:#dcdad1;--line-strong:#b4b2a9;--surface:#ffffff;--surface-2:#efede6;--warn:#ba7517;--ok:#0f6e56;--track:#D4537E;}
    @media (prefers-color-scheme:dark){svg{--text:#f1efe8;--muted:#b4b2a9;--line:#3a3a37;--line-strong:#5f5e5a;--surface:#22221f;--surface-2:#2c2c2a;--warn:#ef9f27;--ok:#5dcaa5;--track:#e67ba0;}}
    text{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,sans-serif;fill:var(--text);}
    .lbl{font-size:14px;font-weight:600;} .small{font-size:12px;font-weight:400;fill:var(--muted);}
    .neuron{fill:var(--surface-2);stroke:var(--line-strong);stroke-width:2.5;}
    .den{fill:none;stroke:var(--line-strong);stroke-width:2.5;stroke-linecap:round;}
    .syn{fill:var(--ok);}
    .synW{fill:var(--surface-2);stroke:var(--line-strong);stroke-width:2;}
    .tag{fill:var(--warn);opacity:0;animation:tag 7s ease-in-out infinite;}
    .micro{fill:var(--track);opacity:.9;}
    .arm{fill:none;stroke:var(--track);stroke-width:5;stroke-linecap:round;stroke-dasharray:120;stroke-dashoffset:120;animation:reach 7s ease-in-out infinite;}
    .weak{animation:eaten 7s ease-in-out infinite;}
    @keyframes tag{0%,16%{opacity:0}26%,60%{opacity:1}70%,100%{opacity:0}}
    @keyframes reach{0%,24%{stroke-dashoffset:120}44%{stroke-dashoffset:0}64%{stroke-dashoffset:0}80%,100%{stroke-dashoffset:120}}
    @keyframes eaten{0%,50%{opacity:1;transform:scale(1)}66%,100%{opacity:0;transform:scale(.2)}}
    @media (prefers-reduced-motion:reduce){.tag{animation:none;opacity:0}.arm{animation:none;stroke-dashoffset:120}.weak{animation:none;opacity:0}}
  </style>

  <!-- postsynaptic neuron with two dendrites -->
  <circle class="neuron" cx="80" cy="150" r="30"/>
  <text class="lbl" x="80" y="155" text-anchor="middle">neuron</text>
  <path class="den" d="M104 134 C150 96 180 84 214 76"/>
  <path class="den" d="M104 166 C150 204 180 216 214 224"/>

  <!-- active synapse (kept) -->
  <circle class="syn" cx="224" cy="74" r="13"/>
  <text class="small" x="244" y="70">active</text>
  <text class="small" x="244" y="86">synapse · kept</text>

  <!-- weak synapse (tagged, then engulfed) -->
  <g class="weak" style="transform-origin:224px 226px">
    <circle class="synW" cx="224" cy="226" r="13"/>
  </g>
  <circle class="tag" cx="234" cy="216" r="6"/>
  <circle class="tag" cx="214" cy="236" r="6"/>
  <circle class="tag" cx="236" cy="236" r="6"/>
  <text class="small" x="238" y="204">weak synapse</text>
  <text class="small" x="238" y="220" style="fill:var(--warn)">complement tag</text>

  <!-- microglion reaching from bottom right -->
  <path class="arm" d="M300 244 C280 240 250 236 234 230"/>
  <g class="micro">
    <circle cx="318" cy="250" r="19"/>
    <path d="M318 250 L303 239 M318 250 L335 237 M318 250 L305 265 M318 250 L337 262 M318 250 L320 229" stroke="var(--track)" stroke-width="3" stroke-linecap="round"/>
  </g>
  <text class="lbl" x="318" y="285" text-anchor="middle">microglion</text>
</svg>
