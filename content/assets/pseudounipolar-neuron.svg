<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 360" role="img">
  <title>Pseudounipolar DRG neuron</title>
  <desc>A pseudounipolar DRG sensory neuron: the cell body sits off to the side in the ganglion on a short stem that forks into a peripheral branch to an organ (colon or pancreas) and a central branch into the spinal cord dorsal horn. The endings in the organ light up, a signal travels up the peripheral branch, passes straight through the fork into the central branch and reaches the dorsal horn, while the cell body stays off to the side.</desc>
  <style>
    svg{--text:#22221f;--muted:#5f5e5a;--line:#dcdad1;--line-strong:#b4b2a9;--surface:#ffffff;--surface-2:#efede6;--ok:#0f6e56;--bad:#993c1d;--warn:#ba7517;--track:#7F77DD;}
    @media (prefers-color-scheme:dark){svg{--text:#f1efe8;--muted:#b4b2a9;--line:#3a3a37;--line-strong:#5f5e5a;--surface:#22221f;--surface-2:#2c2c2a;--ok:#5dcaa5;--bad:#f0997b;--warn:#ef9f27;--track:#a39df0;}}
    svg{--tissue:color-mix(in srgb,#e8b4b0 30%,var(--surface-2));--tissue-lo:color-mix(in srgb,#e8b4b0 16%,var(--surface-2));--tissue-hi:color-mix(in srgb,#e8b4b0 50%,var(--surface-2));--muscle:color-mix(in srgb,#e8b4b0 62%,var(--surface-2));--muscle-line:color-mix(in srgb,#e8b4b0 45%,var(--line-strong));--track-1:color-mix(in srgb,var(--track) 22%,var(--surface));--track-2:color-mix(in srgb,var(--track) 55%,var(--surface));--warn-1:color-mix(in srgb,var(--warn) 24%,var(--surface));--muted-1:color-mix(in srgb,var(--muted) 22%,var(--surface));--nuc:color-mix(in srgb,var(--muted) 55%,var(--surface-2));}
    text{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,sans-serif;fill:var(--text);}
    .lbl{font-size:15px;font-weight:600;}
    .key{font-size:16px;font-weight:700;}
    .cord{fill:var(--tissue-lo);stroke:var(--line-strong);stroke-width:2;}
    .gmo{fill:none;stroke:var(--line-strong);stroke-width:4;}
    .gm{fill:color-mix(in srgb,#e8b4b0 40%,var(--surface-2));}
    .dhOn{fill:var(--track);opacity:0;animation:dh 8s ease-in-out infinite;}
    .drg{fill:var(--tissue);stroke:var(--line-strong);stroke-width:2;}
    .nb{fill:var(--surface-2);stroke:var(--line-strong);stroke-width:1.5;}
    .nbn{fill:var(--nuc);}
    .organ{fill:var(--tissue);stroke:var(--line-strong);stroke-width:2;}
    .ocell{fill:var(--tissue-hi);stroke:var(--line-strong);stroke-width:1.5;}
    .ax{fill:none;stroke:var(--track-2);stroke-width:3.5;stroke-linecap:round;stroke-linejoin:round;}
    .tw{fill:none;stroke:var(--track-2);stroke-width:2;stroke-linecap:round;}
    .bt{fill:var(--track-2);}
    .soma{fill:var(--track-1);stroke:var(--track);stroke-width:2;}
    .somaN{fill:var(--track-2);stroke:var(--track);stroke-width:1.5;}
    .somaOn{fill:var(--track);opacity:0;animation:soma 8s ease-in-out infinite;}
    .glow{fill:none;stroke:var(--track);stroke-width:10;stroke-linecap:round;opacity:.22;}
    .lit{fill:none;stroke:var(--track);stroke-width:3.5;stroke-linecap:round;}
    .trace{stroke-dasharray:100 100;stroke-dashoffset:100;animation:trace 8s ease-in-out infinite;}
    .endOn{fill:none;stroke:var(--track);stroke-width:2.5;stroke-linecap:round;opacity:0;animation:ends 8s ease-in-out infinite;}
    .termOn{opacity:0;animation:term 8s ease-in-out infinite;}
    .termOn path{fill:none;stroke:var(--track);stroke-width:2.5;stroke-linecap:round;}
    .termOn circle{fill:var(--track);}
    .sig{fill:var(--track);stroke:var(--surface);stroke-width:2.5;opacity:0;offset-path:path("M242 300 L242 88");offset-rotate:0deg;animation:sig 8s ease-in-out infinite;}
    @keyframes ends{0%,10%{opacity:0}18%{opacity:1}94%{opacity:1}100%{opacity:0}}
    @keyframes sig{0%,15%{opacity:0;offset-distance:0%}18%{opacity:1;offset-distance:0%}38%{offset-distance:51%}56%{opacity:1;offset-distance:100%}62%,100%{opacity:0;offset-distance:100%}}
    @keyframes trace{0%,18%{stroke-dashoffset:100;opacity:1}38%{stroke-dashoffset:49}56%{stroke-dashoffset:0}94%{stroke-dashoffset:0;opacity:1}100%{stroke-dashoffset:0;opacity:0}}
    @keyframes soma{0%,37%{opacity:0}46%{opacity:.5}58%{opacity:.25}94%{opacity:.25}100%{opacity:0}}
    @keyframes term{0%,55%{opacity:0}66%{opacity:1}94%{opacity:1}100%{opacity:0}}
    @keyframes dh{0%,55%{opacity:0}70%{opacity:.3}94%{opacity:.3}100%{opacity:0}}
    @media (prefers-reduced-motion:reduce){
      .sig{animation:none;opacity:0}
      .trace{animation:none;stroke-dashoffset:0}
      .endOn,.termOn{animation:none;opacity:1}
      .somaOn{animation:none;opacity:.25}
      .dhOn{animation:none;opacity:.3}
    }
  </style>
