<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 210" role="img" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>Cre recombinase cutting at loxP</title>
  <desc>A gene: promoter, loxP, STOP, loxP, payload. Cre cuts at the two loxP sites; the STOP cassette leaves together with one loxP, a single loxP remains, and the payload joins up and switches on.</desc>
  <style>
    svg{--text:#22221f;--muted:#5f5e5a;--line:#dcdad1;--line-strong:#b4b2a9;--surface:#ffffff;--surface-2:#efede6;--bad:#993c1d;--warn:#ba7517;--track:#5B8DEF;}
    @media (prefers-color-scheme:dark){svg{--text:#f1efe8;--muted:#b4b2a9;--line:#3a3a37;--line-strong:#5f5e5a;--surface:#22221f;--surface-2:#2c2c2a;--bad:#f0997b;--warn:#ef9f27;--track:#7ea6f5;}}
    text{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,sans-serif;fill:var(--text);}
    .lbl{font-size:14px;font-weight:600;}
    .blk{font-size:14px;font-weight:600;fill:#ffffff;}
    .dna{stroke:var(--line-strong);stroke-width:2.5;}
    .seg{fill:var(--surface-2);stroke:var(--line-strong);stroke-width:2;}
    .lox{fill:var(--warn);}
    .stop{fill:var(--bad);animation:drop 6s ease-in-out infinite;}
    .lox2{animation:drop 6s ease-in-out infinite;}
    .pay{animation:slide 6s ease-in-out infinite;}
    .payOn{fill:var(--track);opacity:0;animation:on 6s ease-in-out infinite;}
    .cre{opacity:0;animation:cre 6s ease-in-out infinite;}
    .badge{opacity:0;animation:badge 6s ease-in-out infinite;}
    @keyframes drop{0%,22%{opacity:1;transform:translateY(0)}38%{opacity:0;transform:translateY(26px)}100%{opacity:0;transform:translateY(26px)}}
    @keyframes cre{0%,10%{opacity:0;transform:translateY(-10px)}22%{opacity:1;transform:translateY(0)}40%{opacity:1}52%,100%{opacity:0}}
    @keyframes slide{0%,38%{transform:translateX(0)}50%,100%{transform:translateX(-96px)}}
    @keyframes on{0%,44%{opacity:0}60%{opacity:1}100%{opacity:1}}
    @keyframes badge{0%,50%{opacity:0;transform:scale(.6)}64%{opacity:1;transform:scale(1)}100%{opacity:1}}
    @media (prefers-reduced-motion:reduce){
      .stop,.lox2{animation:none;opacity:0}
      .pay{animation:none;transform:translateX(-96px)}
      .cre{animation:none;opacity:0}
      .payOn{animation:none;opacity:1}
      .badge{animation:none;opacity:1;transform:scale(1)}
    }
  </style>

  <!-- DNA backbone -->
  <line class="dna" x1="14" y1="130" x2="346" y2="130"/>

  <!-- promoter -->
  <rect class="seg" x="14" y="112" width="84" height="36" rx="7"/>
  <text class="lbl" x="56" y="135" text-anchor="middle">promoter</text>

  <!-- loxP triangles -->
  <path class="lox" d="M106 112 L124 130 L106 148 Z"/>
  <text class="lbl" x="115" y="104" text-anchor="middle" style="fill:var(--warn)">loxP</text>
  <g class="lox2">
    <path class="lox" d="M202 112 L220 130 L202 148 Z"/>
    <text class="lbl" x="211" y="104" text-anchor="middle" style="fill:var(--warn)">loxP</text>
  </g>

  <!-- STOP cassette (removed) -->
  <g class="stop"><rect x="128" y="112" width="70" height="36" rx="7"/><text class="blk" x="163" y="135" text-anchor="middle">STOP</text></g>

  <!-- payload: slides up to the remaining loxP, then turns on -->
  <g class="pay">
    <rect class="seg" x="228" y="112" width="92" height="36" rx="7"/>
    <rect class="payOn" x="228" y="112" width="92" height="36" rx="7"/>
    <text class="lbl" x="274" y="135" text-anchor="middle">payload</text>
  </g>

  <!-- Cre scissors -->
  <g transform="translate(163,78)"><g class="cre">
    <text class="lbl" x="0" y="-14" text-anchor="middle">Cre</text>
    <circle cx="-8" cy="6" r="6" fill="none" stroke="var(--text)" stroke-width="2.5"/>
    <circle cx="8" cy="6" r="6" fill="none" stroke="var(--text)" stroke-width="2.5"/>
    <line x1="-5" y1="9" x2="12" y2="26" stroke="var(--text)" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="5" y1="9" x2="-12" y2="26" stroke="var(--text)" stroke-width="2.5" stroke-linecap="round"/>
  </g></g>

  <!-- ON badge -->
  <g transform="translate(178,176)"><g class="badge" style="transform-origin:0 0">
    <rect x="-22" y="-14" width="44" height="26" rx="13" fill="var(--track)"/>
    <text class="blk" x="0" y="4" text-anchor="middle">ON</text>
  </g></g>
</svg>
