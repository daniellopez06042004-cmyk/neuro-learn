<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 320" role="img" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>The action potential</title>
  <desc>A voltage-versus-time trace: the membrane rests near −70 mV, a stimulus brings it to the −55 mV threshold, then sodium flows in and the voltage shoots up to about +30 mV (depolarization); potassium flows out and it falls back down past rest (repolarization and a brief undershoot) before returning to rest.</desc>
  <style>
    svg{--text:#22221f;--muted:#5f5e5a;--line:#dcdad1;--line-strong:#b4b2a9;--surface:#ffffff;--surface-2:#efede6;--warn:#ba7517;--track:#1D9E75;}
    @media (prefers-color-scheme:dark){svg{--text:#f1efe8;--muted:#b4b2a9;--line:#3a3a37;--line-strong:#5f5e5a;--surface:#22221f;--surface-2:#2c2c2a;--warn:#ef9f27;--track:#32c48f;}}
    text{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,sans-serif;fill:var(--text);}
    .lbl{font-size:14px;font-weight:600;} .small{font-size:12px;font-weight:400;fill:var(--muted);}
    .axis{stroke:var(--line-strong);stroke-width:1.5;}
    .grid{stroke:var(--line);stroke-width:1;stroke-dasharray:3 4;}
    .thr{stroke:var(--warn);stroke-width:1.5;stroke-dasharray:5 4;}
    .trace{fill:none;stroke:var(--track);stroke-width:3;stroke-linecap:round;stroke-linejoin:round;
           stroke-dasharray:520;stroke-dashoffset:520;animation:draw 6s ease-in-out infinite;}
    .ion{font-size:14px;font-weight:700;opacity:0;}
    .na{fill:var(--track);animation:na 6s ease-in-out infinite;}
    .k{fill:var(--warn);animation:k 6s ease-in-out infinite;}
    @keyframes draw{0%,8%{stroke-dashoffset:520}70%,100%{stroke-dashoffset:0}}
    @keyframes na{0%,24%{opacity:0}32%,44%{opacity:1}52%,100%{opacity:0}}
    @keyframes k{0%,44%{opacity:0}52%,64%{opacity:1}74%,100%{opacity:0}}
    @media (prefers-reduced-motion:reduce){.trace{animation:none;stroke-dashoffset:0}.na,.k{animation:none;opacity:0}}
  </style>

  <!-- y gridlines at key voltages -->
  <line class="grid" x1="48" y1="67" x2="340" y2="67"/>
  <line class="thr"  x1="48" y1="208" x2="340" y2="208"/>
  <line class="grid" x1="48" y1="233" x2="340" y2="233"/>

  <!-- axes -->
  <line class="axis" x1="48" y1="40" x2="48" y2="262"/>
  <line class="axis" x1="48" y1="262" x2="344" y2="262"/>

  <!-- voltage labels -->
  <text class="small" x="44" y="71" text-anchor="end">+30</text>
  <text class="small" x="44" y="212" text-anchor="end">−55</text>
  <text class="small" x="44" y="237" text-anchor="end">−70</text>
  <text class="small" x="10" y="155" transform="rotate(-90 10 155)" text-anchor="middle">membrane mV</text>
  <text class="lbl"  x="54" y="202" style="fill:var(--warn)">threshold</text>

  <!-- the action potential trace -->
  <path class="trace" d="M52 233 L120 233 L140 208 L165 67 L200 250 L230 240 L250 233 L340 233"/>

  <!-- ion annotations that appear with the right phase -->
  <text class="ion na" x="150" y="150" text-anchor="middle">Na⁺ in ↑</text>
  <text class="ion k"  x="214" y="150" text-anchor="middle">K⁺ out ↓</text>

  <text class="small" x="70" y="256">rest</text>
  <text class="small" x="344" y="256" text-anchor="end">time</text>
</svg>
