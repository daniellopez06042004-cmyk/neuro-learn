<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 330" role="img" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>DREADD control grid</title>
  <desc>A two-by-two grid of DREADD present or absent against actuator or vehicle. Only the DREADD-plus-actuator cell responds; the three controls show no response.</desc>
  <style>
    svg{--text:#22221f;--muted:#5f5e5a;--line:#dcdad1;--line-strong:#b4b2a9;--surface-2:#efede6;--ok:#0f6e56;--warn:#ba7517;--track:#5B8DEF;}
    @media (prefers-color-scheme:dark){svg{--text:#f1efe8;--muted:#b4b2a9;--line:#3a3a37;--line-strong:#5f5e5a;--surface-2:#2c2c2a;--ok:#5dcaa5;--warn:#ef9f27;--track:#7ea6f5;}}
    text{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,sans-serif;fill:var(--text);}
    .hd{font-size:14px;font-weight:600;} .st{font-size:14px;font-weight:600;}
    .cell{fill:none;stroke:var(--line);stroke-width:1.5;}
    .den{fill:none;stroke:var(--line-strong);stroke-width:2;stroke-linecap:round;}
    .soma{fill:var(--surface-2);stroke:var(--line-strong);stroke-width:2;}
    .somaOn{fill:var(--track);stroke:var(--track);stroke-width:2;}
    .drug{fill:var(--warn);animation:drop 4.5s ease-in-out infinite;}
    .resp{animation:resp 4.5s ease-in-out infinite;transform-origin:120px 150px;}
    @keyframes drop{0%{opacity:0;transform:translateY(-10px)}16%{opacity:1;transform:translateY(0)}36%{opacity:1}46%,100%{opacity:0}}
    @keyframes resp{0%,40%{transform:scale(1)}52%{transform:scale(1.1)}64%,100%{transform:scale(1)}}
    @media (prefers-reduced-motion:reduce){.drug{animation:none;opacity:0}.resp{animation:none}}
  </style>

  <!-- column headers -->
  <text class="hd" x="120" y="30" text-anchor="middle">actuator</text>
  <text class="hd" x="266" y="30" text-anchor="middle">vehicle</text>
  <!-- row labels (rotated) -->
  <text class="hd" x="16" y="150" text-anchor="middle" transform="rotate(-90 16 150)">DREADD +</text>
  <text class="hd" x="16" y="262" text-anchor="middle" transform="rotate(-90 16 262)">DREADD −</text>

  <!-- cells -->
  <rect class="cell" x="54" y="46" width="132" height="104" rx="10"/>
  <rect class="cell" x="200" y="46" width="132" height="104" rx="10"/>
  <rect class="cell" x="54" y="158" width="132" height="104" rx="10"/>
  <rect class="cell" x="200" y="158" width="132" height="104" rx="10"/>

  <!-- TL: responds -->
  <g class="resp"><g transform="translate(120,92)"><g class="den"><path d="M-4,-7 C -11,-16 -16,-19 -22,-24"/><path d="M4,-7 C 11,-16 16,-19 22,-24"/><path d="M-8,-2 C -19,-6 -25,-6 -32,-5"/></g><circle class="somaOn" r="11"/></g></g>
  <text class="st" x="120" y="132" text-anchor="middle" style="fill:var(--ok)">✓ responds</text>

  <!-- TR -->
  <g transform="translate(266,92)"><g class="den"><path d="M-4,-7 C -11,-16 -16,-19 -22,-24"/><path d="M4,-7 C 11,-16 16,-19 22,-24"/><path d="M-8,-2 C -19,-6 -25,-6 -32,-5"/></g><circle class="soma" r="11"/></g>
  <text class="st" x="266" y="132" text-anchor="middle" style="fill:var(--muted)">no response</text>

  <!-- BL -->
  <g transform="translate(120,204)"><g class="den"><path d="M-4,-7 C -11,-16 -16,-19 -22,-24"/><path d="M4,-7 C 11,-16 16,-19 22,-24"/><path d="M-8,-2 C -19,-6 -25,-6 -32,-5"/></g><circle class="soma" r="11"/></g>
  <text class="st" x="120" y="244" text-anchor="middle" style="fill:var(--muted)">no response</text>

  <!-- BR -->
  <g transform="translate(266,204)"><g class="den"><path d="M-4,-7 C -11,-16 -16,-19 -22,-24"/><path d="M4,-7 C 11,-16 16,-19 22,-24"/><path d="M-8,-2 C -19,-6 -25,-6 -32,-5"/></g><circle class="soma" r="11"/></g>
  <text class="st" x="266" y="244" text-anchor="middle" style="fill:var(--muted)">no response</text>

  <!-- actuator droplet on the DREADD+/actuator cell -->
  <polygon class="drug" points="120,62 126,67 126,74 120,79 114,74 114,67"/>

  <text class="st" x="180" y="296" text-anchor="middle" style="fill:var(--muted)">only DREADD + actuator responds</text>
</svg>
