<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 334" role="img">
  <title>Two-point discrimination: fingertip vs back</title>
  <desc>Two patches of skin drawn at the same scale and tiled with receptive fields. The fingertip is covered by many small receptive fields; the back by a few large ones. A two-point caliper with the same gap touches each. On the fingertip its two tips land in two different fields with an untouched field between them, so the touch is felt as two points. On the back both tips land inside one large field, so the touch is felt as one.</desc>
  <style>
    svg{--text:#22221f;--muted:#5f5e5a;--line:#dcdad1;--line-strong:#b4b2a9;--surface:#ffffff;--surface-2:#efede6;--ok:#0f6e56;--bad:#993c1d;--warn:#ba7517;--track:#7F77DD;}
    @media (prefers-color-scheme:dark){svg{--text:#f1efe8;--muted:#b4b2a9;--line:#3a3a37;--line-strong:#5f5e5a;--surface:#22221f;--surface-2:#2c2c2a;--ok:#5dcaa5;--bad:#f0997b;--warn:#ef9f27;--track:#a39df0;}}
    svg{--tissue:color-mix(in srgb,#e8b4b0 30%,var(--surface-2));--track-1:color-mix(in srgb,var(--track) 22%,var(--surface));--track-2:color-mix(in srgb,var(--track) 55%,var(--surface));}
    text{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,sans-serif;font-size:15px;font-weight:600;fill:var(--text);}
    .ttl{font-size:16px;font-weight:700;}
    .skin{fill:var(--tissue);}
    .edge{fill:none;stroke:var(--line-strong);stroke-width:2;}
    .rf{fill:var(--track);fill-opacity:.12;stroke:var(--track-2);stroke-width:1.75;}
    .hit{fill:var(--track);fill-opacity:.55;stroke:var(--track);stroke-width:2.5;}
    .leg{fill:none;stroke:var(--muted);stroke-width:3.5;stroke-linecap:round;}
    .hinge{fill:var(--surface-2);stroke:var(--muted);stroke-width:2.5;}
    .tip{fill:var(--text);stroke:var(--surface);stroke-width:2;}
    .dot{fill:var(--text);}
    .pill{fill:var(--surface);opacity:.88;}
  </style>
  <defs>
    <clipPath id="fc"><path d="M22 292 V118 C22 76 52 54 92 54 C132 54 162 76 162 118 V292 Z"/></clipPath>
    <clipPath id="bc"><path d="M214 54 H326 Q344 54 344 72 V274 Q344 292 326 292 H214 Q196 292 196 274 V72 Q196 54 214 54 Z"/></clipPath>
  </defs>

  <text class="ttl" x="92" y="24" text-anchor="middle">fingertip</text>
  <text class="ttl" x="270" y="24" text-anchor="middle">back</text>

  <!-- fingertip: many small receptive fields -->
