<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 270" role="img" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>Layers of the gut wall</title>
  <desc>Cross-section of the gut wall from the lumen outward: mucosa with villi and lamina propria, submucosa containing the submucosal plexus, circular muscle, the myenteric plexus, longitudinal muscle, and the serosa.</desc>
  <style>
    svg{--text:#22221f;--muted:#5f5e5a;--line:#dcdad1;--line-strong:#b4b2a9;--surface:#ffffff;--surface-2:#efede6;--warn:#ba7517;--bad:#993c1d;--track:#7F77DD;}
    @media (prefers-color-scheme:dark){svg{--text:#f1efe8;--muted:#b4b2a9;--line:#3a3a37;--line-strong:#5f5e5a;--surface:#22221f;--surface-2:#2c2c2a;--warn:#ef9f27;--bad:#f0997b;--track:#9a93e8;}}
    text{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,sans-serif;fill:var(--text);}
    .lbl{font-size:15px;font-weight:600;} .small{font-size:14px;font-weight:400;fill:var(--muted);}
    .lead{stroke:var(--line-strong);stroke-width:1;}
    .muc{fill:#e8b4b0;opacity:.55;} .vil path{fill:#e8b4b0;opacity:.55;stroke:var(--line-strong);stroke-width:1.2;}
    .sub{fill:var(--surface-2);stroke:var(--line-strong);stroke-width:1;}
    .musC{fill:#d9a39b;opacity:.55;stroke:var(--line-strong);stroke-width:.8;}
    .musLbg{fill:#d9a39b;opacity:.35;} .musL{stroke:var(--line-strong);stroke-width:1.2;}
    .ser{fill:var(--surface);stroke:var(--line-strong);stroke-width:1.5;}
    .gang{fill:var(--track);} .fib{stroke:var(--track);stroke-width:2;}
  </style>
  <text class="small" x="106" y="24" text-anchor="middle">lumen</text>
  <g class="vil"><path d="M22 70 L22 46 Q31 36 40 46 L40 70" /><path d="M46 70 L46 46 Q55 36 64 46 L64 70" /><path d="M70 70 L70 46 Q79 36 88 46 L88 70" /><path d="M94 70 L94 46 Q103 36 112 46 L112 70" /><path d="M118 70 L118 46 Q127 36 136 46 L136 70" /><path d="M142 70 L142 46 Q151 36 160 46 L160 70" /><path d="M166 70 L166 46 Q175 36 184 46 L184 70" /></g>
  <rect class="muc" x="16" y="70" width="180" height="34"/>
  <rect class="sub" x="16" y="104" width="180" height="42"/>
  <ellipse cx="36" cy="125" rx="9" ry="5" class="gang"/><line x1="45" y1="125" x2="63" y2="125" class="fib"/><ellipse cx="72" cy="125" rx="9" ry="5" class="gang"/><line x1="81" y1="125" x2="99" y2="125" class="fib"/><ellipse cx="108" cy="125" rx="9" ry="5" class="gang"/><line x1="117" y1="125" x2="135" y2="125" class="fib"/><ellipse cx="144" cy="125" rx="9" ry="5" class="gang"/><line x1="153" y1="125" x2="171" y2="125" class="fib"/><ellipse cx="180" cy="125" rx="9" ry="5" class="gang"/>
  <rect x="16" y="146" width="180" height="30" fill="none"/>
  <ellipse cx="24" cy="160" rx="5" ry="12" class="musC"/><ellipse cx="36" cy="160" rx="5" ry="12" class="musC"/><ellipse cx="48" cy="160" rx="5" ry="12" class="musC"/><ellipse cx="60" cy="160" rx="5" ry="12" class="musC"/><ellipse cx="72" cy="160" rx="5" ry="12" class="musC"/><ellipse cx="84" cy="160" rx="5" ry="12" class="musC"/><ellipse cx="96" cy="160" rx="5" ry="12" class="musC"/><ellipse cx="108" cy="160" rx="5" ry="12" class="musC"/><ellipse cx="120" cy="160" rx="5" ry="12" class="musC"/><ellipse cx="132" cy="160" rx="5" ry="12" class="musC"/><ellipse cx="144" cy="160" rx="5" ry="12" class="musC"/><ellipse cx="156" cy="160" rx="5" ry="12" class="musC"/><ellipse cx="168" cy="160" rx="5" ry="12" class="musC"/><ellipse cx="180" cy="160" rx="5" ry="12" class="musC"/><ellipse cx="192" cy="160" rx="5" ry="12" class="musC"/>
  <ellipse cx="36" cy="186" rx="9" ry="5" class="gang"/><line x1="45" y1="186" x2="63" y2="186" class="fib"/><ellipse cx="72" cy="186" rx="9" ry="5" class="gang"/><line x1="81" y1="186" x2="99" y2="186" class="fib"/><ellipse cx="108" cy="186" rx="9" ry="5" class="gang"/><line x1="117" y1="186" x2="135" y2="186" class="fib"/><ellipse cx="144" cy="186" rx="9" ry="5" class="gang"/><line x1="153" y1="186" x2="171" y2="186" class="fib"/><ellipse cx="180" cy="186" rx="9" ry="5" class="gang"/>
  <rect class="musLbg" x="16" y="198" width="180" height="26"/>
  <line x1="20" y1="204" x2="192" y2="204" class="musL"/><line x1="20" y1="211" x2="192" y2="211" class="musL"/><line x1="20" y1="218" x2="192" y2="218" class="musL"/>
  <rect class="ser" x="16" y="226" width="180" height="10" rx="3"/>
  <line class="lead" x1="198" y1="60" x2="212" y2="53"/><text class="lbl" x="216" y="58">mucosa</text>
  <line class="lead" x1="198" y1="88" x2="212" y2="87"/><text class="small" x="216" y="92">lamina propria</text>
  <line class="lead" x1="198" y1="112" x2="212" y2="115"/><text class="lbl" x="216" y="120">submucosa</text>
  <line class="lead" x1="198" y1="125" x2="212" y2="135"/><text class="small" x="216" y="140" style="fill:var(--track);font-weight:600">submucosal plexus</text>
  <line class="lead" x1="198" y1="160" x2="212" y2="161"/><text class="lbl" x="216" y="166">circular muscle</text>
  <line class="lead" x1="198" y1="186" x2="212" y2="185"/><text class="small" x="216" y="190" style="fill:var(--track);font-weight:600">myenteric plexus</text>
  <line class="lead" x1="198" y1="211" x2="212" y2="209"/><text class="lbl" x="216" y="214">longitudinal muscle</text>
  <line class="lead" x1="198" y1="231" x2="212" y2="235"/><text class="lbl" x="216" y="240">serosa</text>
  <text class="small" x="16" y="260">muscularis externa = circular + longitudinal</text>
</svg>
