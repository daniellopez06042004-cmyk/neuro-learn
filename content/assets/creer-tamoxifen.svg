<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 314" role="img">
  <title>CreER and tamoxifen</title>
  <desc>CreER sits inert in the cytoplasm. Tamoxifen binds it, the CreER–tamoxifen complex enters the nucleus, the STOP is cut out of the DNA, and the reporter turns on.</desc>
  <style>
    svg{--text:#22221f;--muted:#5f5e5a;--line:#dcdad1;--line-strong:#b4b2a9;--surface:#ffffff;--surface-2:#efede6;--ok:#0f6e56;--bad:#993c1d;--warn:#ba7517;--track:#5B8DEF;}
    @media (prefers-color-scheme:dark){svg{--text:#f1efe8;--muted:#b4b2a9;--line:#3a3a37;--line-strong:#5f5e5a;--surface:#22221f;--surface-2:#2c2c2a;--ok:#5dcaa5;--bad:#f0997b;--warn:#ef9f27;--track:#7ea6f5;}}
    text{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,sans-serif;fill:var(--text);}
    .lbl{font-size:15px;font-weight:600;}
    .small{font-size:14px;font-weight:400;fill:var(--muted);}
    .onTxt{font-size:14px;font-weight:600;fill:#ffffff;}
    .cyto{fill:color-mix(in srgb, var(--line-strong) 20%, var(--surface));stroke:var(--line-strong);stroke-width:2.5;}
    .speck{fill:color-mix(in srgb, var(--line-strong) 45%, var(--surface));}
    .orga{fill:color-mix(in srgb, var(--line-strong) 24%, var(--surface));stroke:var(--line-strong);stroke-width:1.5;}
    .nuc{fill:color-mix(in srgb, var(--muted) 16%, var(--surface));stroke:var(--line-strong);stroke-width:2;}
    .pore{fill:var(--line-strong);}
    .bar{fill:color-mix(in srgb, var(--line-strong) 30%, var(--surface));stroke:var(--line-strong);stroke-width:2;}
    .rung{stroke:var(--line-strong);stroke-width:1.5;opacity:.5;}
    .stopF{fill:color-mix(in srgb, var(--bad) 55%, var(--surface));stroke:var(--bad);stroke-width:2;}
    .repF{fill:color-mix(in srgb, var(--track) 22%, var(--surface));stroke:var(--track);stroke-width:2;}
    .repOnF{fill:var(--track);stroke:var(--track);stroke-width:2;}
    .creer{fill:color-mix(in srgb, var(--track) 70%, var(--surface));stroke:var(--track);stroke-width:2;}
    .tamF{fill:color-mix(in srgb, var(--warn) 70%, var(--surface));stroke:var(--warn);stroke-width:2;}
    .pillOff{fill:color-mix(in srgb, var(--muted) 14%, var(--surface));stroke:var(--line-strong);stroke-width:2;}
    .pillOn{fill:var(--track);stroke:var(--track);stroke-width:2;}
    /* beats: 1 CreER waits outside · 2 tamoxifen enters and binds · 3 complex moves into the nucleus · 4 STOP out, reporter on */
    .cx{animation:move 9s ease-in-out infinite;}
    .tam{animation:tam 9s ease-in-out infinite;}
    .stop{animation:excise 9s ease-in-out infinite;}
    .repOn{opacity:0;animation:on 9s ease-in-out infinite;}
    .stOff{animation:stoff 9s ease-in-out infinite;}
    .stOn{opacity:0;animation:ston 9s ease-in-out infinite;}
    @keyframes tam{0%,8%{opacity:0;transform:translateY(-124px)}24%,100%{opacity:1;transform:translateY(0)}}
    @keyframes move{0%,30%{transform:translate(0,0)}50%,100%{transform:translate(130px,-34px)}}
    @keyframes excise{0%,56%{opacity:1;transform:translateY(0)}70%,100%{opacity:0;transform:translateY(40px)}}
    @keyframes on{0%,68%{opacity:0}80%,100%{opacity:1}}
    @keyframes stoff{0%,64%{opacity:1}72%,100%{opacity:0}}
    @keyframes ston{0%,70%{opacity:0}80%,100%{opacity:1}}
    @media (prefers-reduced-motion:reduce){
      .cx{animation:none;transform:translate(130px,-34px)}
      .tam{animation:none;opacity:1;transform:none}
      .stop{animation:none;opacity:0}
      .repOn{animation:none;opacity:1}
      .stOff{animation:none;opacity:0}
      .stOn{animation:none;opacity:1}
    }
  </style>

  <!-- ===== cell ===== -->
  <path class="cyto" d="M24 146 C22 90, 66 42, 130 32 C198 22, 292 40, 320 88 C342 124, 334 190, 292 228 C246 268, 150 266, 96 244 C50 226, 26 192, 24 146 Z"/>
  <g class="speck">
    <circle cx="62" cy="96" r="4"/><circle cx="96" cy="72" r="3"/><circle cx="52" cy="186" r="3.5"/>
    <circle cx="118" cy="226" r="4"/><circle cx="176" cy="246" r="3"/><circle cx="268" cy="248" r="3.5"/>
    <circle cx="150" cy="60" r="3"/><circle cx="86" cy="130" r="3"/>
  </g>
  <g class="orga">
    <ellipse cx="72" cy="98" rx="17" ry="7" transform="rotate(-25 72 98)"/>
    <ellipse cx="116" cy="72" rx="14" ry="6" transform="rotate(12 116 72)"/>
    <ellipse cx="98" cy="196" rx="15" ry="6.5" transform="rotate(16 98 196)"/>
    <ellipse cx="156" cy="232" rx="14" ry="6" transform="rotate(-10 156 232)"/>
  </g>
  <text class="small" x="80" y="222" text-anchor="middle">cytoplasm</text>

  <!-- ===== nucleus ===== -->
  <path class="nuc" d="M238 70 C292 68, 318 104, 314 150 C310 192, 282 222, 236 220 C190 218, 160 188, 162 144 C164 104, 190 72, 238 70 Z"/>
  <g class="pore">
    <circle cx="238" cy="69" r="3.5"/><circle cx="300" cy="96" r="3.5"/><circle cx="314" cy="162" r="3.5"/>
    <circle cx="264" cy="220" r="3.5"/><circle cx="182" cy="192" r="3.5"/><circle cx="163" cy="128" r="3.5"/>
  </g>
  <text class="small" x="238" y="202" text-anchor="middle">nucleus</text>

  <!-- ===== DNA with STOP and reporter ===== -->
  <rect class="bar" x="166" y="138" width="146" height="9" rx="4.5"/>
  <rect class="bar" x="166" y="155" width="146" height="9" rx="4.5"/>
  <g class="rung">
    <line x1="174" y1="147" x2="174" y2="155"/><line x1="186" y1="147" x2="186" y2="155"/>
    <line x1="210" y1="147" x2="210" y2="155"/><line x1="222" y1="147" x2="222" y2="155"/>
  </g>
  <g class="stop">
    <polygon class="stopF" points="186,136 206,136 216,146 216,152 206,162 186,162 176,152 176,146"/>
  </g>
  <rect class="repF" x="228" y="134" width="78" height="30" rx="8"/>
  <text class="lbl" x="267" y="154" text-anchor="middle">reporter</text>
  <g class="repOn">
    <rect class="repOnF" x="228" y="134" width="78" height="30" rx="8"/>
    <text class="onTxt" x="267" y="154" text-anchor="middle">reporter ✓</text>
  </g>

  <!-- ===== CreER, with tamoxifen docking on its right; they travel together ===== -->
  <g class="cx">
    <rect class="creer" x="50" y="135" width="66" height="30" rx="15"/>
    <text class="onTxt" x="83" y="155" text-anchor="middle">CreER</text>
    <g transform="translate(129,150)">
      <g class="tam">
        <polygon class="tamF" points="0,-13 11,-6.5 11,6.5 0,13 -11,6.5 -11,-6.5"/>
        <text class="lbl" x="0" y="-22" text-anchor="middle" style="fill:var(--warn)">tamoxifen</text>
      </g>
    </g>
  </g>

  <!-- ===== state pill ===== -->
  <g class="stOff">
    <rect class="pillOff" x="80" y="272" width="200" height="32" rx="16"/>
    <text class="lbl" x="180" y="293" text-anchor="middle" style="fill:var(--muted)">− tamoxifen: off</text>
  </g>
  <g class="stOn">
    <rect class="pillOn" x="80" y="272" width="200" height="32" rx="16"/>
    <text class="onTxt" x="180" y="293" text-anchor="middle">+ tamoxifen: on</text>
  </g>
</svg>
