<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 360" role="img" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>CNO back-converts to clozapine</title>
  <desc>CNO, a prodrug, is converted to clozapine, which crosses the blood–brain barrier and binds an off-target receptor on a neuron that has no DREADD.</desc>
  <style>
    svg{--text:#22221f;--muted:#5f5e5a;--line-strong:#b4b2a9;--surface-2:#efede6;--warn:#ba7517;--bad:#993c1d;}
    @media (prefers-color-scheme:dark){svg{--text:#f1efe8;--muted:#b4b2a9;--line-strong:#5f5e5a;--surface-2:#2c2c2a;--warn:#ef9f27;--bad:#f0997b;}}
    text{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,sans-serif;fill:var(--text);}
    .lbl{font-size:15px;font-weight:600;} .small{font-size:14px;font-weight:400;fill:var(--muted);}
    .cno{fill:var(--surface-2);stroke:var(--line-strong);stroke-width:2;}
    .clz{fill:var(--warn);}
    .bbb{stroke:var(--line-strong);stroke-width:2;stroke-dasharray:6 6;}
    .den{fill:none;stroke:var(--line-strong);stroke-width:2.5;stroke-linecap:round;}
    .soma{fill:var(--surface-2);stroke:var(--line-strong);stroke-width:2.5;}
    .hit{fill:var(--bad);opacity:0;animation:hit 6s ease-in-out infinite;}
    .cloz{animation:fall 6s ease-in-out infinite;}
    .conv1{animation:c1 6s ease-in-out infinite;} .conv2{animation:c2 6s ease-in-out infinite;}
    @keyframes c1{0%,22%{opacity:1}34%,100%{opacity:0}}
    @keyframes c2{0%,24%{opacity:0}36%{opacity:1}100%{opacity:1}}
    @keyframes fall{0%,36%{transform:translate(0,0)}64%,100%{transform:translate(-62px,172px)}}
    @keyframes hit{0%,66%{opacity:0}78%{opacity:.85}100%{opacity:.8}}
    @media (prefers-reduced-motion:reduce){.conv1{animation:none;opacity:0}.conv2{animation:none;opacity:1}.cloz{animation:none;transform:translate(-62px,172px)}.hit{animation:none;opacity:.8}}
  </style>

  <!-- stage 1: CNO prodrug (converts) -->
  <g class="conv1"><circle class="cno" cx="180" cy="56" r="24"/><text class="lbl" x="180" y="61" text-anchor="middle">CNO</text></g>
  <text class="small conv1" x="180" y="98" text-anchor="middle">prodrug</text>

  <!-- stage 2: clozapine appears, then falls across BBB -->
  <g class="cloz">
    <g class="conv2"><rect class="clz" x="134" y="40" width="92" height="32" rx="16"/><text class="lbl" x="180" y="61" text-anchor="middle" style="fill:#fff">clozapine</text></g>
  </g>

  <!-- blood-brain barrier -->
  <line class="bbb" x1="30" y1="170" x2="330" y2="170"/>
  <text class="small" x="330" y="160" text-anchor="end">blood–brain barrier</text>

  <!-- off-target neuron (no DREADD) at bottom -->
  <g transform="translate(180,286)">
    <g class="den"><path d="M-6,-10 C -16,-24 -24,-28 -34,-36"/><path d="M6,-10 C 16,-24 24,-28 34,-36"/><path d="M-12,-3 C -30,-9 -40,-9 -50,-7"/><path d="M12,-3 C 30,-9 40,-9 50,-7"/><path d="M0,-14 C -1,-30 1,-36 0,-46"/></g>
    <circle class="soma" r="16"/>
    <circle class="hit" r="16"/>
  </g>
  <text class="lbl" x="180" y="338" text-anchor="middle" style="fill:var(--bad)">✕ no DREADD · off-target</text>
</svg>
