<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 320" role="img"
     aria-label="Cre recombinase excises a loxP-flanked STOP cassette, so the payload gene downstream switches on." xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="payGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7aa6ff"/><stop offset="1" stop-color="#5B8DEF"/>
    </linearGradient>
    <linearGradient id="onGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#34d17f"/><stop offset="1" stop-color="#1f9d61"/>
    </linearGradient>
  </defs>
  <style>
    .bg{fill:#f5f7fb}.ink{fill:#131722}.muted{fill:#5b6472}
    .dna{stroke:#9aa4b5}.prom{fill:#c3ccda}.stop{fill:#e0607a}.lox{fill:#f0a83a}
    .label{font:600 19px -apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif}
    .sub{font:400 14px -apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif}
    .tag{font:700 16px -apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif}
    @media (prefers-color-scheme:dark){
      .bg{fill:#0f1420}.ink{fill:#eef1f7}.muted{fill:#9aa4b5}
      .dna{stroke:#3a4356}.prom{fill:#3a4356}
    }
    /* scissors move in and snip */
    .cre{animation:crein 5s ease-in-out infinite}
    @keyframes crein{0%{transform:translate(0,-60px);opacity:0}20%{transform:translate(0,0);opacity:1}
      38%{transform:translate(0,0) rotate(0)}44%{transform:translate(0,0) rotate(-12deg)}
      50%{transform:translate(0,0) rotate(0)}70%,100%{transform:translate(0,-60px);opacity:0}}
    /* STOP cassette is excised */
    .stopg{animation:excise 5s ease-in-out infinite}
    @keyframes excise{0%,44%{transform:translateY(0);opacity:1}
      58%{transform:translateY(-70px);opacity:0}100%{transform:translateY(-70px);opacity:0}}
    /* payload lights up ON */
    .on{animation:turnon 5s ease-in-out infinite}
    @keyframes turnon{0%,55%{opacity:0}70%{opacity:1}100%{opacity:1}}
    .onbadge{animation:pop 5s ease-in-out infinite}
    @keyframes pop{0%,58%{opacity:0;transform:scale(.5)}72%{opacity:1;transform:scale(1)}100%{opacity:1}}
  </style>

  <rect class="bg" x="0" y="0" width="820" height="320" rx="18"/>

  <!-- DNA backbone -->
  <line class="dna" x1="70" y1="180" x2="750" y2="180" stroke-width="8" stroke-linecap="round"/>

  <!-- promoter -->
  <rect class="prom" x="80" y="160" width="90" height="40" rx="6"/>
  <text class="sub ink" x="125" y="185" text-anchor="middle">promoter</text>

  <!-- loxP triangles -->
  <polygon class="lox" points="190,160 214,180 190,200"/>
  <polygon class="lox" points="392,160 416,180 392,200"/>

  <!-- STOP cassette (excised) -->
  <g class="stopg">
    <rect class="stop" x="224" y="156" width="160" height="48" rx="8"/>
    <text class="tag" x="304" y="187" text-anchor="middle" fill="#fff">STOP</text>
  </g>

  <!-- payload: off (blue) then ON (green) -->
  <rect x="426" y="156" width="230" height="48" rx="8" fill="url(#payGrad)"/>
  <rect class="on" x="426" y="156" width="230" height="48" rx="8" fill="url(#onGrad)"/>
  <text class="tag" x="541" y="187" text-anchor="middle" fill="#fff">payload (tdTomato)</text>

  <!-- Cre scissors -->
  <g class="cre" transform="translate(304,90)">
    <text class="tag ink" x="0" y="-8" text-anchor="middle">Cre</text>
    <circle cx="-10" cy="22" r="9" fill="none" stroke="#5b6472" stroke-width="4"/>
    <circle cx="10" cy="22" r="9" fill="none" stroke="#5b6472" stroke-width="4"/>
    <line x1="-6" y1="26" x2="16" y2="48" stroke="#5b6472" stroke-width="4" stroke-linecap="round"/>
    <line x1="6" y1="26" x2="-16" y2="48" stroke="#5b6472" stroke-width="4" stroke-linecap="round"/>
  </g>

  <!-- ON badge -->
  <g class="onbadge" transform="translate(541,128)" style="transform-origin:541px 128px">
    <rect x="-34" y="-20" width="68" height="34" rx="17" fill="url(#onGrad)"/>
    <text class="tag" x="0" y="3" text-anchor="middle" fill="#fff">ON</text>
  </g>

  <text class="label ink" x="410" y="270" text-anchor="middle">Cre cuts at loxP → STOP removed → gene ON</text>
</svg>
