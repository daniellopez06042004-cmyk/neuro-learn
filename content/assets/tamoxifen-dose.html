<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root{--text:#22221f;--muted:#5f5e5a;--line:#dcdad1;--line-strong:#b4b2a9;--surface-2:#efede6;--ok:#0f6e56;--bad:#993c1d;--warn:#ba7517;--track:#5B8DEF;--off:#d8d6cd;}
  @media (prefers-color-scheme:dark){:root{--text:#f1efe8;--muted:#b4b2a9;--line:#3a3a37;--line-strong:#5f5e5a;--surface-2:#2c2c2a;--ok:#5dcaa5;--bad:#f0997b;--warn:#ef9f27;--track:#7ea6f5;--off:#3a3a37;}}
  html,body{background:transparent;margin:0}
  body{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,sans-serif;color:var(--text);font-size:15px}
  .field{display:grid;grid-template-columns:repeat(10,1fr);gap:7px;margin-bottom:16px}
  .n{width:100%;aspect-ratio:1;border-radius:50%;background:var(--off);transition:.15s}
  .n.on{background:var(--track)}
  .row{display:flex;align-items:center;gap:12px;min-height:44px}
  label{font-weight:600;white-space:nowrap}
  input[type=range]{flex:1;height:44px;accent-color:var(--track)}
  .readout{margin-top:14px;padding:12px 14px;border-radius:12px;background:var(--surface-2);border:1px solid var(--line)}
  .pct{font-size:20px;font-weight:800}
  .verdict{font-weight:700;margin-top:3px} .verdict.good{color:var(--ok)} .verdict.warn{color:var(--warn)} .verdict.bad{color:var(--bad)}
</style></head>
<body>
  <div class="field" id="field" aria-label="DRG neurons; labelled ones are filled"></div>
  <div class="row"><label for="dose">Tamoxifen dose</label><input id="dose" type="range" min="0" max="100" value="14" aria-label="Tamoxifen dose"></div>
  <div class="readout"><div class="pct"><span id="pct">4</span>% labelled</div><div class="verdict" id="verdict"></div></div>
<script>
(function(){
  var N=40,field=document.getElementById('field'),dots=[],th=[],seed=20260401;
  function r(){seed=(seed*1664525+1013904223)%4294967296;return seed/4294967296;}
  for(var i=0;i<N;i++){th.push(r());var d=document.createElement('span');d.className='n';field.appendChild(d);dots.push(d);}
  var dose=document.getElementById('dose'),pct=document.getElementById('pct'),verdict=document.getElementById('verdict');
  function frac(v){return Math.pow(v/100,1.15)*0.92;}
  function render(){
    var f=frac(+dose.value),c=0;
    for(var i=0;i<N;i++){var on=th[i]<f;dots[i].classList.toggle('on',on);if(on)c++;}
    var p=Math.round(c/N*100);pct.textContent=p;
    if(c===0){verdict.textContent='No recombination';verdict.className='verdict';}
    else if(p<=12){verdict.textContent='✓ sparse — single neurons traceable';verdict.className='verdict good';}
    else if(p<=45){verdict.textContent='moderate — some overlap';verdict.className='verdict warn';}
    else{verdict.textContent='✕ dense — endings overlap';verdict.className='verdict bad';}
  }
  dose.addEventListener('input',render);render();
})();
</script>
</body></html>
