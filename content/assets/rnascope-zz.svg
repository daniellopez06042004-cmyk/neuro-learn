<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 302" role="img">
  <title>RNAscope: two Z probes must sit side by side</title>
  <desc>An mRNA strand is tiled by ZZ probe pairs (three shown; more continue along the strand). Each pair lands on adjacent sites, and a preamplifier binds across the two side-by-side Z tails. Amplifiers branch off each preamplifier, label probes bind the amplifiers and light up, and the trees merge into one bright dot. Elsewhere a lone probe stuck on an off-target strand has no partner, so no preamplifier binds and it stays dark (cross).</desc>
  <style>
    :root,svg{--text:#22221f;--muted:#5f5e5a;--line:#dcdad1;--line-strong:#b4b2a9;--surface:#ffffff;--surface-2:#efede6;--ok:#0f6e56;--bad:#993c1d;--warn:#ba7517;--track:#5B8DEF;--lipid:#e8d9c4;}
    @media (prefers-color-scheme:dark){:root,svg{--text:#f1efe8;--muted:#b4b2a9;--line:#3a3a37;--line-strong:#5f5e5a;--surface:#22221f;--surface-2:#2c2c2a;--ok:#5dcaa5;--bad:#f0997b;--warn:#ef9f27;--track:#7ea6f5;--lipid:#4a4237;}}
    svg{--t0:color-mix(in srgb,var(--track) 9%,var(--surface));--t1:color-mix(in srgb,var(--track) 22%,var(--surface));--t2:color-mix(in srgb,var(--track) 50%,var(--surface));--t3:color-mix(in srgb,var(--track) 70%,var(--text));--b1:color-mix(in srgb,var(--bad) 22%,var(--surface));--w1:color-mix(in srgb,var(--warn) 24%,var(--surface));--n1:color-mix(in srgb,var(--line-strong) 32%,var(--surface));--n2:color-mix(in srgb,var(--line-strong) 75%,var(--surface));--head:color-mix(in srgb,var(--lipid) 70%,var(--text));--tissue:color-mix(in srgb,#e8b4b0 30%,var(--surface-2));--tissue-hi:color-mix(in srgb,#e8b4b0 55%,var(--surface-2));--tissue-line:color-mix(in srgb,#e8b4b0 45%,var(--line-strong));}
    text{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,sans-serif;font-size:14px;font-weight:600;fill:var(--text);}
    .m{font-weight:400;fill:var(--muted);}
    .rna{fill:none;stroke:var(--muted);stroke-width:5;stroke-linecap:round;}
    .tick{fill:none;stroke:var(--line-strong);stroke-width:2;}
    .orna{fill:none;stroke:var(--line-strong);stroke-width:4;stroke-linecap:round;}
    .z{fill:none;stroke:var(--t3);stroke-width:4;stroke-linecap:round;stroke-linejoin:round;}
    .zl{fill:none;stroke:var(--bad);stroke-width:4;stroke-linecap:round;stroke-linejoin:round;}
    .pre{fill:none;stroke:var(--track);stroke-width:5;stroke-linecap:round;stroke-linejoin:round;}
    .ghost{fill:none;stroke:var(--bad);stroke-width:3;stroke-linecap:round;stroke-dasharray:5 5;}
    .amp{fill:none;stroke:var(--t2);stroke-width:3.5;stroke-linecap:round;stroke-dasharray:1 1;stroke-dashoffset:1;}
    .lp{fill:color-mix(in srgb,var(--track) 40%,#ffffff);stroke:var(--track);stroke-width:1.5;}
    .halo{fill:var(--track);opacity:.22;}
    .lead{fill:none;stroke:var(--muted);stroke-width:1.5;stroke-linecap:round;}
    .x{fill:none;stroke:var(--bad);stroke-width:3.5;stroke-linecap:round;}
    .dots{fill:var(--muted);}
    .glow{opacity:0;animation:glow 10s ease-in-out infinite;}
