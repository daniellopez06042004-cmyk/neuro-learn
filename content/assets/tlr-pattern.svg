<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 300" role="img">
  <title>A pattern-recognition receptor senses a shared microbial pattern</title>
  <desc>Three differently shaped bacteria (a rod, a pair of round cells and a curved rod) each carry the same surface molecule, LPS. An immune cell's TLR4 receptors bind that shared pattern, a signal runs into the cell, and it switches on a danger response.</desc>
  <style>
    :root,svg{--text:#22221f;--muted:#5f5e5a;--line:#dcdad1;--line-strong:#b4b2a9;--surface:#ffffff;--surface-2:#efede6;--ok:#0f6e56;--bad:#993c1d;--warn:#ba7517;--track:#D4537E;--lipid:#e8d9c4;}
    @media (prefers-color-scheme:dark){:root,svg{--text:#f1efe8;--muted:#b4b2a9;--line:#3a3a37;--line-strong:#5f5e5a;--surface:#22221f;--surface-2:#2c2c2a;--ok:#5dcaa5;--bad:#f0997b;--warn:#ef9f27;--track:#e67ba0;--lipid:#4a4237;}}
    svg{--t1:color-mix(in srgb,var(--track) 22%,var(--surface));--t2:color-mix(in srgb,var(--track) 50%,var(--surface));--t0:color-mix(in srgb,var(--track) 9%,var(--surface));--w1:color-mix(in srgb,var(--warn) 24%,var(--surface));--b1:color-mix(in srgb,var(--bad) 22%,var(--surface));--ok1:color-mix(in srgb,var(--ok) 22%,var(--surface));--n1:color-mix(in srgb,var(--line-strong) 32%,var(--surface));--n2:color-mix(in srgb,var(--line-strong) 75%,var(--surface));--head:color-mix(in srgb,var(--lipid) 70%,var(--text));--tissue:color-mix(in srgb,#e8b4b0 30%,var(--surface-2));}
    text{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,sans-serif;font-size:14px;font-weight:600;fill:var(--text);}
    .m{font-weight:400;fill:var(--muted);}
    .lip{fill:var(--lipid);}
    .hd{fill:none;stroke:var(--head);stroke-width:7;stroke-linecap:round;stroke-dasharray:0 8;}
    .cT{fill:var(--t1);stroke:var(--track);stroke-width:2;}
    .cN{fill:var(--n1);stroke:var(--line-strong);stroke-width:2;}
    .nT{fill:var(--t2);}
    .nN{fill:var(--n2);}
    .mic{fill:var(--n1);stroke:var(--line-strong);stroke-width:2;}
    .lps{fill:var(--warn);} .lpsS{stroke:var(--warn);stroke-width:2.5;stroke-linecap:round;}
    .hs{fill:none;stroke-linecap:round;}
    .act{opacity:0;animation:act 9s ease-in-out infinite;}
    @keyframes act{0%,30%{opacity:0}42%,95%{opacity:1}100%{opacity:0}}
    @keyframes k0{0%,10%{transform:translate(-30px,-47.4px);opacity:1}28%{transform:translate(0px,0px);opacity:1}95%{transform:translate(0px,0px);opacity:1}97.5%{transform:translate(0px,0px);opacity:0}97.6%{transform:translate(-30px,-47.4px);opacity:0}100%{transform:translate(-30px,-47.4px);opacity:1}}
    .k0{animation:k0 9s ease-in-out infinite;}
    @keyframes k1{0%,12%{transform:translate(2px,-37px);opacity:1}30%{transform:translate(0px,0px);opacity:1}95%{transform:translate(0px,0px);opacity:1}97.5%{transform:translate(0px,0px);opacity:0}97.6%{transform:translate(2px,-37px);opacity:0}100%{transform:translate(2px,-37px);opacity:1}}
    .k1{animation:k1 9s ease-in-out infinite;}
    @keyframes k2{0%,14%{transform:translate(37.5px,-56.3px);opacity:1}32%{transform:translate(0px,0px);opacity:1}95%{transform:translate(0px,0px);opacity:1}97.5%{transform:translate(0px,0px);opacity:0}97.6%{transform:translate(37.5px,-56.3px);opacity:0}100%{transform:translate(37.5px,-56.3px);opacity:1}}
    .k2{animation:k2 9s ease-in-out infinite;}
    @keyframes s0{0%,44%{opacity:0;transform:translate(-56px,-66.6px)}47%{opacity:1}58%{opacity:1;transform:translate(0,0)}64%,100%{opacity:0;transform:translate(0,0)}}
    .s0{animation:s0 9s ease-in-out infinite;}
    @keyframes s1{0%,44%{opacity:0;transform:translate(0px,-74px)}47%{opacity:1}58%{opacity:1;transform:translate(0,0)}64%,100%{opacity:0;transform:translate(0,0)}}
    .s1{animation:s1 9s ease-in-out infinite;}
    @keyframes s2{0%,44%{opacity:0;transform:translate(56px,-66.6px)}47%{opacity:1}58%{opacity:1;transform:translate(0,0)}64%,100%{opacity:0;transform:translate(0,0)}}
    .s2{animation:s2 9s ease-in-out infinite;}
    .resp{opacity:0;animation:resp 9s ease-in-out infinite;}
    @keyframes resp{0%,58%{opacity:0}72%,95%{opacity:1}100%{opacity:0}}
    @media (prefers-reduced-motion:reduce){*{animation-delay:-7.7s!important;animation-play-state:paused!important;}}
  </style>
