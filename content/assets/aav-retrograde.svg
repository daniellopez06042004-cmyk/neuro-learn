<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 380" role="img"
     aria-label="A retrograde AAV is taken up at nerve terminals in the pancreas and carried back along the axon to the pseudounipolar DRG cell body, which then pulses green as it expresses its payload." xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <radialGradient id="organG" cx="40%" cy="35%" r="70%"><stop offset="0" stop-color="#eec3cd"/><stop offset="1" stop-color="#d892a4"/></radialGradient>
  </defs>
  <style>
    .bg{fill:#f5f7fb}.ink{fill:#131722}.muted{fill:#5b6472}
    .organ{fill:url(#organG);stroke:#c17f92}.soma{fill:#dbe6f7;stroke:#8aa0c8}.nuc{fill:#8fb0e6}.axon{stroke:#aebbd4;fill:none}.term{stroke:#aebbd4;fill:none}
    .cap{fill:#2bb673;stroke:#167a4c}.greenP{fill:#2fd08a}.ring{fill:none;stroke:#2fd08a}
    .label{font:600 17px -apple-system,sans-serif}.sub{font:400 13px -apple-system,sans-serif}.tag{font:700 12px -apple-system,sans-serif}
    @media (prefers-color-scheme:dark){.bg{fill:#0f1420}.ink{fill:#eef1f7}.muted{fill:#9aa4b5}.organ{stroke:#b2778a}
      .soma{fill:#223052;stroke:#4a5f8a}.nuc{fill:#3f63a8}.axon{stroke:#44557a}.term{stroke:#44557a}.cap{fill:#34d17f;stroke:#167a4c}}
    .pkt{animation:travel 4.4s linear infinite}.p2{animation-delay:1.1s}.p3{animation-delay:2.2s}.p4{animation-delay:3.3s}
    @keyframes travel{0%{transform:translateX(0) rotate(0);opacity:0}7%{opacity:1}84%{opacity:1}100%{transform:translateX(430px) rotate(100deg);opacity:0}}
    .onB{transform-box:fill-box;transform-origin:center;animation:ob 4.4s ease-in-out infinite}
    @keyframes ob{0%,72%{transform:scale(1)}82%{transform:scale(1.12)}92%{transform:scale(1)}100%{transform:scale(1.05)}}
    .onT{animation:ot 4.4s ease-in-out infinite}@keyframes ot{0%,72%{opacity:0}84%{opacity:.9}94%{opacity:.4}100%{opacity:.55}}
    .onR{transform-box:fill-box;transform-origin:center;animation:orr 4.4s ease-out infinite}@keyframes orr{0%,72%{transform:scale(.5);opacity:0}78%{opacity:.5}95%{opacity:0}100%{transform:scale(2);opacity:0}}
    .payload{animation:pl 4.4s ease-in-out infinite}@keyframes pl{0%,74%{opacity:0}86%{opacity:1}100%{opacity:.7}}
  </style>

  <rect class="bg" x="0" y="0" width="820" height="380" rx="18"/>

  <!-- PANCREAS -->
  <path class="organ" d="M70 150 c-26 -10 -40 20 -30 44 c-14 14 -6 44 16 46 c8 22 40 26 58 10 c18 12 46 2 50 -20 c20 -6 24 -34 6 -48 c6 -24 -18 -44 -42 -36 c-14 -16 -44 -12 -58 2 Z" stroke-width="3"/>
  <circle cx="110" cy="190" r="7" fill="#c98196" opacity="0.5"/><circle cx="140" cy="220" r="6" fill="#c98196" opacity="0.5"/><circle cx="95" cy="225" r="5" fill="#c98196" opacity="0.5"/>
  <path class="term" d="M175 205 q18 -10 34 -4 M172 220 q22 2 38 -2 M176 235 q18 8 34 2" stroke-width="3" stroke-linecap="round"/>

  <!-- AXON -->
  <path class="axon" d="M205 220 q120 -4 250 -4" stroke-width="8" stroke-linecap="round"/>

  <!-- DRG pseudounipolar NEURON -->
  <g transform="translate(640,218)">
    <path class="axon" d="M-20 -2 q-30 0 -60 2" stroke-width="8" stroke-linecap="round"/>
    <path class="axon" d="M12 -24 q22 -26 52 -34" stroke-width="7" stroke-linecap="round"/>
    <circle class="ring onR" cx="0" cy="-2" r="34" stroke-width="3"/>
    <g class="onB">
      <path class="soma" d="M-18 20 c-20 -6 -28 -30 -14 -46 c10 -14 32 -16 46 -6 c16 -10 40 2 40 22 c0 18 -14 32 -32 23 c-6 16 -30 20 -46 10 c-12 7 -28 3 -32 -5 Z"/>
      <path class="greenP onT" d="M-18 20 c-20 -6 -28 -30 -14 -46 c10 -14 32 -16 46 -6 c16 -10 40 2 40 22 c0 18 -14 32 -32 23 c-6 16 -30 20 -46 10 c-12 7 -28 3 -32 -5 Z"/>
      <ellipse class="nuc" cx="2" cy="-2" rx="14" ry="12"/>
    </g>
    <text class="payload tag" x="2" y="2" text-anchor="middle" fill="#fff">hM4Di</text>
  </g>

  <!-- AAV capsids (icosahedral) -->
  <g transform="translate(205,216)">
    <g class="pkt p1"><g><polygon class="cap" points="0,-11 9,-6 9,6 0,11 -9,6 -9,-6" stroke-width="1.5"/><path d="M0,-11 L0,11 M-9,-6 L9,6 M9,-6 L-9,6" stroke="#167a4c" stroke-width="0.8" opacity="0.6"/></g></g>
    <g class="pkt p2"><g><polygon class="cap" points="0,-11 9,-6 9,6 0,11 -9,6 -9,-6" stroke-width="1.5"/><path d="M0,-11 L0,11 M-9,-6 L9,6 M9,-6 L-9,6" stroke="#167a4c" stroke-width="0.8" opacity="0.6"/></g></g>
    <g class="pkt p3"><g><polygon class="cap" points="0,-11 9,-6 9,6 0,11 -9,6 -9,-6" stroke-width="1.5"/><path d="M0,-11 L0,11 M-9,-6 L9,6 M9,-6 L-9,6" stroke="#167a4c" stroke-width="0.8" opacity="0.6"/></g></g>
    <g class="pkt p4"><g><polygon class="cap" points="0,-11 9,-6 9,6 0,11 -9,6 -9,-6" stroke-width="1.5"/><path d="M0,-11 L0,11 M-9,-6 L9,6 M9,-6 L-9,6" stroke="#167a4c" stroke-width="0.8" opacity="0.6"/></g></g>
  </g>

  <text class="label ink" x="120" y="300" text-anchor="middle">Pancreas</text>
  <text class="sub muted" x="120" y="321" text-anchor="middle">inject AAV2-retro here</text>
  <text class="label ink" x="650" y="300" text-anchor="middle">DRG cell body</text>
  <text class="sub muted" x="650" y="321" text-anchor="middle">payload switches on</text>
  <text class="sub muted" x="410" y="196" text-anchor="middle">retrograde transport →</text>
</svg>
