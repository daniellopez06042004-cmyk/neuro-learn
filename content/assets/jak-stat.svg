<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 330" role="img" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>JAK-STAT signaling from receptor to gene</title>
  <desc>A cytokine binds its receptor at the cell surface; the receptor-associated JAK enzymes become active and tag STAT proteins; the STATs travel into the nucleus and switch on a target gene.</desc>
  <style>
    svg{--text:#22221f;--muted:#5f5e5a;--line:#dcdad1;--line-strong:#b4b2a9;--surface:#ffffff;--surface-2:#efede6;--warn:#ba7517;--track:#D4537E;}
    @media (prefers-color-scheme:dark){svg{--text:#f1efe8;--muted:#b4b2a9;--line:#3a3a37;--line-strong:#5f5e5a;--surface:#22221f;--surface-2:#2c2c2a;--warn:#ef9f27;--track:#e67ba0;}}
    text{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,sans-serif;fill:var(--text);}
    .lbl{font-size:14px;font-weight:600;} .small{font-size:12px;font-weight:400;fill:var(--muted);}
    .memb{fill:none;stroke:var(--line-strong);stroke-width:2;}
    .cyto{fill:var(--surface-2);opacity:.5;}
    .rec{fill:var(--surface-2);stroke:var(--track);stroke-width:2.5;}
    .cyt{fill:var(--warn);}
    .jak{fill:var(--track);}
    .stat{fill:var(--track);stroke:var(--surface);stroke-width:1.5;}
    .nuc{fill:var(--surface);stroke:var(--line-strong);stroke-width:2;}
    .gene{fill:var(--surface-2);stroke:var(--line-strong);stroke-width:1.5;}
    .geneOn{opacity:0;animation:geneOn 7s ease-in-out infinite;}
    .offlbl{animation:geneOff 7s ease-in-out infinite;}
    .cytdrop{animation:cytd 7s ease-in-out infinite;}
    .jakp{opacity:0;animation:jakp 7s ease-in-out infinite;}
    .statCyto{animation:statCyto 7s ease-in-out infinite;}
    .statMove{offset-path:path("M110 150 L120 278");offset-rotate:0deg;opacity:0;animation:statRun 7s ease-in-out infinite;}
    .statLbl{opacity:0;animation:geneOn 7s ease-in-out infinite;}
    @keyframes cytd{0%{transform:translateY(-26px);opacity:0}8%{opacity:1}18%,100%{transform:translateY(0);opacity:1}}
    @keyframes jakp{0%,20%{opacity:0}30%,100%{opacity:1}}
    @keyframes statCyto{0%,34%{opacity:1}46%,100%{opacity:0}}
    @keyframes statRun{0%,36%{offset-distance:0%;opacity:0}44%{offset-distance:10%;opacity:1}64%,100%{offset-distance:100%;opacity:1}}
    @keyframes geneOn{0%,66%{opacity:0}78%,100%{opacity:1}}
    @keyframes geneOff{0%,66%{opacity:1}78%,100%{opacity:0}}
    @media (prefers-reduced-motion:reduce){.cytdrop{animation:none;transform:translateY(0);opacity:1}.jakp{animation:none;opacity:1}.statCyto{animation:none;opacity:0}.statMove{animation:none;offset-distance:100%;opacity:1}.statLbl{animation:none;opacity:1}.geneOn{animation:none;opacity:1}.offlbl{animation:none;opacity:0}}
  </style>

  <!-- membrane -->
  <line class="memb" x1="20" y1="70" x2="340" y2="70"/>
  <line class="memb" x1="20" y1="82" x2="340" y2="82"/>
  <text class="small" x="326" y="64" text-anchor="end">cell surface</text>

  <!-- cytokine docking -->
  <g class="cytdrop"><circle class="cyt" cx="118" cy="44" r="14"/><text class="small" x="118" y="30" text-anchor="middle" style="fill:var(--warn)">cytokine</text></g>

  <!-- receptor spanning membrane -->
  <rect class="rec" x="104" y="60" width="12" height="52" rx="4"/>
  <rect class="rec" x="120" y="60" width="12" height="52" rx="4"/>
  <text class="lbl" x="150" y="100">receptor</text>

  <!-- JAK enzymes inside -->
  <circle class="jak" cx="100" cy="118" r="7"/>
  <circle class="jak" cx="136" cy="118" r="7"/>
  <text class="lbl" x="150" y="124">JAK</text>
  <text class="jakp" x="150" y="140" font-size="14" font-weight="700" style="fill:var(--track)">active ✓</text>

  <!-- STAT: single in cytoplasm (fades once activated) -->
  <g class="statCyto">
    <rect class="stat" x="86" y="142" width="16" height="16" rx="4"/>
    <text class="lbl" x="112" y="156">STAT</text>
  </g>

  <!-- nucleus -->
  <rect class="nuc" x="40" y="236" width="280" height="74" rx="18"/>
  <text class="small" x="56" y="256">nucleus</text>

  <!-- STAT dimer travels in and stays, bound by the gene -->
  <g class="statMove"><rect class="stat" x="-17" y="-8" width="16" height="16" rx="4"/><rect class="stat" x="1" y="-8" width="16" height="16" rx="4"/></g>
  <text class="lbl statLbl" x="120" y="304" text-anchor="middle" style="fill:var(--track)">STAT</text>
  <rect class="gene" x="150" y="264" width="140" height="26" rx="6"/>
  <rect class="geneOn" x="150" y="264" width="140" height="26" rx="6" style="fill:var(--track);stroke:var(--track)"/>
  <text class="lbl geneOn" x="220" y="282" text-anchor="middle" style="fill:var(--surface)">target gene ON</text>
  <text class="lbl offlbl" x="220" y="282" text-anchor="middle">target gene</text>
</svg>
