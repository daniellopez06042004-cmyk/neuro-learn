<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 334" role="img">
  <title>Inflammatory mediators sensitize a nerve ending</title>
  <desc>A sensory nerve ending sits in inflamed tissue. Mediators (protons, ATP, prostaglandins, cytokines) gather around it, its firing threshold drops, and it fires more spikes to the same gentle stimulus. Ending traced from a real mouse afferent (Wu, Williams &amp; Nathans 2012, eLife; NeuroMorpho.Org).</desc>
  <style>
    :root,svg{--text:#22221f;--muted:#5f5e5a;--line:#dcdad1;--line-strong:#b4b2a9;--surface:#ffffff;--surface-2:#efede6;--ok:#0f6e56;--bad:#993c1d;--warn:#ba7517;--track:#D4537E;--lipid:#e8d9c4;}
    @media (prefers-color-scheme:dark){:root,svg{--text:#f1efe8;--muted:#b4b2a9;--line:#3a3a37;--line-strong:#5f5e5a;--surface:#22221f;--surface-2:#2c2c2a;--ok:#5dcaa5;--bad:#f0997b;--warn:#ef9f27;--track:#e67ba0;--lipid:#4a4237;}}
    svg{--t1:color-mix(in srgb,var(--track) 22%,var(--surface));--t2:color-mix(in srgb,var(--track) 50%,var(--surface));--t0:color-mix(in srgb,var(--track) 9%,var(--surface));--w1:color-mix(in srgb,var(--warn) 24%,var(--surface));--b1:color-mix(in srgb,var(--bad) 22%,var(--surface));--ok1:color-mix(in srgb,var(--ok) 22%,var(--surface));--n1:color-mix(in srgb,var(--line-strong) 32%,var(--surface));--n2:color-mix(in srgb,var(--line-strong) 75%,var(--surface));--head:color-mix(in srgb,var(--lipid) 70%,var(--text));--tissue:color-mix(in srgb,#e8b4b0 30%,var(--surface-2));}
    text{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,sans-serif;font-size:14px;font-weight:600;fill:var(--text);}
    .m{font-weight:400;fill:var(--muted);}
    .lip{fill:var(--lipid);}
    .hd{fill:none;stroke:var(--head);stroke-width:7;stroke-linecap:round;stroke-dasharray:0 8;}
    .cT{fill:var(--t1);stroke:var(--track);stroke-width:2;}
    .cN{fill:var(--n1);stroke:var(--line-strong);stroke-width:2;}
    .nT{fill:var(--t2);}
    .nN{fill:var(--n2);}
    .glow{opacity:0;animation:glow 10s ease-in-out infinite;}
    @keyframes glow{0%,44%{opacity:0}56%,95%{opacity:1}100%{opacity:0}}
    .md{fill:color-mix(in srgb,var(--bad) 40%,var(--surface));stroke:var(--bad);stroke-width:2;stroke-linejoin:round;stroke-linecap:round;}
    .mdl{fill:none;stroke:var(--bad);stroke-width:2.5;stroke-linejoin:round;stroke-linecap:round;}
    .g0{animation:g0 10s ease-in-out infinite;}
    @keyframes g0{0%,28%{opacity:0;transform:translateX(16px)}34%,95%{opacity:1;transform:translateX(0)}100%{opacity:0;transform:translateX(0)}}
    .g1{animation:g1 10s ease-in-out infinite;}
    @keyframes g1{0%,32%{opacity:0;transform:translateX(16px)}38%,95%{opacity:1;transform:translateX(0)}100%{opacity:0;transform:translateX(0)}}
    .g2{animation:g2 10s ease-in-out infinite;}
    @keyframes g2{0%,36%{opacity:0;transform:translateX(16px)}42%,95%{opacity:1;transform:translateX(0)}100%{opacity:0;transform:translateX(0)}}
    .g3{animation:g3 10s ease-in-out infinite;}
    @keyframes g3{0%,40%{opacity:0;transform:translateX(16px)}46%,95%{opacity:1;transform:translateX(0)}100%{opacity:0;transform:translateX(0)}}
    .thr{animation:thr 10s ease-in-out infinite;}
    @keyframes thr{0%,44%{transform:translateY(0)}56%,95%{transform:translateY(18px)}100%{transform:translateY(0)}}
    .tr{fill:none;stroke:var(--track);stroke-width:2.5;stroke-linejoin:round;stroke-linecap:round;stroke-dasharray:1 1;}
    .b4{animation:b4 10s linear infinite;} .af{animation:af 10s linear infinite;}
    @keyframes b4{0%,4%{stroke-dashoffset:1;opacity:1}22%,56%{stroke-dashoffset:0;opacity:1}60%,100%{stroke-dashoffset:0;opacity:0}}
    @keyframes af{0%,58%{stroke-dashoffset:1;opacity:1}76%,95%{stroke-dashoffset:0;opacity:1}100%{stroke-dashoffset:0;opacity:0}}
    @media (prefers-reduced-motion:reduce){*{animation-delay:-8.6s!important;animation-play-state:paused!important;}}
