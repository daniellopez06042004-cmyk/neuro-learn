<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 300" role="img" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>Inflammatory mediators sensitize a nerve ending</title>
  <desc>A sensory nerve ending sits in inflamed tissue surrounded by mediators (protons, ATP, prostaglandins, cytokines). They act on the ending, its firing threshold drops, and it fires more action potentials to the same gentle stimulus.</desc>
  <style>
    svg{--text:#22221f;--muted:#5f5e5a;--line:#dcdad1;--line-strong:#b4b2a9;--surface:#ffffff;--surface-2:#efede6;--warn:#ba7517;--bad:#993c1d;--track:#D4537E;}
    @media (prefers-color-scheme:dark){svg{--text:#f1efe8;--muted:#b4b2a9;--line:#3a3a37;--line-strong:#5f5e5a;--surface:#22221f;--surface-2:#2c2c2a;--warn:#ef9f27;--bad:#f0997b;--track:#e67ba0;}}
    text{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,sans-serif;fill:var(--text);}
    .lbl{font-size:14px;font-weight:600;} .small{font-size:12px;font-weight:400;fill:var(--muted);}
    .axon{fill:none;stroke:var(--line-strong);stroke-width:3;stroke-linecap:round;}
    .end{fill:var(--surface-2);stroke:var(--track);stroke-width:2.5;}
    .med{fill:var(--warn);opacity:0;animation:med 6.5s ease-in-out infinite;}
    .thrBar{fill:var(--line-strong);animation:thr 6.5s ease-in-out infinite;transform-origin:center;}
    .spk{fill:none;stroke:var(--track);stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round;}
    .before{animation:before 6.5s ease-in-out infinite;}
    .after{opacity:0;animation:after 6.5s ease-in-out infinite;}
    @keyframes med{0%{opacity:0;transform:scale(.6)}20%,70%{opacity:1;transform:scale(1)}85%,100%{opacity:0}}
    @keyframes thr{0%,30%{transform:scaleY(1)}48%,100%{transform:scaleY(.5)}}
    @keyframes before{0%,34%{opacity:1}44%,100%{opacity:0}}
    @keyframes after{0%,44%{opacity:0}54%,100%{opacity:1}}
    @media (prefers-reduced-motion:reduce){
      .med{animation:none;opacity:1;transform:none}
      .thrBar{animation:none;transform:scaleY(.5)}
      .before{animation:none;opacity:0}
      .after{animation:none;opacity:1}
    }
  </style>

  <!-- nerve ending -->
  <path class="axon" d="M20 150 L116 150"/>
  <circle class="end" cx="134" cy="150" r="20"/>
  <text class="lbl" x="134" y="206" text-anchor="middle">nerve ending</text>

  <!-- mediators (the 'soup') in an arc above/right of the ending -->
  <g class="med"><circle cx="134" cy="104" r="8"/><text class="small" x="134" y="94" text-anchor="middle" style="fill:var(--warn)">H⁺</text></g>
  <g class="med"><circle cx="99" cy="120" r="8"/><text class="small" x="90" y="112" text-anchor="end" style="fill:var(--warn)">prostaglandins</text></g>
  <g class="med"><circle cx="172" cy="120" r="8"/><text class="small" x="184" y="116" style="fill:var(--warn)">ATP</text></g>
  <g class="med"><circle cx="184" cy="152" r="8"/><text class="small" x="196" y="156" style="fill:var(--warn)">cytokines</text></g>

  <!-- threshold meter -->
  <rect x="250" y="70" width="18" height="90" rx="5" fill="none" stroke="var(--line-strong)" stroke-width="1.5"/>
  <rect class="thrBar" x="251.5" y="71.5" width="15" height="87"/>
  <text class="small" x="259" y="64" text-anchor="middle">threshold</text>
  <text class="lbl" x="259" y="178" text-anchor="middle" style="fill:var(--track)">↓</text>

  <!-- firing: before (few spikes) vs after (many) -->
  <g class="before"><polyline class="spk" points="290,150 300,150 305,134 310,166 315,150 340,150"/></g>
  <g class="after"><polyline class="spk" points="286,150 292,150 296,132 300,168 304,150 308,132 312,168 316,150 320,132 324,168 328,150 340,150"/></g>
  <text class="lbl after" x="314" y="196" text-anchor="middle" style="fill:var(--track)">fires more</text>

  <text class="small" x="180" y="288" text-anchor="middle">same stimulus, lower threshold → more firing</text>
</svg>
