<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 380" role="img">
  <title>Referred pain: heart felt in the left arm</title>
  <desc>A heart afferent and a left-arm skin afferent, with their pseudounipolar cell bodies side by side in the same upper-thoracic (T1 to T4) DRG, both synapse onto one shared neuron in the dorsal horn. The heart afferent fires, the shared dorsal-horn neuron fires, its signal crosses the cord and ascends to the brain, and the left arm on the body outline glows as the place the pain is felt. The arm's own afferent stays quiet, and the heart itself is not where the pain is felt.</desc>
  <style>
    svg{--text:#22221f;--muted:#5f5e5a;--line:#dcdad1;--line-strong:#b4b2a9;--surface:#ffffff;--surface-2:#efede6;--ok:#0f6e56;--bad:#993c1d;--warn:#ba7517;--track:#7F77DD;}
    @media (prefers-color-scheme:dark){svg{--text:#f1efe8;--muted:#b4b2a9;--line:#3a3a37;--line-strong:#5f5e5a;--surface:#22221f;--surface-2:#2c2c2a;--ok:#5dcaa5;--bad:#f0997b;--warn:#ef9f27;--track:#a39df0;}}
    svg{--tissue:color-mix(in srgb,#e8b4b0 30%,var(--surface-2));--tissue-lo:color-mix(in srgb,#e8b4b0 16%,var(--surface-2));--tissue-hi:color-mix(in srgb,#e8b4b0 50%,var(--surface-2));--muscle:color-mix(in srgb,#e8b4b0 62%,var(--surface-2));--muscle-line:color-mix(in srgb,#e8b4b0 45%,var(--line-strong));--track-1:color-mix(in srgb,var(--track) 22%,var(--surface));--track-2:color-mix(in srgb,var(--track) 55%,var(--surface));--warn-1:color-mix(in srgb,var(--warn) 24%,var(--surface));--bad-1:color-mix(in srgb,var(--bad) 24%,var(--surface));--ok-1:color-mix(in srgb,var(--ok) 22%,var(--surface));--ok-2:color-mix(in srgb,var(--ok) 55%,var(--surface));--muted-1:color-mix(in srgb,var(--muted) 22%,var(--surface));--nuc:color-mix(in srgb,var(--muted) 55%,var(--surface-2));}
    text{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,sans-serif;fill:var(--text);}
    .lbl{font-size:15px;font-weight:600;}
    .key{font-size:16px;font-weight:700;}
    .body{fill:var(--tissue-lo);stroke:var(--line-strong);stroke-width:2;stroke-linejoin:round;}
    .heart{fill:var(--muscle);stroke:var(--muscle-line);stroke-width:2;stroke-linejoin:round;}
    .brain{fill:var(--tissue);stroke:var(--line-strong);stroke-width:2;stroke-linejoin:round;}
    .gyri{fill:none;stroke:var(--line-strong);stroke-width:1.5;stroke-linecap:round;}
    .cord{fill:var(--tissue-lo);stroke:var(--line-strong);stroke-width:2;}
    .gmo{fill:none;stroke:var(--line-strong);stroke-width:4;}
    .gm{fill:color-mix(in srgb,#e8b4b0 40%,var(--surface-2));}
    .drg{fill:var(--tissue);stroke:var(--line-strong);stroke-width:2;}
    .ax{fill:none;stroke:var(--track-2);stroke-width:3;stroke-linecap:round;stroke-linejoin:round;}
    .dot{fill:var(--track-2);}
    .soma{fill:var(--track-1);stroke:var(--track);stroke-width:2;}
    .somaN{fill:var(--track-2);}
    .lit{fill:none;stroke:var(--track);stroke-width:3.5;stroke-linecap:round;stroke-linejoin:round;}
    .glow{fill:none;stroke:var(--track);stroke-width:10;stroke-linecap:round;stroke-linejoin:round;stroke-opacity:.2;}
    .on{fill:var(--track);}
    .felt{fill:color-mix(in srgb,var(--bad) 38%,var(--surface));stroke:var(--bad);stroke-width:2;stroke-linejoin:round;}
    .ray{fill:none;stroke:var(--bad);stroke-width:2.5;stroke-linecap:round;}
    /* 10 s loop. Beat 1 (0.8-2.6 s): heart afferent fires into the cord. Beat 2 (2.6-3.8 s): the shared dorsal-horn
       neuron fires. Beat 3 (3.8-5.4 s): the signal crosses and ascends; the brain lights. Beat 4 (5.4-6.6 s): the left
       arm glows, "felt here". Hold to 9.2 s. The arm's own afferent never fires. */
    .endA{opacity:0;animation:endA 10s ease-in-out infinite;}
    .trA{stroke-dasharray:100 100;stroke-dashoffset:100;animation:trA 10s ease-in-out infinite;}
    .somaA{opacity:0;animation:somaA 10s ease-in-out infinite;}
    .dh{opacity:0;animation:dh 10s ease-in-out infinite;}
    .ring{fill:none;stroke:var(--track);stroke-width:2;opacity:0;transform-box:fill-box;transform-origin:center;animation:ring 10s ease-out infinite;}
    .trU{stroke-dasharray:100 100;stroke-dashoffset:100;animation:trU 10s ease-in-out infinite;}
    .brainOn{fill:var(--track);opacity:0;animation:brainOn 10s ease-in-out infinite;}
    .arm{opacity:0;animation:arm 10s ease-in-out infinite;}
    @keyframes endA{0%,6%{opacity:0}10%,92%{opacity:1}98%,100%{opacity:0}}
    @keyframes trA{0%,8%{stroke-dashoffset:100;opacity:1}26%,92%{stroke-dashoffset:0;opacity:1}98%{stroke-dashoffset:0;opacity:0}100%{stroke-dashoffset:100;opacity:0}}
    @keyframes somaA{0%,15%{opacity:0}20%{opacity:.6}26%,92%{opacity:.35}98%,100%{opacity:0}}
    @keyframes dh{0%,26%{opacity:0}30%,92%{opacity:1}98%,100%{opacity:0}}
    @keyframes ring{0%,28%{opacity:0;transform:scale(1)}30%{opacity:.9;transform:scale(1)}38%,100%{opacity:0;transform:scale(2.4)}}
    @keyframes trU{0%,38%{stroke-dashoffset:100;opacity:1}54%,92%{stroke-dashoffset:0;opacity:1}98%{stroke-dashoffset:0;opacity:0}100%{stroke-dashoffset:100;opacity:0}}
    @keyframes brainOn{0%,50%{opacity:0}56%,92%{opacity:.32}98%,100%{opacity:0}}
    @keyframes arm{0%,54%{opacity:0}66%,92%{opacity:1}98%,100%{opacity:0}}
    @media (prefers-reduced-motion:reduce){
      .endA,.dh,.arm{animation:none;opacity:1}
      .somaA{animation:none;opacity:.35}
      .ring{animation:none;opacity:0}
      .trA,.trU{animation:none;stroke-dashoffset:0;opacity:1}
      .brainOn{animation:none;opacity:.32}
    }
  </style>
  <path class="brain" d="M94 70 C97 78 97 84 95 92 H107 C106 84 107 78 110 70 Z"/>
