<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 300" role="img" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>CreER and tamoxifen</title>
  <desc>CreER sits inert in the cytoplasm. Tamoxifen binds it, the CreER–tamoxifen complex enters the nucleus, the STOP is cut out of the DNA, and the reporter turns on.</desc>
  <style>
    svg{--text:#22221f;--muted:#5f5e5a;--line:#dcdad1;--line-strong:#b4b2a9;--surface:#ffffff;--surface-2:#efede6;--bad:#993c1d;--warn:#ba7517;--track:#5B8DEF;}
    @media (prefers-color-scheme:dark){svg{--text:#f1efe8;--muted:#b4b2a9;--line:#3a3a37;--line-strong:#5f5e5a;--surface:#22221f;--surface-2:#2c2c2a;--bad:#f0997b;--warn:#ef9f27;--track:#7ea6f5;}}
    text{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,sans-serif;fill:var(--text);}
    .lbl{font-size:15px;font-weight:600;}
    .small{font-size:14px;font-weight:400;fill:var(--muted);}
    .cyto{fill:var(--surface-2);stroke:var(--line-strong);stroke-width:2;}
    .nuc{fill:var(--surface);stroke:var(--line-strong);stroke-width:2;}
    .dna{stroke:var(--line-strong);stroke-width:2.5;}
    .creer{animation:move 6s ease-in-out infinite;}
    .tam{animation:tam 6s ease-in-out infinite;}
    .stop{fill:var(--bad);animation:excise 6s ease-in-out infinite;}
    .repOn{animation:on 6s ease-in-out infinite;opacity:0;}
    .stOff{animation:stoff 6s ease-in-out infinite;}
    .stOn{opacity:0;animation:ston 6s ease-in-out infinite;}
    /* tamoxifen binds first, then the complex moves up-right into the nucleus, above the DNA */
    @keyframes tam{0%,6%{opacity:0;transform:translateY(-24px)}20%,100%{opacity:1;transform:translateY(0)}}
    @keyframes move{0%,24%{transform:translate(0,0)}48%,100%{transform:translate(120px,-30px)}}
    @keyframes excise{0%,50%{opacity:1;transform:translateY(0)}62%,100%{opacity:0;transform:translateY(22px)}}
    @keyframes on{0%,62%{opacity:0}74%,100%{opacity:1}}
    @keyframes stoff{0%,50%{opacity:1}58%,100%{opacity:0}}
    @keyframes ston{0%,62%{opacity:0}72%,100%{opacity:1}}
    @media (prefers-reduced-motion:reduce){
      .creer{animation:none;transform:translate(120px,-30px)}
      .tam{animation:none;opacity:1;transform:none}
      .stop{animation:none;opacity:0}
      .repOn{animation:none;opacity:1}
      .stOff{animation:none;opacity:0}
      .stOn{animation:none;opacity:1}
    }
  </style>

  <!-- cytoplasm -->
  <rect class="cyto" x="14" y="14" width="332" height="250" rx="30"/>
  <text class="small" x="34" y="248">cytoplasm</text>

  <!-- nucleus -->
  <circle class="nuc" cx="240" cy="140" r="88"/>
  <text class="small" x="240" y="214" text-anchor="middle">nucleus</text>

  <!-- DNA with STOP and reporter -->
  <line class="dna" x1="182" y1="156" x2="304" y2="156"/>
  <g class="stop"><rect x="206" y="144" width="34" height="24" rx="5"/></g>
  <rect x="248" y="144" width="50" height="24" rx="5" fill="var(--surface-2)" stroke="var(--line-strong)" stroke-width="1.5"/>
  <g class="repOn">
    <rect x="248" y="144" width="50" height="24" rx="5" fill="var(--track)"/>
    <text x="273" y="161" text-anchor="middle" font-size="14" font-weight="700" style="fill:#ffffff">ON</text>
  </g>
  <text class="small" x="273" y="188" text-anchor="middle">reporter</text>

  <!-- CreER + bound tamoxifen (move together into the nucleus) -->
  <g class="creer">
    <rect x="66" y="128" width="62" height="26" rx="13" fill="var(--track)"/>
    <text x="97" y="146" text-anchor="middle" font-size="14" font-weight="600" style="fill:#ffffff">CreER</text>
    <g transform="translate(130,128)">
      <g class="tam">
        <polygon points="0,-12 10,-6 10,6 0,12 -10,6 -10,-6" fill="var(--warn)" stroke="var(--surface)" stroke-width="1.5"/>
        <text class="lbl" x="0" y="-20" text-anchor="middle" style="fill:var(--warn)">tamoxifen</text>
      </g>
    </g>
  </g>

  <!-- state labels -->
  <g class="stOff"><text class="lbl" x="180" y="290" text-anchor="middle" style="fill:var(--muted)">− tamoxifen: off</text></g>
  <g class="stOn"><text class="lbl" x="180" y="290" text-anchor="middle" style="fill:var(--track)">+ tamoxifen: on</text></g>
</svg>
