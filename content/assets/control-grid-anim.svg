<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 360" role="img"
     aria-label="A 2x2 control grid of neurons. When the actuator is applied, only the DREADD-positive, actuator-positive neuron pulses green; the three control neurons stay silent." xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <style>
    .bg{fill:#f5f7fb}.ink{fill:#131722}.muted{fill:#5b6472}
    .q{fill:#eef2fb;stroke:#d7deec}.hd{font:700 13px -apple-system,sans-serif}
    .soma{fill:#dbe6f7;stroke:#8aa0c8}.den{stroke:#8aa0c8;fill:none;stroke-linecap:round}.axon{stroke:#8aa0c8;fill:none;stroke-linecap:round}
    .nuc{fill:#8fb0e6}.bouton{fill:#8aa0c8}.greenP{fill:#2fd08a}.ring{fill:none;stroke:#2fd08a}.drug{fill:#f0a83a;stroke:#c9881f}
    .label{font:600 15px -apple-system,sans-serif}.sub{font:400 12px -apple-system,sans-serif}.tag{font:700 12px -apple-system,sans-serif}
    @media (prefers-color-scheme:dark){.bg{fill:#0f1420}.ink{fill:#eef1f7}.muted{fill:#9aa4b5}.q{fill:#161d2c;stroke:#283040}
      .soma{fill:#223052;stroke:#4a5f8a}.den{stroke:#4a5f8a}.axon{stroke:#4a5f8a}.nuc{fill:#3f63a8}.bouton{fill:#4a5f8a}}
    .applied{animation:ap 4.5s ease-in-out infinite}@keyframes ap{0%{opacity:0}18%{opacity:1}34%{opacity:1}44%,100%{opacity:0}}
    .onB{transform-box:fill-box;transform-origin:center;animation:ob 4.5s ease-in-out infinite}
    @keyframes ob{0%,46%{transform:scale(1)}56%{transform:scale(1.14)}66%{transform:scale(1)}78%{transform:scale(1.1)}100%{transform:scale(1)}}
    .onT{animation:ot 4.5s ease-in-out infinite}@keyframes ot{0%,46%{opacity:0}58%{opacity:.88}72%{opacity:.4}100%{opacity:.5}}
    .onR{transform-box:fill-box;transform-origin:center;animation:orr 4.5s ease-out infinite}@keyframes orr{0%,46%{transform:scale(.5);opacity:0}52%{opacity:.5}80%{opacity:0}100%{transform:scale(2);opacity:0}}
    .check{animation:ck 4.5s ease-in-out infinite;transform-box:fill-box;transform-origin:center}@keyframes ck{0%,52%{opacity:0;transform:scale(.5)}64%{opacity:1;transform:scale(1)}100%{opacity:1}}
    .goodbox{animation:gb 4.5s ease-in-out infinite}@keyframes gb{0%,52%{opacity:0}66%{opacity:1}100%{opacity:1}}
  </style>
  <rect class="bg" x="0" y="0" width="820" height="360" rx="18"/>
  <text class="label ink" x="320" y="30" text-anchor="middle">Apply the actuator — only one quadrant responds</text>

  <text class="hd ink" x="300" y="64" text-anchor="middle">actuator +</text><text class="hd ink" x="520" y="64" text-anchor="middle">vehicle</text>
  <text class="hd ink" x="118" y="150" text-anchor="middle">DREADD +</text><text class="hd ink" x="118" y="270" text-anchor="middle">DREADD −</text>

  <rect class="q" x="205" y="86" width="190" height="110" rx="12"/>
  <rect class="q" x="425" y="86" width="190" height="110" rx="12"/>
  <rect class="q" x="205" y="206" width="190" height="110" rx="12"/>
  <rect class="q" x="425" y="206" width="190" height="110" rx="12"/>

  <!-- compact neuron macro repeated; off ones static -->
  <!-- experimental (DREADD+/act+) : pulses green -->
  <g transform="translate(300,133) scale(0.5)">
    <g class="den" stroke-width="3"><path d="M-3,-18 C -8,-32 -18,-40 -26,-50"/><path d="M4,-18 C 10,-32 20,-38 30,-48"/><path d="M-14,-10 C -28,-16 -40,-18 -52,-20"/><path d="M12,-10 C 26,-16 38,-18 50,-20"/><path d="M0,-20 C -1,-34 1,-44 0,-56"/></g>
    <path class="axon" d="M0,20 C 2,40 -2,56 0,70" stroke-width="4"/>
    <circle class="bouton" cx="0" cy="74" r="4"/>
    <circle class="ring onR" cx="0" cy="0" r="24" stroke-width="3"/>
    <g class="onB"><path class="soma" d="M-22,-3 C -25,-16 -14,-25 -1,-24 C 11,-23 24,-17 23,-3 C 22,8 17,22 3,23 C -10,24 -22,12 -22,-3 Z"/>
      <path class="greenP onT" d="M-22,-3 C -25,-16 -14,-25 -1,-24 C 11,-23 24,-17 23,-3 C 22,8 17,22 3,23 C -10,24 -22,12 -22,-3 Z"/>
      <ellipse class="nuc" cx="0" cy="-1" rx="10" ry="8"/></g>
  </g>
  <g class="check" transform="translate(300,133)"><text class="tag" x="0" y="4" text-anchor="middle" fill="#1f9d61" font-size="18">✓</text></g>
  <text class="sub muted" x="300" y="186" text-anchor="middle">experimental</text>

  <!-- the three controls: static grey neuron -->
  <g transform="translate(520,133) scale(0.5)" opacity="0.7">
    <g class="den" stroke-width="3"><path d="M-3,-18 C -8,-32 -18,-40 -26,-50"/><path d="M4,-18 C 10,-32 20,-38 30,-48"/><path d="M-14,-10 C -28,-16 -40,-18 -52,-20"/><path d="M12,-10 C 26,-16 38,-18 50,-20"/><path d="M0,-20 C -1,-34 1,-44 0,-56"/></g>
    <path class="axon" d="M0,20 C 2,40 -2,56 0,70" stroke-width="4"/><circle class="bouton" cx="0" cy="74" r="4"/>
    <path class="soma" d="M-22,-3 C -25,-16 -14,-25 -1,-24 C 11,-23 24,-17 23,-3 C 22,8 17,22 3,23 C -10,24 -22,12 -22,-3 Z"/><ellipse class="nuc" cx="0" cy="-1" rx="10" ry="8"/>
  </g>
  <text class="sub muted" x="520" y="186" text-anchor="middle">leak control</text>

  <g transform="translate(300,253) scale(0.5)" opacity="0.7">
    <g class="den" stroke-width="3"><path d="M-3,-18 C -8,-32 -18,-40 -26,-50"/><path d="M4,-18 C 10,-32 20,-38 30,-48"/><path d="M-14,-10 C -28,-16 -40,-18 -52,-20"/><path d="M12,-10 C 26,-16 38,-18 50,-20"/><path d="M0,-20 C -1,-34 1,-44 0,-56"/></g>
    <path class="axon" d="M0,20 C 2,40 -2,56 0,70" stroke-width="4"/><circle class="bouton" cx="0" cy="74" r="4"/>
    <path class="soma" d="M-22,-3 C -25,-16 -14,-25 -1,-24 C 11,-23 24,-17 23,-3 C 22,8 17,22 3,23 C -10,24 -22,12 -22,-3 Z"/><ellipse class="nuc" cx="0" cy="-1" rx="10" ry="8"/>
  </g>
  <text class="sub muted" x="300" y="306" text-anchor="middle">actuator control</text>

  <g transform="translate(520,253) scale(0.5)" opacity="0.7">
    <g class="den" stroke-width="3"><path d="M-3,-18 C -8,-32 -18,-40 -26,-50"/><path d="M4,-18 C 10,-32 20,-38 30,-48"/><path d="M-14,-10 C -28,-16 -40,-18 -52,-20"/><path d="M12,-10 C 26,-16 38,-18 50,-20"/><path d="M0,-20 C -1,-34 1,-44 0,-56"/></g>
    <path class="axon" d="M0,20 C 2,40 -2,56 0,70" stroke-width="4"/><circle class="bouton" cx="0" cy="74" r="4"/>
    <path class="soma" d="M-22,-3 C -25,-16 -14,-25 -1,-24 C 11,-23 24,-17 23,-3 C 22,8 17,22 3,23 C -10,24 -22,12 -22,-3 Z"/><ellipse class="nuc" cx="0" cy="-1" rx="10" ry="8"/>
  </g>
  <text class="sub muted" x="520" y="306" text-anchor="middle">baseline</text>

  <!-- drug droplets on the actuator+ column -->
  <g class="applied"><polygon class="drug" points="300,72 307,78 307,87 300,93 293,87 293,78" stroke-width="1.5"/></g>
  <g class="applied"><polygon class="drug" points="300,192 307,198 307,207 300,213 293,207 293,198" stroke-width="1.5"/></g>

  <g class="goodbox"><rect x="636" y="120" width="160" height="56" rx="12" fill="#2fd08a"/><text class="tag" x="716" y="145" text-anchor="middle" fill="#fff">interpretable</text><text class="tag" x="716" y="163" text-anchor="middle" fill="#fff">✓ your neurons</text></g>
</svg>
