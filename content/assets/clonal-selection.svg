<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 270" role="img">
  <title>Clonal selection and memory</title>
  <desc>A row of lymphocytes each carries a differently shaped receptor. An antigen fits only one of them; that cell is selected and multiplies into identical effector cells plus a long-lived memory cell (dashed, with a star), while the non-matching cells stay quiet.</desc>
  <style>
    :root,svg{--text:#22221f;--muted:#5f5e5a;--line:#dcdad1;--line-strong:#b4b2a9;--surface:#ffffff;--surface-2:#efede6;--ok:#0f6e56;--bad:#993c1d;--warn:#ba7517;--track:#D4537E;--lipid:#e8d9c4;}
    @media (prefers-color-scheme:dark){:root,svg{--text:#f1efe8;--muted:#b4b2a9;--line:#3a3a37;--line-strong:#5f5e5a;--surface:#22221f;--surface-2:#2c2c2a;--ok:#5dcaa5;--bad:#f0997b;--warn:#ef9f27;--track:#e67ba0;--lipid:#4a4237;}}
    svg{--t1:color-mix(in srgb,var(--track) 22%,var(--surface));--t2:color-mix(in srgb,var(--track) 50%,var(--surface));--t0:color-mix(in srgb,var(--track) 9%,var(--surface));--w1:color-mix(in srgb,var(--warn) 24%,var(--surface));--b1:color-mix(in srgb,var(--bad) 22%,var(--surface));--ok1:color-mix(in srgb,var(--ok) 22%,var(--surface));--n1:color-mix(in srgb,var(--line-strong) 32%,var(--surface));--n2:color-mix(in srgb,var(--line-strong) 75%,var(--surface));--head:color-mix(in srgb,var(--lipid) 70%,var(--text));--tissue:color-mix(in srgb,#e8b4b0 30%,var(--surface-2));}
    text{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,sans-serif;font-size:14px;font-weight:600;fill:var(--text);}
    .m{font-weight:400;fill:var(--muted);}
    .lip{fill:var(--lipid);}
    .hd{fill:none;stroke:var(--head);stroke-width:7;stroke-linecap:round;stroke-dasharray:0 8;}
    .cT{fill:var(--t1);stroke:var(--track);stroke-width:2;}
    .cN{fill:var(--n1);stroke:var(--line-strong);stroke-width:2;}
    .nT{fill:var(--t2);}
    .nN{fill:var(--n2);}
    .rc{fill:var(--n2);stroke:var(--line-strong);stroke-width:2;stroke-linejoin:round;}
    .rcT{fill:var(--track);stroke:var(--track);stroke-width:2;stroke-linejoin:round;}
    .ag{fill:var(--warn);stroke:var(--warn);stroke-width:2;stroke-linejoin:round;}
    .quiet{animation:quiet 9s ease-in-out infinite;}
    @keyframes quiet{0%,26%{opacity:1}40%,95%{opacity:.45}100%{opacity:1}}
    .sel{opacity:0;animation:sel 9s ease-in-out infinite;}
    @keyframes sel{0%,26%{opacity:0}40%,95%{opacity:1}100%{opacity:0}}
    .agm{animation:agm 9s ease-in-out infinite;}
    @keyframes agm{0%,8%{opacity:0;transform:translateY(-22px)}12%{opacity:1;transform:translateY(-22px)}24%,95%{opacity:1;transform:translateY(0)}100%{opacity:0;transform:translateY(0)}}
    @keyframes c0{0%,40%{opacity:0;transform:translate(140px,-112px) scale(.35)}42%{opacity:1}52%,95%{opacity:1;transform:translate(0,0) scale(1)}100%{opacity:0;transform:translate(0,0) scale(1)}}
    .c0{animation:c0 9s ease-in-out infinite;}
    @keyframes c1{0%,44%{opacity:0;transform:translate(82px,-112px) scale(.35)}46%{opacity:1}56%,95%{opacity:1;transform:translate(0,0) scale(1)}100%{opacity:0;transform:translate(0,0) scale(1)}}
    .c1{animation:c1 9s ease-in-out infinite;}
    @keyframes c2{0%,48%{opacity:0;transform:translate(24px,-112px) scale(.35)}50%{opacity:1}60%,95%{opacity:1;transform:translate(0,0) scale(1)}100%{opacity:0;transform:translate(0,0) scale(1)}}
    .c2{animation:c2 9s ease-in-out infinite;}
    @keyframes c3{0%,52%{opacity:0;transform:translate(-34px,-112px) scale(.35)}54%{opacity:1}64%,95%{opacity:1;transform:translate(0,0) scale(1)}100%{opacity:0;transform:translate(0,0) scale(1)}}
    .c3{animation:c3 9s ease-in-out infinite;}
    @keyframes mem{0%,60%{opacity:0;transform:translate(-120px,-112px) scale(.35)}62%{opacity:1}72%,95%{opacity:1;transform:translate(0,0) scale(1)}100%{opacity:0;transform:translate(0,0) scale(1)}}
    .mem{animation:mem 9s ease-in-out infinite;}
    .lab1{opacity:0;animation:lab1 9s ease-in-out infinite;} .lab2{opacity:0;animation:lab2 9s ease-in-out infinite;}
    @keyframes lab1{0%,54%{opacity:0}60%,95%{opacity:1}100%{opacity:0}}
    @keyframes lab2{0%,66%{opacity:0}72%,95%{opacity:1}100%{opacity:0}}
    @media (prefers-reduced-motion:reduce){*{animation-delay:-7.8s!important;animation-play-state:paused!important;}}
  </style>
  <!-- a repertoire of lymphocytes, each with a differently shaped receptor -->
