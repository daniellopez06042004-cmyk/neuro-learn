<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 360" role="img"
     aria-label="Three neurons: Cre-only and Flp-only stay dim and off; the neuron with both Cre and Flp pulses green, expressing its payload." xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <style>
    .bg{fill:#f5f7fb}.ink{fill:#131722}.muted{fill:#5b6472}
    .soma{fill:#dbe6f7;stroke:#8aa0c8}.den{stroke:#8aa0c8;fill:none;stroke-linecap:round}.axon{stroke:#8aa0c8;fill:none;stroke-linecap:round}
    .nuc{fill:#8fb0e6}.bouton{fill:#8aa0c8}
    .greenP{fill:#2fd08a}.ring{fill:none;stroke:#2fd08a}
    .cre{fill:#5B8DEF}.flp{fill:#b06ad6}.dimmed{opacity:.4}
    .label{font:600 16px -apple-system,sans-serif}.sub{font:400 13px -apple-system,sans-serif}.tag{font:700 12px -apple-system,sans-serif}
    @media (prefers-color-scheme:dark){.bg{fill:#0f1420}.ink{fill:#eef1f7}.muted{fill:#9aa4b5}
      .soma{fill:#223052;stroke:#4a5f8a}.den{stroke:#4a5f8a}.axon{stroke:#4a5f8a}.nuc{fill:#3f63a8}.bouton{fill:#4a5f8a}.cre{fill:#6f9bff}.flp{fill:#c084e0}}
    .pulse{transform-box:fill-box;transform-origin:center;animation:breathe 1.6s ease-in-out infinite}
    @keyframes breathe{0%{transform:scale(1)}50%{transform:scale(1.12)}100%{transform:scale(1)}}
    .tint{animation:tint 1.6s ease-in-out infinite}@keyframes tint{0%{opacity:.18}50%{opacity:.9}100%{opacity:.18}}
    .r1{transform-box:fill-box;transform-origin:center;animation:ring 1.6s ease-out infinite}
    .r2{transform-box:fill-box;transform-origin:center;animation:ring 1.6s ease-out infinite;animation-delay:.55s}
    @keyframes ring{0%{transform:scale(.5);opacity:.5}80%{opacity:0}100%{transform:scale(2);opacity:0}}
    .x{animation:xf 1.6s ease-in-out infinite}@keyframes xf{0%,25%{opacity:0}45%{opacity:1}100%{opacity:1}}
  </style>
  <rect class="bg" x="0" y="0" width="820" height="360" rx="18"/>
  <text class="label ink" x="410" y="36" text-anchor="middle">Only Cre AND Flp switches the payload on</text>

  <!-- compact neuron, reused; defined relative to its own origin -->
  <!-- LEFT: Cre only (off) -->
  <g transform="translate(150,175)">
    <g class="dimmed" transform="scale(0.85)">
      <g class="den" stroke-width="3"><path d="M-3,-18 C -8,-32 -18,-40 -26,-50"/><path d="M4,-18 C 10,-32 20,-38 30,-48"/><path d="M-14,-10 C -28,-16 -38,-18 -50,-20"/><path d="M12,-10 C 26,-16 36,-18 48,-20"/><path d="M0,-20 C -1,-34 1,-44 0,-56"/></g>
      <path class="axon" d="M0,20 C 1,40 -1,56 0,72" stroke-width="4"/>
      <g class="axon" stroke-width="3"><path d="M0,72 C -6,82 -12,86 -18,92"/><path d="M0,72 C 1,84 1,90 1,96"/><path d="M0,72 C 6,82 12,86 18,92"/></g>
      <circle class="bouton" cx="-18" cy="92" r="3.5"/><circle class="bouton" cx="1" cy="96" r="3.5"/><circle class="bouton" cx="18" cy="92" r="3.5"/>
      <path class="soma" d="M-20,-3 C -23,-15 -13,-23 -1,-22 C 10,-21 22,-16 21,-3 C 20,7 16,20 3,21 C -9,22 -20,11 -20,-3 Z"/>
      <ellipse class="nuc" cx="0" cy="-1" rx="9" ry="7"/>
    </g>
    <circle class="cre" cx="-14" cy="-48" r="12"/><text class="tag" x="-14" y="-44" text-anchor="middle" fill="#fff">Cre</text>
    <text class="x" x="0" y="6" text-anchor="middle" font-size="34" fill="#d6455b">✕</text>
    <text class="label ink" x="0" y="126" text-anchor="middle">Cre only</text><text class="sub muted" x="0" y="146" text-anchor="middle">off</text>
  </g>

  <!-- MIDDLE: Cre + Flp (ON, pulsing green) -->
  <g transform="translate(410,175)">
    <g transform="scale(0.92)">
      <g class="den" stroke-width="3"><path d="M-3,-18 C -8,-32 -18,-40 -26,-50"/><path d="M4,-18 C 10,-32 20,-38 30,-48"/><path d="M-14,-10 C -28,-16 -38,-18 -50,-20"/><path d="M12,-10 C 26,-16 36,-18 48,-20"/><path d="M0,-20 C -1,-34 1,-44 0,-56"/></g>
      <path class="axon" d="M0,20 C 1,40 -1,56 0,72" stroke-width="4"/>
      <g class="axon" stroke-width="3"><path d="M0,72 C -6,82 -12,86 -18,92"/><path d="M0,72 C 1,84 1,90 1,96"/><path d="M0,72 C 6,82 12,86 18,92"/></g>
      <circle class="bouton" cx="-18" cy="92" r="3.5"/><circle class="bouton" cx="1" cy="96" r="3.5"/><circle class="bouton" cx="18" cy="92" r="3.5"/>
      <circle class="ring r1" cx="0" cy="0" r="22" stroke-width="3"/><circle class="ring r2" cx="0" cy="0" r="22" stroke-width="3"/>
      <g class="pulse">
        <path class="soma" d="M-20,-3 C -23,-15 -13,-23 -1,-22 C 10,-21 22,-16 21,-3 C 20,7 16,20 3,21 C -9,22 -20,11 -20,-3 Z"/>
        <path class="greenP tint" d="M-20,-3 C -23,-15 -13,-23 -1,-22 C 10,-21 22,-16 21,-3 C 20,7 16,20 3,21 C -9,22 -20,11 -20,-3 Z"/>
        <ellipse class="nuc" cx="0" cy="-1" rx="9" ry="7"/>
      </g>
    </g>
    <circle class="cre" cx="-18" cy="-50" r="12"/><text class="tag" x="-18" y="-46" text-anchor="middle" fill="#fff">Cre</text>
    <circle class="flp" cx="16" cy="-50" r="12"/><text class="tag" x="16" y="-46" text-anchor="middle" fill="#fff">Flp</text>
    <text class="label ink" x="0" y="130" text-anchor="middle">Cre + Flp</text><text class="sub muted" x="0" y="150" text-anchor="middle">payload expressed</text>
  </g>

  <!-- RIGHT: Flp only (off) -->
  <g transform="translate(670,175)">
    <g class="dimmed" transform="scale(0.85)">
      <g class="den" stroke-width="3"><path d="M-3,-18 C -8,-32 -18,-40 -26,-50"/><path d="M4,-18 C 10,-32 20,-38 30,-48"/><path d="M-14,-10 C -28,-16 -38,-18 -50,-20"/><path d="M12,-10 C 26,-16 36,-18 48,-20"/><path d="M0,-20 C -1,-34 1,-44 0,-56"/></g>
      <path class="axon" d="M0,20 C 1,40 -1,56 0,72" stroke-width="4"/>
      <g class="axon" stroke-width="3"><path d="M0,72 C -6,82 -12,86 -18,92"/><path d="M0,72 C 1,84 1,90 1,96"/><path d="M0,72 C 6,82 12,86 18,92"/></g>
      <circle class="bouton" cx="-18" cy="92" r="3.5"/><circle class="bouton" cx="1" cy="96" r="3.5"/><circle class="bouton" cx="18" cy="92" r="3.5"/>
      <path class="soma" d="M-20,-3 C -23,-15 -13,-23 -1,-22 C 10,-21 22,-16 21,-3 C 20,7 16,20 3,21 C -9,22 -20,11 -20,-3 Z"/>
      <ellipse class="nuc" cx="0" cy="-1" rx="9" ry="7"/>
    </g>
    <circle class="flp" cx="-14" cy="-48" r="12"/><text class="tag" x="-14" y="-44" text-anchor="middle" fill="#fff">Flp</text>
    <text class="x" x="0" y="6" text-anchor="middle" font-size="34" fill="#d6455b">✕</text>
    <text class="label ink" x="0" y="126" text-anchor="middle">Flp only</text><text class="sub muted" x="0" y="146" text-anchor="middle">off</text>
  </g>
</svg>
