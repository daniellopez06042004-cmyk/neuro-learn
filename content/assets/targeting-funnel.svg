<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 320" role="img" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>Targeting specificity funnel</title>
  <desc>A crowd of cells narrows through three filters — retrograde route, Cre-dependent switch, and a subtype Cre line — leaving a few target cells.</desc>
  <style>
    svg{--text:#22221f;--muted:#5f5e5a;--line:#dcdad1;--line-strong:#b4b2a9;--surface-2:#efede6;--ok:#0f6e56;--track:#5B8DEF;}
    @media (prefers-color-scheme:dark){svg{--text:#f1efe8;--muted:#b4b2a9;--line:#3a3a37;--line-strong:#5f5e5a;--surface-2:#2c2c2a;--ok:#5dcaa5;--track:#7ea6f5;}}
    text{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,sans-serif;fill:var(--text);}
    .flt{font-size:14px;font-weight:600;} .cnt{font-size:14px;font-weight:700;fill:var(--muted);}
    .dot{fill:var(--surface-2);stroke:var(--line-strong);stroke-width:1.5;}
    .win{fill:var(--track);stroke:#1a4fa0;stroke-width:1;}
    .band{fill:none;stroke:var(--line);stroke-width:1;stroke-dasharray:4 4;}
    .funnel{fill:none;stroke:var(--line-strong);stroke-width:1.5;}
    .tgt{animation:p 4.5s ease-in-out infinite;transform-origin:center;}
    @keyframes p{0%,100%{opacity:.85}50%{opacity:1}}
    @media (prefers-reduced-motion:reduce){.tgt{animation:none}}
  </style>

  <!-- funnel outline -->
  <path class="funnel" d="M24 40 L336 40 L228 296 L132 296 Z"/>

  <!-- Row A: 24 dots -->
  <g class="dot"><circle cx="44" cy="54" r="6"/><circle cx="70" cy="54" r="6"/><circle cx="96" cy="54" r="6"/><circle cx="122" cy="54" r="6"/><circle cx="148" cy="54" r="6"/><circle cx="174" cy="54" r="6"/><circle cx="200" cy="54" r="6"/><circle cx="226" cy="54" r="6"/><circle cx="252" cy="54" r="6"/><circle cx="278" cy="54" r="6"/><circle cx="304" cy="54" r="6"/><circle cx="316" cy="72" r="6"/><circle cx="44" cy="72" r="6"/><circle cx="70" cy="72" r="6"/><circle cx="96" cy="72" r="6"/><circle cx="122" cy="72" r="6"/><circle cx="148" cy="72" r="6"/><circle cx="174" cy="72" r="6"/><circle cx="200" cy="72" r="6"/><circle cx="226" cy="72" r="6"/><circle cx="252" cy="72" r="6"/><circle cx="278" cy="72" r="6"/><circle cx="304" cy="72" r="6"/><circle cx="56" cy="72" r="6"/></g>
  <text class="cnt" x="330" y="46" text-anchor="end">24</text>

  <!-- filter 1 -->
  <line class="band" x1="40" y1="96" x2="320" y2="96"/>
  <text class="flt" x="180" y="114" text-anchor="middle">retrograde · pancreas-projecting</text>

  <!-- Row B: 12 -->
  <g class="dot"><circle cx="84" cy="138" r="6"/><circle cx="110" cy="138" r="6"/><circle cx="136" cy="138" r="6"/><circle cx="162" cy="138" r="6"/><circle cx="188" cy="138" r="6"/><circle cx="214" cy="138" r="6"/><circle cx="240" cy="138" r="6"/><circle cx="266" cy="138" r="6"/><circle cx="110" cy="156" r="6"/><circle cx="136" cy="156" r="6"/><circle cx="162" cy="156" r="6"/><circle cx="188" cy="156" r="6"/></g>
  <text class="cnt" x="300" y="146" text-anchor="end">12</text>

  <!-- filter 2 -->
  <line class="band" x1="64" y1="178" x2="296" y2="178"/>
  <text class="flt" x="180" y="196" text-anchor="middle">DIO · Cre+ only</text>

  <!-- Row C: 5 -->
  <g class="dot"><circle cx="138" cy="220" r="6"/><circle cx="164" cy="220" r="6"/><circle cx="190" cy="220" r="6"/><circle cx="216" cy="220" r="6"/><circle cx="177" cy="238" r="6"/></g>
  <text class="cnt" x="280" y="226" text-anchor="end">5</text>

  <!-- filter 3 -->
  <line class="band" x1="96" y1="258" x2="264" y2="258"/>
  <text class="flt" x="180" y="276" text-anchor="middle">subtype Cre line</text>

  <!-- Row D: 2 target -->
  <g class="tgt"><circle class="win" cx="168" cy="300" r="7"/><circle class="win" cx="192" cy="300" r="7"/></g>
  <text class="cnt" x="252" y="306" text-anchor="end" fill="var(--ok)">✓ 2</text>
</svg>
