<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 310" role="img" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>A Cre line marks a lineage, not just current expression</title>
  <desc>Developing DRG neurons that express Trpv1 are permanently marked by Trpv1-Cre (a reporter star). In the adult, some of those neurons no longer express TRPV1, yet they keep the reporter, so more neurons are reporter-positive than are TRPV1-positive now.</desc>
  <style>
    svg{--text:#22221f;--muted:#5f5e5a;--line:#dcdad1;--line-strong:#b4b2a9;--surface:#ffffff;--surface-2:#efede6;--warn:#ba7517;--track:#1D9E75;}
    @media (prefers-color-scheme:dark){svg{--text:#f1efe8;--muted:#b4b2a9;--line:#3a3a37;--line-strong:#5f5e5a;--surface:#22221f;--surface-2:#2c2c2a;--warn:#ef9f27;--track:#32c48f;}}
    text{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,sans-serif;fill:var(--text);}
    .lbl{font-size:14px;font-weight:600;} .small{font-size:12px;font-weight:400;fill:var(--muted);}
    .onN{fill:var(--track);stroke:var(--track);stroke-width:2;}
    .offN{fill:var(--surface-2);stroke:var(--line-strong);stroke-width:2;}
    .star{font-size:16px;font-weight:800;}
    .col{fill:none;stroke:var(--line);stroke-width:1.5;stroke-dasharray:4 4;}
  </style>

  <!-- column headers -->
  <text class="lbl" x="88" y="40" text-anchor="middle">developing DRG</text>
  <text class="lbl" x="272" y="40" text-anchor="middle">adult DRG</text>
  <path d="M168 150 L196 150" stroke="var(--line-strong)" stroke-width="2"/>
  <path d="M188 144 L198 150 L188 156" fill="none" stroke="var(--line-strong)" stroke-width="2"/>
  <text class="small" x="183" y="138" text-anchor="middle">Cre tags</text>
  <text class="small" x="183" y="168" text-anchor="middle">for life</text>

  <!-- DEVELOPING: 3 express Trpv1 (green + star), 1 never does -->
  <g>
    <circle class="onN" cx="88" cy="78" r="16"/><text class="star" x="110" y="84" style="fill:var(--track)">★</text>
    <circle class="onN" cx="88" cy="128" r="16"/><text class="star" x="110" y="134" style="fill:var(--track)">★</text>
    <circle class="onN" cx="88" cy="178" r="16"/><text class="star" x="110" y="184" style="fill:var(--track)">★</text>
    <circle class="offN" cx="88" cy="228" r="16"/>
  </g>
  <text class="small" x="88" y="262" text-anchor="middle">express Trpv1</text>

  <!-- ADULT: same cells; only 1 still green, but 3 keep the star -->
  <g>
    <circle class="onN"  cx="272" cy="78" r="16"/><text class="star" x="294" y="84" style="fill:var(--track)">★</text>
    <circle class="offN" cx="272" cy="128" r="16"/><text class="star" x="294" y="134" style="fill:var(--track)">★</text>
    <circle class="offN" cx="272" cy="178" r="16"/><text class="star" x="294" y="184" style="fill:var(--track)">★</text>
    <circle class="offN" cx="272" cy="228" r="16"/>
  </g>
  <text class="small" x="272" y="262" text-anchor="middle">reporter⁺ (★) &gt; TRPV1⁺ now</text>

  <!-- legend -->
  <circle class="onN" cx="40" cy="288" r="8"/><text class="small" x="54" y="292">TRPV1⁺</text>
  <text class="star" x="150" y="294" style="fill:var(--track)">★</text><text class="small" x="166" y="292">reporter (Cre-marked)</text>
</svg>
