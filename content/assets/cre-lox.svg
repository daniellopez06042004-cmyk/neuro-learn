<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 262" role="img">
  <title>Cre recombinase cutting at loxP</title>
  <desc>A gene: promoter, loxP, STOP, loxP, payload. Cre cuts at the two loxP sites; the STOP cassette leaves together with one loxP, a single loxP remains, and the payload joins up and switches on.</desc>
  <style>
    svg{--text:#22221f;--muted:#5f5e5a;--line:#dcdad1;--line-strong:#b4b2a9;--surface:#ffffff;--surface-2:#efede6;--ok:#0f6e56;--bad:#993c1d;--warn:#ba7517;--track:#5B8DEF;}
    @media (prefers-color-scheme:dark){svg{--text:#f1efe8;--muted:#b4b2a9;--line:#3a3a37;--line-strong:#5f5e5a;--surface:#22221f;--surface-2:#2c2c2a;--ok:#5dcaa5;--bad:#f0997b;--warn:#ef9f27;--track:#7ea6f5;}}
    text{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,sans-serif;fill:var(--text);}
    .lbl{font-size:15px;font-weight:600;}
    .blk{font-size:15px;font-weight:600;fill:#ffffff;}
    .strand{fill:color-mix(in srgb, var(--line-strong) 30%, var(--surface));stroke:var(--line-strong);stroke-width:2;}
    .rung{stroke:var(--line-strong);stroke-width:1.5;opacity:.55;}
    .prom{fill:color-mix(in srgb, var(--muted) 22%, var(--surface));stroke:var(--muted);stroke-width:2;}
    .loxF{fill:color-mix(in srgb, var(--warn) 50%, var(--surface));stroke:var(--warn);stroke-width:2;}
    .stopF{fill:color-mix(in srgb, var(--bad) 55%, var(--surface));stroke:var(--bad);stroke-width:2;}
    .payF{fill:color-mix(in srgb, var(--track) 22%, var(--surface));stroke:var(--track);stroke-width:2;}
    .payLit{fill:var(--track);stroke:var(--track);stroke-width:2;opacity:0;animation:lit 8s ease-in-out infinite;}
    .creBody{fill:color-mix(in srgb, var(--text) 16%, var(--surface));stroke:var(--text);stroke-width:2;}
    .cut{stroke:var(--text);stroke-width:2.5;stroke-linecap:round;}
    /* beats: 1 the floxed gene · 2 Cre arrives and cuts both loxP · 3 the STOP leaves and the DNA joins up · 4 the payload lights */
    .cre{opacity:0;animation:cre 8s ease-in-out infinite;}
    .snip{opacity:0;animation:snip 8s ease-in-out infinite;}
    .drop{animation:drop 8s ease-in-out infinite;}
    .left{animation:closeL 8s ease-in-out infinite;}
    .pay{animation:closeR 8s ease-in-out infinite;}
    .onBadge{opacity:0;animation:badge 8s ease-in-out infinite;}
    @keyframes cre{0%,12%{opacity:0;transform:translateY(-18px)}22%,46%{opacity:1;transform:translateY(0)}58%,100%{opacity:0;transform:translateY(-6px)}}
    @keyframes snip{0%,26%{opacity:0}32%,44%{opacity:1}52%,100%{opacity:0}}
    @keyframes drop{0%,34%{opacity:1;transform:translateY(0)}50%,100%{opacity:0;transform:translateY(48px)}}
    @keyframes closeL{0%,46%{transform:translateX(0)}60%,100%{transform:translateX(58px)}}
    @keyframes closeR{0%,46%{transform:translateX(0)}60%,100%{transform:translateX(-58px)}}
    @keyframes lit{0%,60%{opacity:0}72%,100%{opacity:1}}
    @keyframes badge{0%,64%{opacity:0;transform:scale(.6)}76%,100%{opacity:1;transform:scale(1)}}
    @media (prefers-reduced-motion:reduce){
      .cre{animation:none;opacity:0}
      .snip{animation:none;opacity:0}
      .drop{animation:none;opacity:0}
      .left{animation:none;transform:translateX(58px)}
      .pay{animation:none;transform:translateX(-58px)}
      .payLit{animation:none;opacity:1}
      .onBadge{animation:none;opacity:1;transform:scale(1)}
    }
  </style>

  <!-- ===== upstream piece: promoter + the loxP that stays ===== -->
  <g class="left">
    <rect class="strand" x="12" y="124" width="130" height="13" rx="6"/>
    <rect class="strand" x="12" y="163" width="130" height="13" rx="6"/>
    <g class="rung">
      <line x1="112" y1="137" x2="112" y2="163"/><line x1="124" y1="137" x2="124" y2="163"/><line x1="136" y1="137" x2="136" y2="163"/>
    </g>
    <path class="prom" d="M14 116 L88 116 L104 150 L88 184 L14 184 Z"/>
    <text class="lbl" x="52" y="156" text-anchor="middle">promoter</text>
    <path class="loxF" d="M110 120 L136 150 L110 180 Z"/>
    <text class="lbl" x="118" y="108" text-anchor="middle" style="fill:var(--warn)">loxP</text>
  </g>

  <!-- ===== excised piece: STOP + the second loxP ===== -->
  <g class="drop">
    <rect class="strand" x="142" y="124" width="112" height="13" rx="6"/>
    <rect class="strand" x="142" y="163" width="112" height="13" rx="6"/>
    <rect class="stopF" x="146" y="118" width="74" height="64" rx="10"/>
    <text class="blk" x="183" y="156" text-anchor="middle">STOP</text>
    <path class="loxF" d="M226 120 L252 150 L226 180 Z"/>
    <text class="lbl" x="236" y="108" text-anchor="middle" style="fill:var(--warn)">loxP</text>
  </g>

  <!-- ===== downstream piece: the payload, which joins up and lights ===== -->
  <g class="pay">
    <rect class="strand" x="248" y="124" width="100" height="13" rx="6"/>
    <rect class="strand" x="248" y="163" width="100" height="13" rx="6"/>
    <g class="rung">
      <line x1="252" y1="137" x2="252" y2="163"/><line x1="264" y1="137" x2="264" y2="163"/>
    </g>
    <rect class="payF" x="254" y="118" width="94" height="64" rx="10"/>
    <rect class="payLit" x="254" y="118" width="94" height="64" rx="10"/>
    <text class="lbl" x="301" y="156" text-anchor="middle">payload</text>
  </g>

  <!-- ===== Cre: two subunits astride the DNA, cutting at both loxP ===== -->
  <g class="cre">
    <g transform="translate(181,68)">
      <rect class="creBody" x="-46" y="-26" width="92" height="40" rx="14"/>
      <circle class="creBody" cx="-24" cy="-6" r="9"/>
      <circle class="creBody" cx="24" cy="-6" r="9"/>
      <text class="lbl" x="0" y="0" text-anchor="middle">Cre</text>
    </g>
    <path class="cut" d="M123 86 L123 112"/>
    <path class="cut" d="M239 86 L239 112"/>
  </g>
  <g class="snip">
    <path class="cut" d="M114 114 L132 186"/>
    <path class="cut" d="M230 114 L248 186"/>
  </g>

  <!-- ===== result ===== -->
  <g transform="translate(243,222)">
    <g class="onBadge" style="transform-origin:0 0">
      <rect x="-30" y="-17" width="60" height="32" rx="16" fill="var(--track)"/>
      <text class="blk" x="0" y="5" text-anchor="middle">ON</text>
    </g>
  </g>
</svg>
