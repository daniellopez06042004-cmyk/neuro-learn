<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 320" role="img">
  <title>Why STZ hits β cells: uptake through GLUT2</title>
  <desc>Amber streptozotocin (STZ) molecules sit above two neighbouring cells: a beta cell whose membrane is studded with many GLUT2 transporters, and a GLUT2-low neighbour with one. STZ is carried in through GLUT2, so the beta cell takes up several molecules while the neighbour takes up one; the beta cell's nuclear DNA then breaks, marked with a coral cross and labelled DNA damage. End state: the beta cell is dead — grey, dashed outline, blebbing, marked with a cross — and insulin granules have stopped moving out into the capillary (insulin down), while the GLUT2-low neighbour survives with a tick.</desc>
  <style>
    svg{--text:#22221f;--muted:#5f5e5a;--line:#dcdad1;--line-strong:#b4b2a9;--surface:#ffffff;--surface-2:#efede6;--ok:#0f6e56;--bad:#993c1d;--warn:#ba7517;--track:#7F77DD;}
    @media (prefers-color-scheme:dark){svg{--text:#f1efe8;--muted:#b4b2a9;--line:#3a3a37;--line-strong:#5f5e5a;--surface:#22221f;--surface-2:#2c2c2a;--ok:#5dcaa5;--bad:#f0997b;--warn:#ef9f27;--track:#a39df0;}}
    svg{--t0:color-mix(in srgb,var(--track) 11%,var(--surface));--t1:color-mix(in srgb,var(--track) 26%,var(--surface));--t2:color-mix(in srgb,var(--track) 55%,var(--surface));--m0:color-mix(in srgb,var(--muted) 11%,var(--surface));--m1:color-mix(in srgb,var(--muted) 22%,var(--surface));--m2:color-mix(in srgb,var(--muted) 48%,var(--surface));--w1:color-mix(in srgb,var(--warn) 70%,var(--surface));--b1:color-mix(in srgb,var(--bad) 20%,var(--surface));--ok1:color-mix(in srgb,var(--ok) 20%,var(--surface));--tissue-hi:color-mix(in srgb,#e8b4b0 50%,var(--surface-2));}
    text{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,sans-serif;font-size:15px;font-weight:600;fill:var(--text);}
    .sm{font-size:14px;}
    .dead{fill:color-mix(in srgb,var(--muted) 34%,var(--surface));stroke:none;}
    .live{fill:var(--t0);stroke:none;}
    .edgeA{fill:none;stroke:var(--track);stroke-width:2;stroke-linejoin:round;}
    .edgeD{fill:none;stroke:var(--muted);stroke-width:2;stroke-dasharray:7 5;stroke-linejoin:round;}
    .nuc{fill:var(--t1);stroke:var(--track);stroke-width:2;}
    .dna{fill:none;stroke:var(--t2);stroke-width:2.5;stroke-linecap:round;}
    .oth{fill:var(--m0);stroke:var(--muted);stroke-width:2;stroke-linejoin:round;}
    .othN{fill:var(--m2);stroke:var(--muted);stroke-width:2;}
    .glut{fill:color-mix(in srgb,var(--track) 32%,var(--surface));stroke:var(--track);stroke-width:2;}
    .stz{fill:var(--w1);stroke:var(--warn);stroke-width:2;stroke-linejoin:round;}
    .bleb{fill:var(--m1);stroke:var(--muted);stroke-width:2;}
    .gran,.gs{fill:var(--track);stroke:var(--surface);stroke-width:1.2;}
    .tubeO{fill:none;stroke:var(--line-strong);stroke-width:19;stroke-linecap:round;}
    .tubeW{fill:none;stroke:var(--tissue-hi);stroke-width:15;stroke-linecap:round;}
    .tubeL{fill:none;stroke:var(--surface);stroke-width:6;stroke-linecap:round;}
    .arw{fill:var(--line-strong);}
    /* beats over 9s: 1 STZ waits outside · 2 it rides GLUT2 into the beta cell · 3 its DNA breaks · 4 the beta cell dies, insulin stops, the neighbour lives (held 2.7s) */
    .enter{animation:enter 9s ease-in-out infinite both;}
    .alive{opacity:1;animation:alive 9s ease-in-out infinite;}
    .die{opacity:0;animation:die 9s ease-in-out infinite;}
    .dmg{opacity:0;animation:dmg 9s ease-in-out infinite;}
    .gran{opacity:0;animation:gran 9s linear infinite both;}
    @keyframes enter{0%,12%{transform:translateY(-88px)}32%,100%{transform:translateY(0)}}
    @keyframes alive{0%,52%{opacity:1}66%,96%{opacity:0}100%{opacity:1}}
    @keyframes die{0%,52%{opacity:0}66%,96%{opacity:1}100%{opacity:0}}
    @keyframes dmg{0%,34%{opacity:0}48%,96%{opacity:1}100%{opacity:0}}
    @keyframes gran{0%{offset-distance:0%;opacity:0}3%{opacity:1}28%{offset-distance:100%;opacity:1}32%,100%{offset-distance:100%;opacity:0}}
    @media (prefers-reduced-motion:reduce){*{animation-delay:-8s!important;animation-play-state:paused!important;}}
  </style>

  <!-- capillary the islet secretes into -->
  <path class="tubeO" d="M24 292 C80 282 150 286 206 296"/>
  <path class="tubeW" d="M24 292 C80 282 150 286 206 296"/>
  <path class="tubeL" d="M24 292 C80 282 150 286 206 296"/>
  <polygon class="arw" points="206,286 222,296 206,306"/>

  <!-- ===== beta cell: GLUT2-high ===== -->
  <path class="dead" d="M22 118 Q19 99 37 96 Q73 91 110 95 Q147 91 178 97 Q195 101 191 120 Q198 142 193 162 Q199 182 190 200 Q193 224 176 242 Q166 258 146 262 Q124 272 102 268 Q78 272 58 262 Q38 256 28 242 Q18 228 22 210 Q14 190 20 170 Q14 148 22 118 Z"/>
  <path class="live alive" d="M22 118 Q19 99 37 96 Q73 91 110 95 Q147 91 178 97 Q195 101 191 120 Q198 142 193 162 Q199 182 190 200 Q193 224 176 242 Q166 258 146 262 Q124 272 102 268 Q78 272 58 262 Q38 256 28 242 Q18 228 22 210 Q14 190 20 170 Q14 148 22 118 Z"/>
  <g class="die">
    <circle class="bleb" cx="70" cy="268" r="7"/>
    <circle class="bleb" cx="102" cy="272" r="6"/>
    <circle class="bleb" cx="146" cy="264" r="7"/>
  </g>
  <path class="edgeD die" d="M22 118 Q19 99 37 96 Q73 91 110 95 Q147 91 178 97 Q195 101 191 120 Q198 142 193 162 Q199 182 190 200 Q193 224 176 242 Q166 258 146 262 Q124 272 102 268 Q78 272 58 262 Q38 256 28 242 Q18 228 22 210 Q14 190 20 170 Q14 148 22 118 Z"/>
  <path class="edgeA alive" d="M22 118 Q19 99 37 96 Q73 91 110 95 Q147 91 178 97 Q195 101 191 120 Q198 142 193 162 Q199 182 190 200 Q193 224 176 242 Q166 258 146 262 Q124 272 102 268 Q78 272 58 262 Q38 256 28 242 Q18 228 22 210 Q14 190 20 170 Q14 148 22 118 Z"/>
  <!-- insulin granules stored in the cytoplasm -->
  <g class="alive">
    <circle class="gs" cx="36" cy="148" r="5"/>
    <circle class="gs" cx="168" cy="154" r="5"/>
    <circle class="gs" cx="176" cy="218" r="5"/>
    <circle class="gs" cx="160" cy="238" r="5"/>
    <circle class="gs" cx="46" cy="234" r="5"/>
    <circle class="gs" cx="86" cy="256" r="5"/>
    <circle class="gs" cx="124" cy="256" r="5"/>
  </g>

  <!-- nucleus with its DNA -->
  <ellipse class="nuc" cx="104" cy="184" rx="56" ry="36"/>
  <path class="dna" d="M56 184 Q68 166 80 184 Q92 202 104 184 Q116 166 128 184 Q140 202 152 186"/>
  <path class="dna" d="M56 184 Q68 202 80 184 Q92 166 104 184 Q116 202 128 184 Q140 166 152 182"/>
  <g class="dmg">
    <rect x="95" y="157" width="18" height="54" style="fill:var(--t1)"/>
    <path d="M97 177 L111 191 M111 177 L97 191" style="fill:none;stroke:var(--bad);stroke-width:3;stroke-linecap:round"/>
  </g>

  <!-- GLUT2 transporters: many -->
  <rect class="glut" x="43" y="80" width="14" height="32" rx="7"/>
  <rect class="glut" x="73" y="80" width="14" height="32" rx="7"/>
  <rect class="glut" x="103" y="80" width="14" height="32" rx="7"/>
  <rect class="glut" x="133" y="80" width="14" height="32" rx="7"/>
  <rect class="glut" x="163" y="80" width="14" height="32" rx="7"/>

  <!-- ===== neighbouring cell: GLUT2-low ===== -->
  <path class="oth" d="M216 118 Q213 100 231 96 Q262 91 292 95 Q321 91 335 99 Q345 105 341 122 Q347 144 340 162 Q345 182 333 196 Q321 210 302 210 Q280 218 258 211 Q236 208 226 194 Q214 180 218 164 Q210 144 216 118 Z"/>
  <ellipse class="othN" cx="296" cy="172" rx="26" ry="18"/>
  <rect class="glut" x="243" y="80" width="14" height="32" rx="7"/>

  <!-- STZ molecules -->
  <g transform="translate(50,124)"><g class="enter"><polygon class="stz" points="0,-9 7.8,-4.5 7.8,4.5 0,9 -7.8,4.5 -7.8,-4.5"/></g></g>
  <g transform="translate(80,124)"><g class="enter" style="animation-delay:0.12s"><polygon class="stz" points="0,-9 7.8,-4.5 7.8,4.5 0,9 -7.8,4.5 -7.8,-4.5"/></g></g>
  <g transform="translate(110,124)"><g class="enter" style="animation-delay:0.24s"><polygon class="stz" points="0,-9 7.8,-4.5 7.8,4.5 0,9 -7.8,4.5 -7.8,-4.5"/></g></g>
  <g transform="translate(140,124)"><g class="enter" style="animation-delay:0.36s"><polygon class="stz" points="0,-9 7.8,-4.5 7.8,4.5 0,9 -7.8,4.5 -7.8,-4.5"/></g></g>
  <g transform="translate(250,124)"><g class="enter" style="animation-delay:0.3s"><polygon class="stz" points="0,-9 7.8,-4.5 7.8,4.5 0,9 -7.8,4.5 -7.8,-4.5"/></g></g>
  <g transform="translate(272,36)"><polygon class="stz" points="0,-9 7.8,-4.5 7.8,4.5 0,9 -7.8,4.5 -7.8,-4.5"/></g>

  <!-- insulin granules leaving the beta cell, until it dies -->
  <circle class="gran" r="4" style="offset-path:path('M42 214 C32 250 56 278 104 286 C150 292 180 292 204 295')"/>
  <circle class="gran" r="4" style="offset-path:path('M42 214 C32 250 56 278 104 286 C150 292 180 292 204 295');animation-delay:0.6s"/>
  <circle class="gran" r="4" style="offset-path:path('M42 214 C32 250 56 278 104 286 C150 292 180 292 204 295');animation-delay:1.2s"/>

  <!-- outcome badges -->
  <g class="die">
    <circle cx="28" cy="246" r="15" style="fill:var(--b1);stroke:var(--bad);stroke-width:2"/>
    <path d="M19 237 L37 255 M37 237 L19 255" style="fill:none;stroke:var(--bad);stroke-width:3.2;stroke-linecap:round"/>
    <circle cx="320" cy="132" r="13" style="fill:var(--ok1);stroke:var(--ok);stroke-width:2"/>
    <path d="M313.5 132.5 L318.5 138 L327 126.5" style="fill:none;stroke:var(--ok);stroke-width:2.8;stroke-linecap:round;stroke-linejoin:round"/>
  </g>

  <!-- labels -->
  <text x="238" y="42" text-anchor="end" style="fill:var(--warn)">STZ</text>
  <text x="16" y="74">β cell</text>
  <text x="192" y="74" text-anchor="end" style="fill:var(--track)">GLUT2</text>
  <text class="dmg" x="104" y="242" text-anchor="middle" style="fill:var(--bad)">DNA damage</text>
  <text class="sm" x="272" y="240" text-anchor="middle" style="fill:var(--muted)">GLUT2-low neighbour</text>
  <text class="die" x="226" y="302" style="fill:var(--bad)">insulin ↓</text>
</svg>
