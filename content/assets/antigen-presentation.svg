  <g class="tc"><rect class="mhc" x="216" y="67" width="24" height="10" rx="3"/><path class="mhc" d="M222 58 h-18 v8 h10 v12 h-10 v8 h18 Z"/><path class="cT" d="M317.4 72 C317.3 82.9 313.5 96.2 306.9 104.3 C300.4 112.4 288.4 118.6 278.2 120.5 C268 122.5 254.4 121.3 245.6 116.1 C236.7 110.9 228.4 99.2 225 89.1 C221.6 78.9 221.9 65.3 225.3 55.1 C228.8 44.8 236.6 33.2 245.4 27.7 C254.3 22.1 268.1 20 278.5 21.9 C288.8 23.8 301.1 30.8 307.6 39.2 C314.1 47.5 317.6 61.1 317.4 72Z" style="fill:var(--t0)"/><path class="eng" d="M317.4 72 C317.3 82.9 313.5 96.2 306.9 104.3 C300.4 112.4 288.4 118.6 278.2 120.5 C268 122.5 254.4 121.3 245.6 116.1 C236.7 110.9 228.4 99.2 225 89.1 C221.6 78.9 221.9 65.3 225.3 55.1 C228.8 44.8 236.6 33.2 245.4 27.7 C254.3 22.1 268.1 20 278.5 21.9 C288.8 23.8 301.1 30.8 307.6 39.2 C314.1 47.5 317.6 61.1 317.4 72Z" style="fill:var(--t1);stroke:var(--track);stroke-width:2"/><path class="nT" d="M306.7 76 C306.8 82.6 302.3 90.7 297.2 95.8 C292.1 101 283.2 106.8 276 106.9 C268.8 107 259 101.6 254.1 96.5 C249.3 91.3 247.2 83 247 76 C246.9 69 248.4 59.2 253.2 54.7 C258 50.2 268.7 48.7 276 49 C283.3 49.3 291.8 52 296.9 56.5 C302 61 306.7 69.4 306.7 76Z"/><text x="276" y="70" text-anchor="middle">cytotoxic</text><text x="276" y="87" text-anchor="middle">T cell</text></g>
  <ellipse class="halo" cx="204" cy="72" rx="20" ry="20"/>
  <text x="44" y="46">infected cell</text>
  <text x="192" y="118" text-anchor="end" style="fill:var(--track)">MHC I</text>
  <text x="200" y="118" style="fill:var(--track)">TCR</text>
