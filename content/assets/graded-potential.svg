<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 290" role="img" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>Receptor potentials are graded</title>
  <desc>A membrane-voltage trace: a small stimulus makes a small depolarization, a larger stimulus a larger one, and the largest stimulus pushes the voltage past threshold, triggering an all-or-none action potential spike.</desc>
  <style>
    svg{--text:#22221f;--muted:#5f5e5a;--line:#dcdad1;--line-strong:#b4b2a9;--surface:#ffffff;--surface-2:#efede6;--warn:#ba7517;--track:#1D9E75;}
    @media (prefers-color-scheme:dark){svg{--text:#f1efe8;--muted:#b4b2a9;--line:#3a3a37;--line-strong:#5f5e5a;--surface:#22221f;--surface-2:#2c2c2a;--warn:#ef9f27;--track:#32c48f;}}
    text{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,sans-serif;fill:var(--text);}
    .lbl{font-size:14px;font-weight:600;} .small{font-size:12px;font-weight:400;fill:var(--muted);}
    .axis{stroke:var(--line-strong);stroke-width:1.5;}
    .thr{stroke:var(--warn);stroke-width:1.5;stroke-dasharray:5 4;}
    .trace{fill:none;stroke:var(--track);stroke-width:3;stroke-linecap:round;stroke-linejoin:round;
           stroke-dasharray:640;stroke-dashoffset:640;animation:draw 6s ease-in-out infinite;}
    .stim{fill:var(--line-strong);}
    @keyframes draw{0%,8%{stroke-dashoffset:640}72%,100%{stroke-dashoffset:0}}
    @media (prefers-reduced-motion:reduce){.trace{animation:none;stroke-dashoffset:0}}
  </style>

  <!-- threshold + axes -->
  <line class="thr"  x1="34" y1="96"  x2="344" y2="96"/>
  <line class="axis" x1="34" y1="40"  x2="34"  y2="212"/>
  <line class="axis" x1="34" y1="212" x2="344" y2="212"/>
  <text class="lbl" x="40" y="90" style="fill:var(--warn)">threshold</text>
  <text class="small" x="10" y="130" transform="rotate(-90 10 130)" text-anchor="middle">mV</text>

  <!-- stimulus markers under the baseline -->
  <rect class="stim" x="60"  y="222" width="30" height="6" rx="3"/>
  <rect class="stim" x="140" y="220" width="36" height="10" rx="4"/>
  <rect class="stim" x="226" y="216" width="40" height="16" rx="5"/>
  <text class="small" x="75"  y="246" text-anchor="middle">small</text>
  <text class="small" x="158" y="246" text-anchor="middle">larger</text>
  <text class="small" x="246" y="246" text-anchor="middle">largest</text>

  <!-- the trace: three graded bumps, the third fires a spike -->
  <path class="trace" d="M38 185 L58 185 Q75 165 92 185 L128 185 Q158 135 188 185 L214 185 Q232 150 242 98 L248 50 L258 205 L270 185 L344 185"/>

  <!-- annotations -->
  <text class="small" x="110" y="160">graded receptor potentials</text>
  <text class="lbl" x="262" y="56" style="fill:var(--track)">spike</text>

  <text class="small" x="180" y="278" text-anchor="middle">bigger stimulus → bigger response; cross threshold → a spike</text>
</svg>
