<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 340" role="img"
     aria-label="CreER sits inert in the cytoplasm until tamoxifen is added; then it enters the nucleus, recombines the DNA, and the nucleus pulses green as the gene switches on." xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <style>
    .bg{fill:#f5f7fb}.ink{fill:#131722}.muted{fill:#5b6472}
    .cyto{fill:#eaf0fb;stroke:#c3ccda}.nuc{fill:#dbe6f7;stroke:#8aa0c8}.dna{stroke:#8aa0c8}
    .creer{fill:#5B8DEF}.tam{fill:#f0a83a;stroke:#c9881f}.stop{fill:#e0607a}
    .greenP{fill:#2fd08a}.ring{fill:none;stroke:#2fd08a}
    .label{font:600 16px -apple-system,sans-serif}.sub{font:400 13px -apple-system,sans-serif}.tag{font:700 13px -apple-system,sans-serif}
    @media (prefers-color-scheme:dark){.bg{fill:#0f1420}.ink{fill:#eef1f7}.muted{fill:#9aa4b5}.cyto{fill:#141b2b;stroke:#283040}.nuc{fill:#223052;stroke:#4a5f8a}.dna{stroke:#4a5f8a}}
    .tamdrop{animation:tamd 6s ease-in infinite}@keyframes tamd{0%{transform:translate(0,-90px);opacity:0}12%{transform:translate(0,0);opacity:1}24%{opacity:1}30%,100%{opacity:0}}
    .move{animation:mv 6s ease-in-out infinite}@keyframes mv{0%,24%{transform:translate(0,0)}42%{transform:translate(300px,70px)}100%{transform:translate(300px,70px)}}
    .excise{animation:ex 6s ease-in-out infinite}@keyframes ex{0%,46%{opacity:1}58%{opacity:0}100%{opacity:0}}
    .onB{transform-box:fill-box;transform-origin:center;animation:ob 6s ease-in-out infinite}
    @keyframes ob{0%,58%{transform:scale(1)}68%{transform:scale(1.1)}80%{transform:scale(1)}90%{transform:scale(1.06)}100%{transform:scale(1)}}
    .onT{animation:ot 6s ease-in-out infinite}@keyframes ot{0%,58%{opacity:0}70%{opacity:.85}84%{opacity:.4}100%{opacity:.5}}
    .onR{transform-box:fill-box;transform-origin:center;animation:orr 6s ease-out infinite}@keyframes orr{0%,58%{transform:scale(.5);opacity:0}64%{opacity:.5}92%{opacity:0}100%{transform:scale(1.9);opacity:0}}
    .onbadge{transform-box:fill-box;transform-origin:center;animation:pop 6s ease-in-out infinite}@keyframes pop{0%,60%{opacity:0;transform:scale(.5)}72%{opacity:1;transform:scale(1)}100%{opacity:1}}
  </style>
  <rect class="bg" x="0" y="0" width="820" height="340" rx="18"/>
  <ellipse class="cyto" cx="410" cy="185" rx="360" ry="120" stroke-width="3"/>
  <text class="sub muted" x="120" y="110" text-anchor="middle">cytoplasm</text>

  <!-- nucleus with green pulse -->
  <circle class="ring onR" cx="560" cy="190" r="86" stroke-width="3"/>
  <g class="onB">
    <circle class="nuc" cx="560" cy="190" r="86" stroke-width="3"/>
    <circle class="greenP onT" cx="560" cy="190" r="86"/>
  </g>
  <text class="sub muted" x="560" y="120" text-anchor="middle">nucleus</text>
  <line class="dna" x1="500" y1="210" x2="620" y2="210" stroke-width="6" stroke-linecap="round"/>
  <g class="excise"><rect class="stop" x="544" y="198" width="36" height="24" rx="5"/></g>

  <!-- CreER moves in -->
  <g class="move"><g transform="translate(180,190)"><rect class="creer" x="-34" y="-16" width="68" height="32" rx="16"/><text class="tag" x="0" y="5" text-anchor="middle" fill="#fff">CreER</text></g></g>
  <!-- tamoxifen -->
  <g class="tamdrop" transform="translate(180,150)"><polygon class="tam" points="0,-11 9,-5 9,6 0,12 -9,6 -9,-5" stroke-width="2"/><text class="sub ink" x="0" y="-18" text-anchor="middle">tamoxifen</text></g>
  <!-- ON badge -->
  <g class="onbadge" transform="translate(560,120)"><rect x="-24" y="-17" width="48" height="30" rx="15" fill="#2fd08a"/><text class="tag" x="0" y="4" text-anchor="middle" fill="#fff">ON</text></g>

  <text class="label ink" x="410" y="322" text-anchor="middle">No tamoxifen → CreER stuck outside · + tamoxifen → enters nucleus → gene ON</text>
</svg>
