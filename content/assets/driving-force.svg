<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 320" role="img" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>Driving force on ions at rest</title>
  <desc>A voltage scale from +60 mV down to −90 mV. The membrane rests at −70 mV. Sodium's equilibrium is +60 mV, far above rest, so sodium has a large inward driving force; potassium's equilibrium is −90 mV, just below rest, so potassium has a small outward driving force.</desc>
  <style>
    svg{--text:#22221f;--muted:#5f5e5a;--line:#dcdad1;--line-strong:#b4b2a9;--surface:#ffffff;--surface-2:#efede6;--warn:#ba7517;--track:#1D9E75;}
    @media (prefers-color-scheme:dark){svg{--text:#f1efe8;--muted:#b4b2a9;--line:#3a3a37;--line-strong:#5f5e5a;--surface:#22221f;--surface-2:#2c2c2a;--warn:#ef9f27;--track:#32c48f;}}
    text{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,sans-serif;fill:var(--text);}
    .lbl{font-size:14px;font-weight:600;} .small{font-size:12px;font-weight:400;fill:var(--muted);}
    .axis{stroke:var(--line-strong);stroke-width:2;}
    .rest{stroke:var(--text);stroke-width:2;stroke-dasharray:6 4;}
    .eq{stroke:var(--line-strong);stroke-width:1.5;stroke-dasharray:4 4;}
  </style>

  <!-- scale axis -->
  <line class="axis" x1="60" y1="52" x2="60" y2="268"/>
  <text class="small" x="56" y="64" text-anchor="end">+60</text>
  <text class="small" x="56" y="237" text-anchor="end">−70</text>
  <text class="small" x="56" y="264" text-anchor="end">−90</text>
  <text class="small" x="20" y="160" transform="rotate(-90 20 160)" text-anchor="middle">membrane mV</text>

  <!-- equilibrium + rest lines -->
  <line class="eq"   x1="60" y1="60"  x2="300" y2="60"/>
  <line class="rest" x1="60" y1="233" x2="320" y2="233"/>
  <line class="eq"   x1="60" y1="260" x2="300" y2="260"/>
  <text class="lbl" x="150" y="54" style="fill:var(--track)">E_Na = +60</text>
  <text class="lbl" x="200" y="229">rest = −70 mV</text>
  <text class="lbl" x="150" y="275" style="fill:var(--warn)">E_K = −90</text>

  <!-- Na driving force: long arrow up from rest to E_Na -->
  <line x1="120" y1="233" x2="120" y2="70" stroke="var(--track)" stroke-width="7" stroke-linecap="round"/>
  <path d="M110 82 L120 62 L130 82 Z" fill="var(--track)"/>
  <text class="lbl" x="136" y="150" style="fill:var(--track)">Na⁺ in</text>
  <text class="small" x="136" y="166">large driving force</text>

  <!-- K driving force: short arrow down from rest to E_K -->
  <line x1="250" y1="233" x2="250" y2="250" stroke="var(--warn)" stroke-width="7" stroke-linecap="round"/>
  <path d="M242 242 L250 258 L258 242 Z" fill="var(--warn)"/>
  <text class="lbl" x="266" y="246" style="fill:var(--warn)">K⁺ out</text>
  <text class="small" x="266" y="262">small</text>

  <text class="small" x="180" y="300" text-anchor="middle">driving force = distance from Vm to E_ion</text>
</svg>
