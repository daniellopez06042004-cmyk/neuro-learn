<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 354" role="img">
  <title>Bulk averages; single-cell sees each cell</title>
  <desc>A tissue of cells in which most are off and a rare few are bright. Bulk RNA-seq grinds the tissue up and reports one blended average, a short bar that hides the bright subset. Single-cell RNA-seq gives one dot per cell: most cells sit low and a rare subset sits high, two separate groups, and the bulk average falls between them where no cell actually is. The end state shows both panels side by side.</desc>
  <style>
    svg{--text:#22221f;--muted:#5f5e5a;--line:#dcdad1;--line-strong:#b4b2a9;--surface:#ffffff;--surface-2:#efede6;--ok:#0f6e56;--bad:#993c1d;--warn:#ba7517;--track:#5B8DEF;}
    @media (prefers-color-scheme:dark){svg{--text:#f1efe8;--muted:#b4b2a9;--line:#3a3a37;--line-strong:#5f5e5a;--surface:#22221f;--surface-2:#2c2c2a;--ok:#5dcaa5;--bad:#f0997b;--warn:#ef9f27;--track:#7ea6f5;}}
    svg{--tissue:color-mix(in srgb,#e8b4b0 30%,var(--surface-2));--track-1:color-mix(in srgb,var(--track) 22%,var(--surface));--track-2:color-mix(in srgb,var(--track) 55%,var(--surface));--n1:color-mix(in srgb,var(--line-strong) 32%,var(--surface));--n2:color-mix(in srgb,var(--line-strong) 75%,var(--surface));--mix:color-mix(in srgb,var(--track) 40%,var(--n2));}
    text{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,sans-serif;font-size:15px;font-weight:600;fill:var(--text);}
    .ax-l{font-size:14px;font-weight:400;fill:var(--muted);}
    .tissue{fill:var(--tissue);stroke:var(--line-strong);stroke-width:2;}
    .off path{fill:var(--n1);stroke:var(--line-strong);stroke-width:1.5;}
    .off .nu{fill:var(--n2);}
    .on path{fill:var(--track);stroke:var(--track);stroke-width:2;}
    .on .nu{fill:var(--track-1);}
    .panel{fill:var(--surface-2);stroke:var(--line);stroke-width:1.5;}
    .axis{fill:none;stroke:var(--line-strong);stroke-width:2;stroke-linecap:round;}
    .arw{fill:none;stroke:var(--line-strong);stroke-width:3;stroke-linecap:round;stroke-linejoin:round;}
    .bar{fill:var(--mix);stroke:var(--muted);stroke-width:1.5;}
    .avg{fill:none;stroke:var(--text);stroke-width:2;stroke-dasharray:6 4;}
    .dOff{fill:var(--n2);stroke:var(--line-strong);stroke-width:1.5;}
    .dOn{fill:var(--track);stroke:var(--surface);stroke-width:1.5;}
    /* beats: 1 the tissue, mostly off with a rare bright subset · 2 bulk: one blended average bar · 3 single-cell: one dot per cell, two groups, the average sits between them · 4 hold */
    .grow{transform-box:fill-box;transform-origin:50% 100%;animation:grow 9s ease-in-out infinite;}
    .b2{opacity:0;animation:b2 9s ease-in-out infinite;}
    .b3{opacity:0;animation:b3 9s ease-in-out infinite;}
    .d1{opacity:0;animation:d1 9s ease-out infinite;}
    .d2{opacity:0;animation:d2 9s ease-out infinite;}
    .hi{opacity:0;animation:hi 9s ease-out infinite;}
    @keyframes grow{0%,18%{transform:scaleY(0)}32%,95%{transform:scaleY(1)}100%{transform:scaleY(0)}}
    @keyframes b2{0%,26%{opacity:0}34%,95%{opacity:1}100%{opacity:0}}
    @keyframes d1{0%,40%{opacity:0;transform:translateY(-14px)}48%,95%{opacity:1;transform:translateY(0)}100%{opacity:0}}
    @keyframes d2{0%,44%{opacity:0;transform:translateY(-14px)}52%,95%{opacity:1;transform:translateY(0)}100%{opacity:0}}
    @keyframes hi{0%,48%{opacity:0;transform:translateY(-14px)}56%,95%{opacity:1;transform:translateY(0)}100%{opacity:0}}
    @keyframes b3{0%,56%{opacity:0}64%,95%{opacity:1}100%{opacity:0}}
    @media (prefers-reduced-motion:reduce){
      .grow{animation:none;transform:none}
      .b2,.b3,.d1,.d2,.hi{animation:none;opacity:1;transform:none}
    }
  </style>

  <!-- tissue: mostly-off cells with a rare bright subset -->
