<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 324" role="img">
  <title>DREADD control grid</title>
  <desc>A two-by-two grid of DREADD present or absent against actuator or vehicle. Only the DREADD-plus-actuator cell responds; the three controls show no response.</desc>
  <style>
    svg{--text:#22221f;--muted:#5f5e5a;--line:#dcdad1;--line-strong:#b4b2a9;--surface:#ffffff;--surface-2:#efede6;--ok:#0f6e56;--warn:#ba7517;--track:#5B8DEF;}
    @media (prefers-color-scheme:dark){svg{--text:#f1efe8;--muted:#b4b2a9;--line:#3a3a37;--line-strong:#5f5e5a;--surface:#22221f;--surface-2:#2c2c2a;--ok:#5dcaa5;--warn:#ef9f27;--track:#7ea6f5;}}
    text{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,sans-serif;fill:var(--text);}
    .hd{font-size:15px;font-weight:600;}
    .st{font-size:14px;font-weight:600;}
    .cell{fill:color-mix(in srgb, var(--line-strong) 10%, var(--surface));stroke:var(--line);stroke-width:1.5;}
    .cellOn{fill:color-mix(in srgb, var(--track) 14%, var(--surface));stroke:var(--track);stroke-width:2;opacity:0;animation:cellOn 7s ease-in-out infinite;}
    .den{fill:none;stroke:var(--line-strong);stroke-width:2.5;stroke-linecap:round;}
    .axon{fill:none;stroke:var(--line-strong);stroke-width:2.5;stroke-linecap:round;}
    .soma{fill:color-mix(in srgb, var(--line-strong) 22%, var(--surface));stroke:var(--line-strong);stroke-width:2.5;}
    .nuc{fill:color-mix(in srgb, var(--line-strong) 50%, var(--surface));}
    .somaOn{fill:var(--track);stroke:var(--track);stroke-width:2.5;opacity:0;animation:somaOn 7s ease-in-out infinite;}
    .nucOn{fill:color-mix(in srgb, var(--surface) 70%, var(--track));opacity:0;animation:somaOn 7s ease-in-out infinite;}
    .rec{fill:color-mix(in srgb, var(--track) 26%, var(--surface));stroke:color-mix(in srgb, var(--track) 65%, var(--text));stroke-width:2;}
    .ring{fill:none;stroke:var(--track);stroke-width:2.5;opacity:0;animation:ring 7s ease-out infinite;}
    .drug{fill:color-mix(in srgb, var(--warn) 70%, var(--surface));stroke:var(--warn);stroke-width:2;}
    .vehicle{fill:none;stroke:var(--muted);stroke-width:2;stroke-dasharray:4 4;}
    /* beats: 1 the four conditions · 2 actuator or vehicle is given · 3 one quadrant responds · 4 hold */
    .fall{opacity:0;animation:fall 7s ease-in-out infinite;}
    .v1{opacity:0;animation:verd 7s ease-in-out infinite;}
    @keyframes fall{0%,8%{opacity:0;transform:translateY(-16px)}22%,100%{opacity:1;transform:translateY(0)}}
    @keyframes somaOn{0%,38%{opacity:0}50%,100%{opacity:1}}
    @keyframes cellOn{0%,38%{opacity:0}52%,100%{opacity:1}}
    @keyframes ring{0%,40%{opacity:0;transform:scale(.7)}54%{opacity:.5;transform:scale(1.1)}70%,100%{opacity:0;transform:scale(1.7)}}
    @keyframes verd{0%,52%{opacity:0}64%,100%{opacity:1}}
    @media (prefers-reduced-motion:reduce){
      .fall{animation:none;opacity:1;transform:none}
      .somaOn,.nucOn{animation:none;opacity:1}
      .cellOn{animation:none;opacity:1}
      .ring{animation:none;opacity:0}
      .v1{animation:none;opacity:1}
    }
  </style>

  <!-- ===== headers ===== -->
  <text class="hd" x="115" y="32" text-anchor="middle">actuator</text>
  <text class="hd" x="273" y="32" text-anchor="middle">vehicle</text>
  <text class="hd" x="24" y="109" text-anchor="middle" transform="rotate(-90 24 109)">DREADD +</text>
  <text class="hd" x="24" y="247" text-anchor="middle" transform="rotate(-90 24 247)">DREADD −</text>

  <!-- ===== cells ===== -->
  <rect class="cell" x="40" y="44" width="150" height="130" rx="12"/>
  <rect class="cell" x="198" y="44" width="150" height="130" rx="12"/>
  <rect class="cell" x="40" y="182" width="150" height="130" rx="12"/>
  <rect class="cell" x="198" y="182" width="150" height="130" rx="12"/>
  <rect class="cellOn" x="40" y="44" width="150" height="130" rx="12"/>

  <!-- ===== DREADD + / actuator: responds ===== -->
  <g transform="translate(115,106)">
    <g class="den">
      <path d="M-7,-12 C-15,-23 -22,-28 -29,-35"/><path d="M-19,-25 L-27,-27"/>
      <path d="M7,-12 C15,-23 22,-28 29,-35"/><path d="M19,-25 L27,-27"/>
      <path d="M-12,-6 C-23,-12 -31,-14 -39,-13"/><path d="M-28,-12 L-33,-18"/>
    </g>
    <path class="axon" d="M16,2 L52,2"/>
    <circle class="ring" r="16" style="transform-origin:0 0"/>
    <circle class="soma" r="16"/>
    <circle class="nuc" r="5.5"/>
    <circle class="somaOn" r="16"/>
    <circle class="nucOn" r="5.5"/>
    <g transform="translate(0,-16)">
      <rect class="rec" x="-11" y="-9" width="8" height="20" rx="3"/>
      <rect class="rec" x="3" y="-9" width="8" height="20" rx="3"/>
    </g>
  </g>
  <g class="fall"><polygon class="drug" points="115,62 125,68 125,80 115,86 105,80 105,68"/></g>
  <g class="v1"><text class="st" x="115" y="158" text-anchor="middle" style="fill:var(--ok)">✓ responds</text></g>

  <!-- ===== DREADD + / vehicle ===== -->
  <g transform="translate(273,106)">
    <g class="den">
      <path d="M-7,-12 C-15,-23 -22,-28 -29,-35"/><path d="M-19,-25 L-27,-27"/>
      <path d="M7,-12 C15,-23 22,-28 29,-35"/><path d="M19,-25 L27,-27"/>
      <path d="M-12,-6 C-23,-12 -31,-14 -39,-13"/><path d="M-28,-12 L-33,-18"/>
    </g>
    <path class="axon" d="M16,2 L52,2"/>
    <circle class="soma" r="16"/>
    <circle class="nuc" r="5.5"/>
    <g transform="translate(0,-16)">
      <rect class="rec" x="-11" y="-9" width="8" height="20" rx="3"/>
      <rect class="rec" x="3" y="-9" width="8" height="20" rx="3"/>
    </g>
  </g>
  <g class="fall"><polygon class="vehicle" points="273,62 283,68 283,80 273,86 263,80 263,68"/></g>
  <g class="v1"><text class="st" x="273" y="158" text-anchor="middle" style="fill:var(--muted)">no response</text></g>

  <!-- ===== DREADD − / actuator ===== -->
  <g transform="translate(115,244)">
    <g class="den">
      <path d="M-7,-12 C-15,-23 -22,-28 -29,-35"/><path d="M-19,-25 L-27,-27"/>
      <path d="M7,-12 C15,-23 22,-28 29,-35"/><path d="M19,-25 L27,-27"/>
      <path d="M-12,-6 C-23,-12 -31,-14 -39,-13"/><path d="M-28,-12 L-33,-18"/>
    </g>
    <path class="axon" d="M16,2 L52,2"/>
    <circle class="soma" r="16"/>
    <circle class="nuc" r="5.5"/>
  </g>
  <g class="fall"><polygon class="drug" points="115,200 125,206 125,218 115,224 105,218 105,206"/></g>
  <g class="v1"><text class="st" x="115" y="296" text-anchor="middle" style="fill:var(--muted)">no response</text></g>

  <!-- ===== DREADD − / vehicle ===== -->
  <g transform="translate(273,244)">
    <g class="den">
      <path d="M-7,-12 C-15,-23 -22,-28 -29,-35"/><path d="M-19,-25 L-27,-27"/>
      <path d="M7,-12 C15,-23 22,-28 29,-35"/><path d="M19,-25 L27,-27"/>
      <path d="M-12,-6 C-23,-12 -31,-14 -39,-13"/><path d="M-28,-12 L-33,-18"/>
    </g>
    <path class="axon" d="M16,2 L52,2"/>
    <circle class="soma" r="16"/>
    <circle class="nuc" r="5.5"/>
  </g>
  <g class="fall"><polygon class="vehicle" points="273,200 283,206 283,218 273,224 263,218 263,206"/></g>
  <g class="v1"><text class="st" x="273" y="296" text-anchor="middle" style="fill:var(--muted)">no response</text></g>
</svg>
